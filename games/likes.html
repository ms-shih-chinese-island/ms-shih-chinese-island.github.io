<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>爱吃不爱吃 Yummy or Yucky?</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 爱吃不爱吃：看图拼句子（跟医院的看病一样）。一个小朋友、一两样食物，上面有 👍 👎 ❓，
   把字卡拖进句子的空格：我爱吃饺子。我不爱喝汽水。我爱吃汉堡包和薯条。我不知道。
   Level 1（二年级）：爱吃、不爱吃、爱喝、不爱喝（不用「和」）
   Level 2（三年级）：加「和」、我不知道（❓）
   Level 3（四年级）：喜欢吃、不喜欢吃、喜欢喝、不喜欢喝＋「和」
   汤用「喝」：我爱喝酸辣汤。
   一样 👍 一样 👎：不能用「和」，要拼两个句子。
   👂 听：图上没有 👍 👎，电脑念句子，照听到的拼（多一颗金币）
   用法：likes.html?unit=restaurant（字在 units/restaurant/words.js，图在 units/restaurant/art.js） */
body.game { background: #FFF3E6; }
.likes { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 820px) { .likes { grid-template-columns: 1fr; } }
.scene { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 22px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }
.scene .kid svg { width: 120px; height: 120px; display: block; }
.scene .nm { font: 700 14px var(--f-latin); }
.foods { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.food { position: relative; width: 112px; height: 112px; background: #FFFDF6; border: 3px solid #2B2B2B; border-radius: 18px; padding: 4px; }
.food svg { width: 100%; height: 100%; display: block; }
.food .bd { position: absolute; right: -10px; top: -12px; font-size: 34px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
.qn { position: absolute; left: 10px; top: 8px; }
.work { display: flex; flex-direction: column; gap: 10px; }
.sents { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.sent { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; }
.sent .fix .py { font-size: 14px; } .sent .fix .zh { font-size: clamp(26px, 3.4vw, 34px); }
.sent .dropSlot { min-width: 100px; min-height: 58px; }
.sent .dropSlot.filled { border-color: var(--me); background: var(--me-done); }
.sent .dropSlot .ruby .py { font-size: 13px; } .sent .dropSlot .ruby .zh { font-size: clamp(24px, 3vw, 30px); }
.sent .en { flex-basis: 100%; font: 600 14px var(--f-latin); color: var(--muted); min-height: 16px; }
.hearBig { align-self: flex-start; }
.bank .wcard .zh { font-size: 26px; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill" id="timer">0:00</span>
      <button class="ctl" id="timerBtn" type="button"></button>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="likes">
        <div class="scene" id="scene"></div>
        <div class="work">
          <div class="sents" id="sents"></div>
          <div class="bank" id="bank"></div>
        </div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/kids.js"></script>
<script src="../units/restaurant/art.js"></script>
<script src="../shared/rest.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.likes, KIDS = window.ART, RART = window.RART;
  const $ = id => document.getElementById(id);
  const { pick, take, shuffle } = Rest;
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  const timerEl = $('timer'), timer = Shih.timer(timerEl);
  const timerOn = Shih.toggle($('timerBtn'), 'timer', '⏱ Timer on', '⏱ Timer off', true, on => { timerEl.hidden = !on; });
  Shih.soundButton($('soundBtn'));
  const mode = Rest.modeRow(() => { buildLevels(); setup(); });
  const LEVELS = UNIT.levels;
  let level = Shih.startLevel('likesLevel', LEVELS.length);
  let paintLevels = () => {};
  function buildLevels() { paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('likesLevel', lv); setup(); }); }
  buildLevels();

  // ---- 动词卡（照 Level） ----
  //   [中文, 拼音, 英文]；不爱 念 bú ài
  const V = {
    1: { yes: ['爱吃', 'ài chī', 'love to eat'], no: ['不爱吃', 'bú ài chī', "don't like to eat"], yesD: ['爱喝', 'ài hē', 'love to drink'], noD: ['不爱喝', 'bú ài hē', "don't like to drink"] },
    3: { yes: ['喜欢吃', 'xǐ huān chī', 'like to eat'], no: ['不喜欢吃', 'bù xǐ huān chī', "don't like to eat"], yesD: ['喜欢喝', 'xǐ huān hē', 'like to drink'], noD: ['不喜欢喝', 'bù xǐ huān hē', "don't like to drink"] }
  };
  const verbs = () => V[level >= 3 ? 3 : 1];
  const DUNNO = ['不知道', 'bù zhī dào', "don't know"];
  const items = () => UNIT.pool(level, 'food').concat(UNIT.pool(level, 'drink'));
  const sip = w => !!w.drink || w.menu === '汤';     // 喝的：饮料、汤（「喝汤」不说「吃汤」）

  // ---- 出一题：foods = [{ w, feel: 'yes' | 'no' | 'dunno' }]，lines = 句子 ----
  function makeRound(prev) {
    const all = items().filter(w => !prev || !prev.includes(w.zh));
    const r = Math.random();
    let foods;
    if (level === 2 && r < 0.15) foods = [{ w: pick(all.filter(w => !sip(w))), feel: 'dunno' }];
    else if (level >= 2 && r < 0.75) {
      const drink = Math.random() < 0.2;
      const two = take(all.filter(w => sip(w) === drink), 2);
      const kind = Math.random();
      foods = kind < 0.4 ? two.map(w => ({ w, feel: 'yes' })) : kind < 0.7 ? two.map(w => ({ w, feel: 'no' })) : [{ w: two[0], feel: 'yes' }, { w: two[1], feel: 'no' }];
    } else foods = [{ w: pick(all), feel: Math.random() < 0.55 ? 'yes' : 'no' }];
    // 句子：同一个感觉的放在一句（用「和」）；不同的分开
    const lines = [];
    const groups = foods[0].feel === 'dunno' ? [[foods[0]]] : (foods.length === 2 && foods[0].feel === foods[1].feel ? [foods] : foods.map(f => [f]));
    groups.forEach(g => {
      const f = g[0];
      if (f.feel === 'dunno') { lines.push({ verb: DUNNO, foods: [], en: "I don't know." }); return; }
      const v = verbs()[(f.feel === 'yes' ? 'yes' : 'no') + (sip(f.w) ? 'D' : '')];
      // 英文：汤不说 drink soup，说 I love / I don't like ___ soup
      const soup = g.some(x => x.w.menu === '汤');
      const enV = soup ? (f.feel === 'yes' ? (level >= 3 ? 'like' : 'love') : "don't like") : v[2];
      lines.push({ verb: v, foods: g.map(x => x.w), en: `I ${enV} ${g.map(x => x.w.en).join(' and ')}.` });
    });
    return { foods, lines };
  }
  const lineZh = L => '我' + L.verb[0] + L.foods.map(w => w.zh).join('和') + '。';

  // ---- 画面 ----
  let rounds = [], ri = 0, done = 0, total = 0, busy = false, playing = false;
  const BADGE = { yes: '👍', no: '👎', dunno: '❓' };
  function speakRound() { Rest.speak(rounds[ri].lines.map(lineZh).join('')); }
  function show() {
    const r = rounds[ri], listen = mode() === 'listen';
    busy = false;
    $('scene').innerHTML = `<span class="pill qn">${ri + 1} / ${rounds.length}</span><div class="kid">${KIDS.kid(r.kid, 'good')}</div><span class="nm">${Shih.esc(r.kid.first)}</span>` +
      `<div class="foods">${r.foods.map(f => `<div class="food" aria-label="${Shih.esc(f.w.en)}">${RART.svg(f.w.zh)}${listen ? '' : `<span class="bd">${BADGE[f.feel]}</span>`}</div>`).join('')}</div>` +
      (listen ? `<button class="ctl hearBig" id="hearBtn" type="button">🔊 Listen again</button>` : '');
    if (listen) $('hearBtn').addEventListener('click', speakRound);
    const fix = (zh, py) => `<span class="ruby fix">${Shih.ruby(zh, py)}</span>`;
    $('sents').innerHTML = r.lines.map((L, li) => {
      let h = fix('我', 'wǒ') + `<span class="dropSlot" data-li="${li}" data-k="verb"></span>`;
      L.foods.forEach((w, k) => { if (k) h += fix('和', 'hé'); h += `<span class="dropSlot" data-li="${li}" data-k="food"></span>`; });
      return `<div class="sent">${h}${fix('。', '')}<span class="en" data-en="${li}"></span></div>`;
    }).join('');
    // 字卡：对的＋干扰（别的动词、别的食物）
    const need = [];
    r.lines.forEach(L => { need.push({ t: 'verb', v: L.verb }); L.foods.forEach(w => need.push({ t: 'food', w })); });
    const V0 = verbs(), allVerbs = [V0.yes, V0.no, V0.yesD, V0.noD].concat(level === 2 ? [DUNNO] : []);
    const haveV = new Set(need.filter(n => n.t === 'verb').map(n => n.v[0]));
    const extraV = take(allVerbs.filter(v => !haveV.has(v[0])), 2).map(v => ({ t: 'verb', v }));
    const haveF = new Set(need.filter(n => n.t === 'food').map(n => n.w.zh));
    const extraF = take(items().filter(w => !haveF.has(w.zh) && !r.foods.some(f => f.w.zh === w.zh)), 2).map(w => ({ t: 'food', w }));
    $('bank').innerHTML = '';
    const cards = shuffle(need.concat(extraV, extraF)).map(c => {
      const el = document.createElement('div');
      el.className = 'wcard'; el.dataset.t = c.t;
      el.dataset.zh = c.t === 'verb' ? c.v[0] : c.w.zh;
      el.innerHTML = c.t === 'verb' ? `<span class="ruby">${Shih.ruby(c.v[0], c.v[1])}</span>` : `<span class="ruby">${Shih.ruby(c.w.zh, c.w.py)}</span>${Rest.alt(c.w)}`;
      $('bank').appendChild(el);
      return el;
    });
    const dnd = Shih.dragCards(cards, {
      slots: () => [...$('sents').querySelectorAll('.dropSlot:not(.filled)')],
      accept(card, slot) {
        const L = r.lines[+slot.dataset.li];
        let ok = false;
        if (slot.dataset.k === 'verb') ok = card.dataset.zh === L.verb[0];
        else {
          const used = [...$('sents').querySelectorAll(`.dropSlot.filled[data-li="${slot.dataset.li}"][data-k="food"]`)].map(s => s.dataset.zh);
          ok = L.foods.some(w => w.zh === card.dataset.zh) && !used.includes(card.dataset.zh);
        }
        if (!ok) return false;
        card.classList.add('used');
        slot.classList.add('filled'); slot.dataset.zh = card.dataset.zh;
        slot.innerHTML = card.innerHTML;
        done++; update();
        if (![...$('sents').querySelectorAll(`.dropSlot[data-li="${slot.dataset.li}"]`)].some(s => !s.classList.contains('filled'))) {
          $('sents').querySelector(`[data-en="${slot.dataset.li}"]`).textContent = L.en;
          Rest.speak(lineZh(L));
        }
        if (!$('sents').querySelector('.dropSlot:not(.filled)') && !busy) {
          busy = true;
          if (mode() === 'listen') $('scene').querySelectorAll('.food').forEach((f, i) => f.insertAdjacentHTML('beforeend', `<span class="bd">${BADGE[r.foods[i].feel]}</span>`));
          setTimeout(() => {
            ri++;
            if (ri >= rounds.length) {
              const ms = timer.stop();
              $('winTime').textContent = timerOn() ? 'Time: ' + Shih.fmt(ms) : '';
              $('winMsg').hidden = false; Shih.speak('太棒了');
            } else show();
          }, 700);
        }
        return true;
      }
    });
    $('sents').querySelectorAll('.dropSlot').forEach(s => s.addEventListener('click', () => dnd.tapSlot(s)));
    if (playing && listen) setTimeout(speakRound, 300);
  }
  function update() { $('score').textContent = `${done} / ${total}`; }
  const wait = Shih.startCover($('playArea'), () => { playing = true; if (timerOn()) timer.start(); if (mode() === 'listen') speakRound(); });
  function setup() {
    paintLevels(level); playing = false;
    $('help').textContent = mode() === 'listen'
      ? 'Listen 🔊 and build what you hear. Drag the cards into the sentence, or tap a card, then tap a box.'
      : 'Look at 👍 👎' + (level === 2 ? ' ❓' : '') + '. Drag the cards into the sentence, or tap a card, then tap a box.';
    const kids = shuffle(KIDS.people);
    rounds = [];
    for (let i = 0; i < (C.rounds || 6); i++) {
      const prev = rounds[rounds.length - 1];
      const r = makeRound(prev && prev.foods.map(f => f.w.zh));
      r.kid = kids[i % kids.length]; rounds.push(r);
    }
    total = rounds.reduce((s, r) => s + r.lines.reduce((t, L) => t + 1 + L.foods.length, 0), 0);
    ri = 0; done = 0;
    timer.reset(); $('winMsg').hidden = true; update();
    show();
    window.__likes = { round: () => rounds[ri], level: () => level, mode };
    wait();
  }
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
