<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>拼音小侦探 Pinyin Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 拼音小侦探：看一个字（可以按 🔊 听），选出对的拼音。用法：detective.html?unit=hello */
body.game { background: #E6F4F8; }
.box { max-width: 860px; margin: 0 auto; background: var(--card); border: 3px solid var(--ink); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.top { align-self: stretch; display: flex; justify-content: space-between; align-items: center; }
.qnum { font-weight: 700; color: var(--sea-ink); background: #D6EEF5; border: 2px solid #7FC4D8; border-radius: 999px; padding: 2px 12px; font-size: 16px; }
.glass { font-size: 30px; }
.word { display: flex; align-items: center; gap: 18px; }
.char { font: 700 clamp(84px, 13vw, 130px)/1 var(--f-zh); background: #FFF6D6; border: 4px solid #E9B949; border-radius: 24px; padding: 10px 26px 16px; }
.listen { font: 700 18px var(--f-latin); cursor: pointer; background: #fff; border: 3px solid var(--ink); border-radius: 999px; width: 74px; height: 74px; box-shadow: 0 4px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.listen .ic { font-size: 30px; } .listen small { font-size: 12px; margin-top: 2px; }
.listen:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.mean { font: 700 20px var(--f-latin); color: var(--muted); margin-top: -6px; }
.q { font: 700 20px var(--f-latin); }
.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 100%; }
@media (max-width: 640px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt { font: 700 clamp(26px, 3.6vw, 36px) var(--f-latin); color: var(--sea-ink); cursor: pointer; background: #E3F0FB; border: 3px solid #5B9BD5; border-radius: 18px;
  box-shadow: 0 4px 0 #3B78B5; padding: 16px 6px; }
.opt.right { background: var(--me-done); border-color: var(--me-ink); box-shadow: 0 4px 0 var(--me-ink); color: var(--ink); }
.opt.wrong { opacity: .35; animation: shake .35s; cursor: default; }
.tip { min-height: 52px; display: flex; align-items: center; gap: 10px; font: 700 20px var(--f-latin); color: #8A5A2B; background: #FFF6D6; border: 2px dashed #E9B949; border-radius: 14px; padding: 8px 16px; }
.tip[hidden] { display: none; }
.tip b { font-size: 26px; color: #B4471C; }
@media (orientation: landscape) and (max-height: 720px) {
  .box { gap: 8px; padding: 10px; }
  .char { font-size: 64px; padding: 6px 16px 10px; }
  .listen { width: 58px; height: 58px; } .listen .ic { font-size: 24px; }
  .mean, .q { font-size: 16px; }
  .opt { padding: 8px 6px; font-size: 24px; }
  .tip { min-height: 0; font-size: 16px; padding: 4px 12px; }
}
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill" id="timer">0:00</span>
      <button class="ctl" id="timerBtn" type="button"></button>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <p class="help">Look at the word. Which pinyin is right? Tap 🔊 to hear it.</p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winScore"></span> <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner"><div class="box" id="box"></div></div>
  </div>

<script src="../shared/common.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const D = UNIT.detective;
  document.title = `${D.title.zh} ${D.title.en}`;
  document.getElementById('titleRuby').innerHTML = Shih.ruby(D.title.zh, D.title.py);
  document.getElementById('titleEn').textContent = D.title.en;
  document.getElementById('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  const box = document.getElementById('box'), scoreEl = document.getElementById('score');
  const winMsg = document.getElementById('winMsg'), winTime = document.getElementById('winTime'), winScore = document.getElementById('winScore');
  const timerEl = document.getElementById('timer'), timer = Shih.timer(timerEl);
  const timerOn = Shih.toggle(document.getElementById('timerBtn'), 'timer', '⏱ Timer on', '⏱ Timer off', true, on => { timerEl.hidden = !on; });
  Shih.soundButton(document.getElementById('soundBtn'));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  // 提示里把这一题在练的那个拼音标出来
  const tipHTML = s => Shih.esc(s.tip).replace(new RegExp('^' + s.key), `<b>${s.key}</b>`);

  let qs = [], qi = 0, firstTry = 0, missed = false, busy = false;
  const update = () => { scoreEl.textContent = `${firstTry} / ${qs.length}`; };

  function show() {
    const q = qs[qi];
    missed = false; busy = false;
    const opts = shuffle([q.w.py].concat(q.w.no));
    box.innerHTML = `<div class="top"><span class="qnum">${qi + 1} / ${qs.length}</span><span class="glass" aria-hidden="true">🔍</span></div>` +
      `<div class="word"><span class="char">${Shih.esc(q.w.zh)}</span><button type="button" class="listen" id="listen" aria-label="Listen"><span class="ic">🔊</span><small>Listen</small></button></div>` +
      `<span class="mean">${Shih.esc(q.w.en)}</span>` +
      `<span class="q">Which pinyin is right?</span>` +
      `<div class="opts">${opts.map((p, k) => `<button type="button" class="opt" data-k="${k}">${Shih.esc(p)}</button>`).join('')}</div>` +
      `<div class="tip" id="tip" hidden></div>`;
    document.getElementById('listen').addEventListener('click', () => Shih.speak(q.w.zh));
    const tip = document.getElementById('tip');
    box.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      if (busy || b.disabled) return;
      if (opts[+b.dataset.k] !== q.w.py) {
        b.classList.add('wrong'); b.disabled = true; missed = true;
        tip.innerHTML = '💡 ' + tipHTML(q.s); tip.hidden = false;   // 选错了：给提示，再选一次
        return;
      }
      busy = true;
      b.classList.add('right'); Shih.coin(1, b);
      box.querySelectorAll('.opt').forEach(x => { x.disabled = true; });
      tip.innerHTML = '✓ ' + tipHTML(q.s); tip.hidden = false;
      Shih.speak(q.w.zh);
      if (!missed) firstTry++;
      update();
      qi++;
      if (qi === qs.length) {
        const ms = timer.stop();
        winScore.textContent = `${firstTry} / ${qs.length} on the first try.`;
        winTime.textContent = timerOn() ? 'Time: ' + Shih.fmt(ms) : '';
        setTimeout(() => { winMsg.hidden = false; }, 400);
      } else setTimeout(show, 1300);
    }));
  }

  const wait = Shih.startCover(document.getElementById('playArea'), () => { if (timerOn()) timer.start(); });
  function setup() {
    // 挑几个不同的音，每个音出一题，顺序打乱
    const used = new Set();   // 同一个字不会在一回合出现两次
    qs = shuffle(D.sounds).slice(0, D.count || D.sounds.length).map(s => {
      const w = pick(s.words.filter(x => !used.has(x.zh))) || pick(s.words);
      used.add(w.zh);
      return { s, w };
    });
    qi = 0; firstTry = 0;
    timer.reset(); winMsg.hidden = true; update();
    show();
    wait();
  }
  document.getElementById('resetBtn').addEventListener('click', setup);
  document.getElementById('againBtn').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
