<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>邮局柜台</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 邮局柜台：数信、买邮票。左边是柜台上的信，右边是问题和句子，把数字卡、颜色卡拉进空格。
   Level 1：这里有＿封＿＿的信。（信都是同一个颜色，不问问题，有拼音）
   Level 2：我有＿封＿＿的信。我有＿封＿＿的信。（两种颜色混在一起，两种都要回答，有拼音）
   Level 3：我有＿封＿＿的信。我要买＿张邮票。（两句，一句一行）（有一两封已经贴好邮票，只买没贴的；邮票不用跟信同颜色；没有拼音）
   三级都不写中文的问题，直接填句子（英文说明在上面）；三级都有拼音
   说明下面有一行量词的解释：封（信）、张（邮票，Level 3）
   拉错了卡片摇一摇、弹回去（不算错）。时间内做完就有金币（units/community/words.js 的 UNIT.counter） */
body.game { background: #E6F4F8; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.desk { position: relative; background: #EBCFA4; border: 4px solid #2B2B2B; border-radius: 22px; padding: 16px; min-height: 300px; box-shadow: inset 0 -14px 0 #D8B482; }
.pile { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-content: center; min-height: 260px; padding-top: 10px; }
.env { width: 92px; height: 62px; border: 3px solid #2B2B2B; border-radius: 7px; position: relative; box-sizing: border-box; }
.env::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 58%; background: linear-gradient(to top right, transparent calc(50% - 1.5px), #2B2B2B calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)) left / 50% 100% no-repeat, linear-gradient(to top left, transparent calc(50% - 1.5px), #2B2B2B calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)) right / 50% 100% no-repeat; opacity: .7; }
/* 邮票的位置（Level 3）：右上角一个虚线小格；买好了贴上邮票 */
.env .spot { position: absolute; right: 5px; top: 5px; width: 22px; height: 26px; border: 2px dashed #2B2B2B; border-radius: 3px; background: rgba(255, 255, 255, .5); }
.env .spot.on { border: 2px solid #2B2B2B; outline: 3px dotted #FFFFFF; outline-offset: -5px; }
.panel { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.q { background: #FFF6D6; border: 3px solid #E9B949; border-radius: 16px; padding: 8px 12px; text-align: center; }
.q .ruby { flex-wrap: wrap; justify-content: center; }
.q .ruby .py { font-size: 13px; } .q .ruby .zh, .q .w { font-size: 26px; font-weight: 700; }
.q .again { margin-left: 6px; background: #FFFFFF; border: 2px solid #2B2B2B; border-radius: 10px; font-size: 18px; cursor: pointer; vertical-align: middle; }
.sent { display: flex; align-items: flex-end; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 70px; }
.sent .ruby .py { font-size: 14px; } .sent .ruby .zh, .sent .w { font-size: 30px; font-weight: 700; }
.sent .dropSlot { min-width: 64px; min-height: 58px; padding: 2px 8px; }
.sent .dropSlot.wide { min-width: 100px; }
.sent .dropSlot .ruby .zh, .sent .dropSlot .w { font-size: 28px; }
.sent .brk { flex-basis: 100%; height: 0; }
.nb { display: inline-flex; white-space: nowrap; gap: 3px; align-items: flex-end; }
.ruby > .nb { flex-direction: row; } .nb > span { display: flex; flex-direction: column; align-items: center; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.bank .wcard { min-width: 56px; justify-content: center; }
.bank .wcard .py { font-size: 13px; } .bank .wcard .zh { font-size: 26px; font-weight: 700; }
.bank .wcard .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #2B2B2B; margin-right: 4px; vertical-align: middle; }
.bank .wcard.oops { animation: shake .35s; border-color: var(--bad); }
.mw { text-align: center; margin: -4px auto 10px; max-width: 760px; background: #FFF6D6; border: 2px solid #E9B949; border-radius: 14px; padding: 4px 12px; font: 600 16px var(--f-latin); }
.mw .ruby .py { font-size: 11px; } .mw .ruby .zh { font-size: 20px; }
.mw .mwl { display: flex; align-items: flex-end; justify-content: center; gap: 6px; flex-wrap: wrap; } .mw .mwl > span:not(.ruby) { padding-bottom: 3px; }
.timer.low { background: #FCE3E0; border-color: var(--bad); }
.timeUp { text-align: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 18px; padding: 10px; margin: 0 auto 10px; max-width: 640px; font: 700 18px var(--f-latin); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.timeUp .ruby .py { font-size: 12px; } .timeUp .ruby .zh { font-size: 26px; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill timer" id="timer">0:00</span>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <p class="mw" id="mw"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>
  <div class="timeUp" id="timeUp" hidden><span class="ruby" id="timeUpRuby"></span><span id="timeUpTxt"></span><button class="ctl" id="again2" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="wrap">
        <div class="desk"><div id="pileBox"></div></div>
        <div class="panel">
                    <div class="sent" id="sent"></div>
          <div class="bank" id="bank"></div>
        </div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.counter, COLORS = UNIT.post.colors, NUMS = C.numbers;
  const $ = id => document.getElementById(id);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  $('timeUpRuby').innerHTML = Shih.ruby('时间到了', 'shí jiān dào le');
  // 量词的说明：封 = 信的量词；张 = 邮票（扁扁、平平的东西）的量词
  const mwLine = (w, wp, ex, exp, en, what) => `<div class="mwl">💡 <span class="ruby">${Shih.ruby(w, wp)}</span> <span>is a measure word for ${what}:</span> <span class="ruby">${Shih.ruby(ex, exp)}</span> <span>= ${en}</span></div>`;
  const mwHTML = lv => mwLine('封', 'fēng', '一封信', 'yì fēng xìn', 'one letter', 'letters') +
    (lv === 3 ? mwLine('张', 'zhāng', '一张邮票', 'yì zhāng yóu piào', 'one stamp', 'flat things like stamps') : '');
  Shih.soundButton($('soundBtn'));

  const timerEl = $('timer');
  const LIMIT = lv => C.time[lv - 1] * 1000;
  let left = 0, lastT = 0, tick = 0, running = false;
  const fmt = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  function loop() {
    if (!running) return;
    const now = performance.now(); left -= now - lastT; lastT = now;
    timerEl.textContent = '⏱ ' + fmt(Math.max(0, left)); timerEl.classList.toggle('low', left < 15000);
    if (left <= 0) { running = false; $('timeUpTxt').textContent = `Time's up! ${qi} of ${qs.length} done. Try again!`; $('timeUp').hidden = false; Shih.speak('时间到了'); return; }
    tick = requestAnimationFrame(loop);
  }

  const LEVELS = [{ note: '这里有 + pinyin' }, { note: '我有 × 2 + pinyin' }, { note: '我要买 + pinyin' }];
  let level = Shih.startLevel('counterLevel', 3);
  const paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('counterLevel', lv); setup(); });
  const HELP = ['Count the letters on the counter. Drag the number and the color into the sentence.',
                'How many letters of each color do you have? Answer with two sentences.',
                'How many letters do you have, and what color? Some letters already have stamps. How many stamps do you need to buy?'];
  const oops = el => { el.classList.remove('oops'); void el.offsetWidth; el.classList.add('oops'); setTimeout(() => el.classList.remove('oops'), 400); };
  const py = () => true;   // 三级都有拼音
  // 句子照逗号、句号分段，每段不会从中间断开
  const ruby = (zh, p) => {
    if (!py()) return `<span class="w">${zh}</span>`;
    const zs = zh.split(/(?<=[，。？])/).filter(Boolean), ps = (p || '').split(/(?<=[,.?])/).filter(Boolean);
    return `<span class="ruby">${zs.map((z, i) => `<span class="nb">${Shih.rubyText(z, ps[i] || '')}</span>`).join('')}</span>`;
  };
  const fillTpl = (t, map) => t.replace(/\{(\w)\}/g, (m, k) => map[k] != null ? map[k] : m);

  let qs = [], qi = 0;
  function makeQuestions() {
    const out = [], used = new Set();
    for (let i = 0; i < C.rounds; i++) {
      let n;
      do { n = level === 1 ? rnd(1, 5) : level === 2 ? rnd(1, 6) : rnd(3, 10); } while (used.has(n) && used.size < 5);
      used.add(n);
      const [c, other] = shuffle(COLORS);
      let m = 0;
      if (level === 2) do { m = rnd(1, 6); } while (m === n);
      if (level === 3) m = n - rnd(1, 2);          // 有一两封已经贴好邮票了
      out.push({ n, c, other, m });
    }
    return out;
  }
  const stampHex = c => c.zh === '红色' ? '#F5C531' : '#E5483B';   // 邮票不用跟信同颜色（红信就用黄色的邮票，才看得到）
  const env = (c, spot, done) => `<div class="env" style="background:${c.hex}">${spot ? `<span class="spot${done ? ' on' : ''}"${done ? ` style="background:${stampHex(c)}"` : ''}></span>` : ''}</div>`;

  function show() {
    const q = qs[qi], F = C.frames[level - 1];
    // 柜台上的信（三级都一样：放在木头柜台上）
    let envs = Array.from({ length: q.n }, (_, i) => ({ c: q.c, done: level === 3 && i >= q.m }));
    if (level === 2) envs = envs.concat(Array.from({ length: q.m }, () => ({ c: q.other })));
    $('pileBox').innerHTML = `<div class="pile">${shuffle(envs).map(e => env(e.c, level === 3, e.done)).join('')}</div>`;
    q.say = '';
    // 句子：{n}{c}{m}{d} 是空格
    const parts = F.a.zh.split(/(\{[ncmd]\})/), pparts = (F.a.py || '').split(/(\{[ncmd]\})/);
    $('sent').innerHTML = parts.map((p, i) => {
      if (/^\{[ncmd]\}$/.test(p)) return `<span class="dropSlot${/[cd]/.test(p) ? ' wide' : ''}" data-role="${p[1]}"></span>`;
      if (!p) return '';
      // 两句话：句号后面换行，一句一行
      const brk = /。./.test(p) ? p.indexOf('。') + 1 : 0;
      if (brk) { const pp = (pparts[i] || '').trim(), k = pp.indexOf('.') + 1; return ruby(p.slice(0, brk), pp.slice(0, k)) + '<span class="brk"></span>' + ruby(p.slice(brk), pp.slice(k).trim()); }
      return ruby(p, (pparts[i] || '').trim());
    }).join('');
    // 每个空格要什么：Level 2 两句的颜色先说哪一种都可以
    const groups = level === 2 ? [{ n: q.n, c: q.c }, { n: q.m, c: q.other }] : null;
    const sentOf = role => (role === 'n' || role === 'c') ? 0 : 1;
    const pick = [null, null];      // Level 2：第一句、第二句各是哪一种颜色
    function want(role) {
      if (level !== 2) return role === 'n' ? NUMS[q.n - 1].zh : role === 'c' ? q.c.zh : NUMS[q.m - 1].zh;
      const k = sentOf(role), cand = pick[k] ? [pick[k]] : groups.filter(g => g !== pick[1 - k]);
      return cand.map(g => (role === 'n' || role === 'm') ? NUMS[g.n - 1].zh : g.c.zh);
    }
    // 字卡：对的数字（Level 2、3 两个）+ 别的数字，对的颜色（Level 2 两个）+ 别的颜色
    const right = [NUMS[q.n - 1]].concat(level > 1 ? [NUMS[q.m - 1]] : []);
    const nOpts = right.concat(shuffle(NUMS.filter(x => !right.includes(x) && x.n <= (level === 1 ? 5 : 10))).slice(0, level === 1 ? 3 : 2));
    const cOpts = [q.c].concat(level === 2 ? [q.other] : []).concat(shuffle(COLORS.filter(x => x !== q.c && x !== q.other)).slice(0, level === 2 ? 1 : 2));
    const opts = shuffle(nOpts).concat(shuffle(cOpts));
    $('bank').innerHTML = '';
    const cards = opts.map(t => {
      const el = document.createElement('div');
      el.className = 'wcard'; el.dataset.zh = t.zh;
      el.innerHTML = py() ? `<span class="ruby">${Shih.ruby(t.zh, t.py)}</span>` : `<span class="zh">${t.zh}</span>`;
      $('bank').appendChild(el); return el;
    });
    const dnd = Shih.dragCards(cards, {
      slots: () => [...$('sent').querySelectorAll('.dropSlot:not(.filled)')],
      accept(card, slot) {
        if (!running) return true;
        const role = slot.dataset.role, w = [].concat(want(role));
        if (!w.includes(card.dataset.zh)) { oops(card); return true; }   // 拉错：摇一摇（不算错）
        if (level === 2) { const k = sentOf(role); pick[k] = groups.find(g => g.c.zh === card.dataset.zh || NUMS[g.n - 1].zh === card.dataset.zh); }
        const t = opts.find(x => x.zh === card.dataset.zh);
        card.classList.add('used'); slot.classList.add('filled'); slot.dataset.zh = t.zh;
        slot.innerHTML = py() ? `<span class="ruby">${Shih.ruby(t.zh, t.py)}</span>` : `<span class="w">${t.zh}</span>`;
        if ($('sent').querySelector('.dropSlot:not(.filled)')) return true;
        Shih.speak([...$('sent').childNodes].map(x => x.classList && x.classList.contains('dropSlot') ? x.dataset.zh : x.textContent.replace(/[a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü\s]/gi, '')).join(''));
        if (level === 3) $('pileBox').querySelectorAll('.spot:not(.on)').forEach(s => { s.classList.add('on'); s.style.background = stampHex(q.c); });   // 邮票贴上去
        qi++; update();
        if (qi >= qs.length) {
          running = false; cancelAnimationFrame(tick);
          $('winTime').textContent = 'Time left: ' + fmt(Math.max(0, left));
          setTimeout(() => { $('winMsg').hidden = false; Shih.speak('太棒了'); }, 900);
        } else setTimeout(() => { if (running) show(); }, 1300);
        return true;
      }
    });
    $('sent').querySelectorAll('.dropSlot').forEach(d => d.addEventListener('click', () => { if (!d.classList.contains('filled')) dnd.tapSlot(d); }));
    window.__ct = { roles: [...$('sent').querySelectorAll('.dropSlot')].map(s => s.dataset.role), n: NUMS[q.n - 1].zh, c: q.c.zh, m: q.m ? NUMS[q.m - 1].zh : null, d: q.other.zh, qi };
  }
  function setup() {
    paintLevels(level);
    $('help').textContent = HELP[level - 1] + ` Finish ${C.rounds} in ${fmt(LIMIT(level))} to get coins!`;
    $('mw').innerHTML = mwHTML(level);
    qs = makeQuestions(); qi = 0;
    running = false; cancelAnimationFrame(tick); left = LIMIT(level); timerEl.textContent = '⏱ ' + fmt(left); timerEl.classList.remove('low');
    $('winMsg').hidden = true; $('timeUp').hidden = true; update();
    show(); wait();
  }
  function update() { $('score').textContent = `${qi} / ${qs.length}`; }
  const wait = Shih.startCover($('playArea'), () => { running = true; lastT = performance.now(); tick = requestAnimationFrame(loop); });
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  $('again2').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
