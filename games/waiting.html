<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>候诊室 Waiting Room</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 候诊室：一张图一个病人（人数在 words.js 的 people），头上一个对话泡泡，用拆开的字卡帮他排好句子
   （拖进空格、点卡片再点空格，或点空格再点卡片）。字卡里会多放几张长得像、位置靠近的部位当干扰。
   Level 1 这是／我的／鼻子（健康检查，每个小朋友指着一个地方）、Level 2 我的／肚子／疼（每个病人有一个地方疼）。
   小病人的画法在 shared/patient.js。用法：waiting.html?unit=body */
body.game { background: #F2F8FB; }
.room { margin-bottom: 12px; display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 10px; align-items: stretch; }
/* 每个人一个小房间：墙隔开，门上一块 Room 1／Room 2 的牌子 */
.patient.exam { position: relative; background: #E6F4F8; border: 4px solid var(--ink); border-radius: 18px; padding: 10px 10px 8px;
  background-image: linear-gradient(to bottom, transparent 74%, #CFE6F0 74%); }
/* 门牌：钉子上两条绳子挂着一块木牌，挂在墙上、病人的左手边（跟病人的头差不多高） */
.roomSign { position: absolute; top: 17%; left: 8px; width: 104px; transform: rotate(-4deg); transform-origin: 50% 0; }
.roomSign svg { display: block; width: 100%; height: auto; }
.patient { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.patient svg { height: clamp(140px, calc(100vh - 425px), 300px); width: auto; max-width: 100%; display: block; }
.room { max-width: 860px; margin-left: auto; margin-right: auto; gap: 14px; }
.room.solo { max-width: 460px; }
.room.next { animation: nextIn .45s ease-out; } @keyframes nextIn { from { opacity: 0; transform: translateX(40px); } }
.roundNo { text-align: center; font-weight: 700; color: var(--muted); margin: -4px 0 6px; }
/* 对话泡泡：下面有一个小尾巴指着病人 */
.bubble { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 8px 10px; border-radius: 18px; border: 3px solid var(--ink); background: #FFFFFF; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); border: 11px solid transparent; border-top-color: var(--ink); }
.bubble.ok { border-color: var(--me-ink); background: var(--me-soft); }
.bubble .dropSlot { min-width: 74px; min-height: 60px; }
.bubble .dropSlot .py { font-size: 13px; } .bubble .dropSlot .zh { font-size: 24px; }
.bubble .punct { font: 700 28px var(--f-zh); padding-bottom: 4px; }
.bank .wcard { min-height: 62px; }
.bank .wcard .py { font-size: 13px; } .bank .wcard .zh { font-size: 24px; }
@media (orientation: landscape) and (max-height: 720px) {
  .patient svg { height: clamp(140px, calc(100vh - 405px), 300px); }
  .bubble .dropSlot { min-height: 52px; min-width: 64px; } .bubble .dropSlot .zh { font-size: 21px; }
  .bank { padding: 8px; gap: 8px; } .bank .wcard { min-height: 54px; padding: 4px 10px; } .bank .wcard .zh { font-size: 21px; }
}
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="roundNo" id="roundNo"></div>
      <div class="room" id="room"></div>
      <div class="bank" id="bank"></div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/kids.js"></script>
<script src="../shared/patient.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.waiting, PT = ShihPatient;
  const $ = id => document.getElementById(id);
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.rubyText(C.done.zh, C.done.py);
  Shih.soundButton($('soundBtn'));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const W = Shih.wordMap(UNIT);
  const tpl = () => level === 1 ? UNIT.doctor.say1 : UNIT.doctor.say2;
  const sentence = zh => { const t = tpl(); return { zh: t.zh.replace('{x}', zh), py: t.py.replace('{x}', W[zh].py) }; };

  let level = Shih.startLevel('waitingLevel', UNIT.levels.length);
  const paintLevels = Shih.levelButtons($('levels'), UNIT.levels, level, null, lv => { level = lv; Shih.set('waitingLevel', lv); setup(); });
  const wait = Shih.startCover($('playArea'), () => {});
  let total = 0, done = 0;

  // 干扰卡：跟答案长得像、位置靠近、容易搞混的部位（没教到的会跳过，不够再随便补）
  const LIKE = {
    '手': ['手臂', '手指', '脚'], '脚': ['脚趾头', '腿', '手'], '手指': ['手', '脚趾头', '手臂'], '脚趾头': ['脚', '手指', '膝盖'],
    '膝盖': ['腿', '脚', '肩膀'], '腿': ['膝盖', '脚', '手臂'], '手臂': ['手', '腿', '肩膀'], '肩膀': ['手臂', '脖子', '背'],
    '脖子': ['肩膀', '头', '背'], '头': ['脸', '脖子', '耳朵'], '脸': ['头', '鼻子', '嘴巴'], '眼睛': ['耳朵', '鼻子', '嘴巴'],
    '耳朵': ['眼睛', '鼻子', '头'], '鼻子': ['嘴巴', '眼睛', '脸'], '嘴巴': ['鼻子', '脸', '眼睛'], '肚子': ['背', '肩膀', '脖子'],
    '背': ['肚子', '肩膀', '脖子']
  };
  function trapsFor(parts, n) {
    const ok = UNIT.words.filter(w => (w.level || 1) <= level).map(w => w.zh).filter(z => !parts.includes(z));
    const near = shuffle([...new Set(parts.flatMap(z => LIKE[z] || []))].filter(z => ok.includes(z)));
    return near.concat(shuffle(ok.filter(z => !near.includes(z)))).slice(0, n);
  }
  // 一关的题目：一张图一个人时，8 张图的部位都不一样（Level 2 大约七成用三年级新字）
  function pickRounds() {
    if (C.people === 1) {
      const n = C.rounds;
      if (level === 1) return shuffle(at(1)).slice(0, n).map(z => [z]);
      const k = Math.min(at(2).length, Math.round(n * (C.newShare || 0.7)));
      return shuffle(shuffle(at(2)).slice(0, k).concat(shuffle(at(1)).slice(0, n - k))).map(z => [z]);
    }
    return Array.from({ length: C.rounds }, () => pickParts(C.people));
  }
  // 一张图好几个人时：部位都不一样；很像的一对（脚／脚趾头、手／手指、腿／膝盖）不会同时出现；脸上的部位最多一个
  const FACE = ['脸', '眼睛', '耳朵', '鼻子', '嘴巴'];
  const NEAR = { '腿': '膝盖', '膝盖': '腿' };
  const at = lv => UNIT.words.filter(w => (w.level || 1) === lv).map(w => w.zh);
  const clash = (list, z) => list.includes(z) || list.some(x => PT.PAIR[x] === z || NEAR[x] === z) || (FACE.includes(z) && list.some(x => FACE.includes(x)));
  function pickParts(n) {
    const out = [];
    const add = (list, max) => shuffle(list).forEach(z => { if (out.length < max && !clash(out, z)) out.push(z); });
    // Level 2：每个人大约七成的机会用三年级新字
    if (level >= 2) add(at(2), Array.from({ length: n }, () => Math.random() < (C.newShare || 0.7)).filter(Boolean).length);
    add(at(1), n);
    add(UNIT.words.filter(w => (w.level || 1) <= level).map(w => w.zh), n);
    return shuffle(out);
  }
  // 句子拆成字卡：Level 1 这是／我的／部位；Level 2 我的／部位／疼
  const PIECES = { '这是': 'zhè shì', '我的': 'wǒ de', '疼': 'téng' };
  const piecesOf = z => level === 1 ? ['这是', '我的', z] : ['我的', z, '疼'];
  const pyOf = z => PIECES[z] || W[z].py;

  // 挂着的木牌
  const roomSign = n => `<svg viewBox="0 0 112 76" aria-hidden="true">` +
    `<path d="M56 7 L14 34 M56 7 L98 34" stroke="#2B2B2B" stroke-width="2.5" fill="none"/>` +
    `<rect x="6" y="32" width="100" height="40" rx="8" fill="#F6E7C8" stroke="#2B2B2B" stroke-width="3.5"/>` +
    `<rect x="12" y="38" width="88" height="28" rx="5" fill="none" stroke="#C9A16A" stroke-width="2"/>` +
    `<circle cx="14" cy="36" r="2.4" fill="#8A5A2B"/><circle cx="98" cy="36" r="2.4" fill="#8A5A2B"/>` +
    `<text x="56" y="60" text-anchor="middle" font-family="Andika, Arial, sans-serif" font-weight="700" font-size="20" fill="#2B2B2B">Room ${n}</text>` +
    `<circle cx="56" cy="7" r="4.5" fill="#8A8F96" stroke="#2B2B2B" stroke-width="2"/></svg>`;
  let rounds = [], r = 0;
  function setup() {
    paintLevels(level);
    $('help').textContent = C.help[level - 1];
    rounds = pickRounds();
    total = rounds.reduce((s, p) => s + p.length, 0); done = 0; r = 0;
    $('winMsg').hidden = true; update();
    showRound(false);
    wait();
  }
  function showRound(anim) {
    const parts = rounds[r];
    const room = $('room'), bank = $('bank');
    $('roundNo').textContent = `Round ${r + 1} of ${rounds.length}`;
    room.style.setProperty('--n', parts.length);
    room.classList.toggle('solo', parts.length === 1);
    room.innerHTML = ''; bank.innerHTML = '';
    if (anim) { room.classList.remove('next'); void room.offsetWidth; room.classList.add('next'); }
    let dnd = null, left = parts.length;
    parts.forEach((z, k) => {
      const g = document.createElement('div');
      g.className = 'patient exam';
      g.innerHTML = (parts.length > 1 ? `<span class="roomSign" aria-label="Room ${k + 1}">${roomSign(k + 1)}</span>` : '') + `<div class="bubble" data-k="${k}">` + piecesOf(z).map(x => `<span class="dropSlot" data-answer="${x}"></span>`).join('') + `<span class="punct">。</span></div>` +
        `<svg viewBox="0 0 240 350" aria-hidden="true">${PT.svg({ zh: z, look: PT.look(), face: level === 1 ? 'good' : 'hurt', mark: level === 1 ? 'arrow' : 'pain' })}</svg>`;
      room.appendChild(g);
      g.querySelectorAll('.dropSlot').forEach(slot => slot.addEventListener('click', () => dnd && dnd.tapSlot(slot)));
    });
    // 字卡：每个人的句子拆开，再加干扰卡（图上没有、但很像的部位）
    const traps = trapsFor(parts, C.traps || 0);
    const words = shuffle(parts.flatMap(piecesOf).concat(traps));
    const cards = words.map(z => {
      const c = document.createElement('div');
      c.className = 'wcard'; c.dataset.word = z;
      c.innerHTML = `<span class="ruby">${Shih.ruby(z, pyOf(z))}</span>`;
      bank.appendChild(c);
      return c;
    });
    dnd = Shih.dragCards(cards, {
      slots: () => [...room.querySelectorAll('.dropSlot:not(.filled)')],
      accept(card, slot) {
        if (card.dataset.word !== slot.dataset.answer) return false;
        const z = card.dataset.word;
        card.classList.add('used');
        slot.classList.add('filled');
        slot.innerHTML = `<span class="ruby">${Shih.ruby(z, pyOf(z))}</span>`;
        const bub = slot.closest('.bubble');
        if (!bub.querySelector('.dropSlot:not(.filled)')) {
          // 这个人的句子排好了：念出来
          bub.classList.add('ok');
          const zh = [...bub.querySelectorAll('.dropSlot')].map(s => s.dataset.answer).join('') + '。';
          Shih.speak(zh);
          done++; left--; update();
          if (!left) {
            if (r + 1 < rounds.length) setTimeout(() => { r++; showRound(true); }, 1100);
            else setTimeout(() => { $('winMsg').hidden = false; Shih.speak(C.done.zh); }, 800);
          }
        }
        return true;
      }
    });
  }
  function update() { $('score').textContent = `${done} / ${total}`; }
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
