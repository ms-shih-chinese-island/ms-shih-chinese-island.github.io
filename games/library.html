<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>图书馆 Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 图书馆：右边是书（一个单元一章，可以翻页、可以听），左边是自己挑的配对卡（2–12 个），按「开始配对」就玩。
   不给金币、不记成绩。用法：library.html?unit=library */
body.game { background: #F3E9D8; }
.lib { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 820px) { .lib { grid-template-columns: 1fr; } }
/* 左边：配对卡 */
.tray { background: var(--card); border: 3px solid var(--ink); border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 8px; }
.tray h2 { margin: 0; display: flex; align-items: flex-end; gap: 8px; }
.tray h2 .ruby .py { font-size: 11px; } .tray h2 .ruby .zh { font-size: 20px; } .tray h2 .en { font-size: 14px; color: var(--muted); }
.count { font-weight: 700; color: var(--muted); font-size: 15px; }
.count b { color: var(--ink); font-size: 18px; }
.drop { min-height: 220px; max-height: calc(100vh - 360px); overflow: auto; border: 3px dashed #C9A86A; border-radius: 14px; background: #FFFBF2; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
.drop.over { background: #FFF1C4; border-style: solid; }
.drop .empty { color: var(--muted); font-size: 14px; text-align: center; margin: auto; padding: 10px; }
.chip { display: flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 2px 4px 2px 8px; }
.chip .ruby .py { font-size: 10px; } .chip .ruby .zh { font-size: 17px; }
.chip .ruby { flex-wrap: wrap; flex: 1; min-width: 0; }
.chip .x { border: 0; background: none; font: 700 18px var(--f-latin); color: var(--muted); cursor: pointer; padding: 0 4px; }
.mode { display: flex; gap: 6px; }
.mode button { flex: 1; font: 700 13px var(--f-latin); border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 5px 4px; cursor: pointer; }
.mode button[aria-pressed="true"] { border-color: var(--pick); background: var(--pick-soft); }
.go { font: 700 18px var(--f-latin); cursor: pointer; background: #8CC7A0; border: 3px solid #2F7A4D; border-radius: 14px; box-shadow: 0 4px 0 #2F7A4D; padding: 6px 10px 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.go .ruby .py { font-size: 12px; } .go .ruby .zh { font-size: 22px; }
.go:disabled { opacity: .45; cursor: default; box-shadow: none; }
.note { font-size: 13px; color: #B4471C; font-weight: 700; min-height: 16px; text-align: center; }
.clear { font: 700 13px var(--f-latin); border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; }
/* 右边：书 */
.book { display: flex; flex-direction: column; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; padding-left: 12px; }
.tab { font: inherit; cursor: pointer; border: 3px solid var(--ink); border-bottom: 0; border-radius: 12px 12px 0 0; background: #E7D4B0; padding: 3px 12px 4px; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.tab .ruby .py { font-size: 10px; } .tab .ruby .zh { font-size: 17px; } .tab .en { font-size: 11px; font-weight: 700; color: var(--muted); }
.tab[aria-selected="true"] { background: #FFFDF6; position: relative; top: 3px; }
.pages { background: #FFFDF6; border: 3px solid var(--ink); border-radius: 6px 18px 18px 18px; box-shadow: 0 6px 0 #8A5A2B; display: grid; grid-template-columns: 1fr 1fr; position: relative; min-height: 470px; }
.pages::before { content: ''; position: absolute; left: 50%; top: 8px; bottom: 8px; border-left: 2px dashed #D8C49C; }
@media (max-width: 1000px) { .pages { grid-template-columns: 1fr; } .pages::before { display: none; } }
.page { padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 4px; }
.chap { display: flex; align-items: flex-end; gap: 8px; border-bottom: 2px solid #E7D4B0; padding-bottom: 4px; margin-bottom: 2px; }
.chap .ruby .py { font-size: 12px; color: #8A5A2B; } .chap .ruby .zh { font-size: 24px; color: #8A5A2B; } .chap .en { font-weight: 700; color: var(--muted); }
.entry { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; border-radius: 10px; padding: 3px 4px; cursor: grab; }
.entry:hover { background: #FFF6E0; }
.entry.chosen { background: var(--me-soft); }
.entry .pic { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.entry .pic svg { width: 100%; height: 100%; display: block; }
.entry .txt { display: flex; flex-direction: column; min-width: 0; }
.entry .ruby { flex-wrap: wrap; } .entry .ruby .py { font-size: 12px; color: var(--sea-ink); } .entry .ruby .zh { font-size: 22px; }
.entry .en { font-size: 13px; color: var(--muted); font-weight: 700; }
.entry button { font: 700 16px var(--f-latin); width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); background: #fff; cursor: pointer; padding: 0; }
.entry .add { background: #FFF1C4; }
.entry.chosen .add { background: var(--me-done); }
.flip { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 8px; grid-column: 1 / -1; }
.flip button { font: 700 15px var(--f-latin); border: 2px solid var(--ink); border-radius: 10px; background: #fff; padding: 4px 12px; cursor: pointer; }
.flip button:disabled { opacity: .35; cursor: default; }
.flip span { font-weight: 700; color: var(--muted); }
@media (orientation: landscape) and (max-height: 720px) {
  .pages { min-height: 0; } .entry { padding: 1px 4px; } .entry .pic { width: 36px; height: 36px; } .entry .ruby .zh { font-size: 19px; }
  .entry button { width: 30px; height: 30px; font-size: 14px; } .page { padding: 6px 12px 4px; gap: 1px; }
  .drop { min-height: 160px; max-height: calc(100vh - 300px); } .chap .ruby .zh { font-size: 20px; }
}
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en">Library</span></div>
    <div class="controls"><button class="ctl" id="soundBtn" type="button"></button></div>
  </div>
  <p class="help">Read the book. Drag words to the left (or tap ＋). Pick 2 to 12 words, then start matching!</p>
  <div class="lib">
    <div class="tray">
      <h2><span class="ruby" id="trayRuby"></span><span class="en">My cards</span></h2>
      <div class="count" id="count"></div>
      <div class="drop" id="drop"></div>
      <div class="mode" id="mode"><button type="button" data-m="en">中文 ↔ English</button><button type="button" data-m="pinyin">中文 ↔ pīnyīn</button></div>
      <div class="note" id="note"></div>
      <button type="button" class="go" id="go"><span class="ruby" id="goRuby"></span><span>Start</span></button>
      <button type="button" class="clear" id="clear">Clear all</button>
    </div>
    <div class="book">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="pages" id="pages"></div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/kids.js"></script>
<script src="../shared/adj.js"></script>
<script src="../shared/vocab.js"></script>
<script src="../units/library/words.js"></script>
<script>
Shih.islandBar();
const $ = id => document.getElementById(id);
const esc = Shih.esc;
$('titleRuby').innerHTML = Shih.ruby('图书馆', 'tú shū guǎn');
$('trayRuby').innerHTML = Shih.ruby('我的配对卡', 'wǒ de pèi duì kǎ');
$('goRuby').innerHTML = Shih.ruby('开始配对', 'kāi shǐ pèi duì');
Shih.soundButton($('soundBtn'));
const KIDS = window.ART;   // kids.js 的人物和表情（等一下别的单元的图会盖掉 window.ART，先存起来）
const R = w => `<span class="ruby">${Shih.rubyText(w.zh, w.py)}</span>`;

// ---- 读每一个单元的生词 ----
function loadScript(src) { return new Promise(r => { const s = document.createElement('script'); s.src = src; s.onload = s.onerror = () => r(); document.head.appendChild(s); }); }
async function unitWords(id) {
  window.UNIT = {};
  await loadScript(`../units/${id}/words.js?lib`);
  return ((window.UNIT && window.UNIT.words) || []).filter(w => w.match !== false && w.zh);
}
let HART = {}, MART = {};
async function loadAll() {
  for (const c of LIBRARY.chapters) if (c.from) c.list = await unitWords(c.from); else c.list = c.words;
  // 形容词（聪明、勇敢……）是「家」那一课教的，书里放在「家」那一章
  const ch = id => LIBRARY.chapters.find(c => c.id === id);
  if (ch('school') && ch('family')) {
    const adj = ch('school').list.filter(w => w.adj);
    ch('school').list = ch('school').list.filter(w => !w.adj);
    ch('family').list = ch('family').list.concat(adj.filter(w => !ch('family').list.some(x => x.zh === w.zh)));
  }
  window.ART = undefined; await loadScript('../units/halloween/art.js'); HART = window.ART || {};
  window.ART = undefined; await loadScript('../units/moon/art.js'); MART = window.ART || {};
  window.ART = KIDS;
}
// ---- 每个字的小图（岛上本来就有的图才放） ----
const PERSON = () => KIDS.people.find(p => p.first === 'Emily') || KIDS.people[0];
function picOf(w) {
  try {
    if (window.ADJ_ICON && ADJ_ICON.list.includes(w.zh)) return ADJ_ICON(w.zh);
    if (window.VOCAB && VOCAB[w.zh]) return VOCAB_BOX(w.zh, '#FFF6D6');
    if (HART.items && HART.items[w.zh]) return HART.items[w.zh];
    if (w.feel && KIDS.kid) return KIDS.kid(PERSON(), w.feel);
    if (w.zh === '早上好' && KIDS.time) return KIDS.time('morning');
    if (w.zh === '下午好' && KIDS.time) return KIDS.time('afternoon');
    if (w.pic && MART.icon) return MART.icon(w.pic);
    if (w.who && MART.who) return MART.who(w.who);
  } catch (e) {}
  return '';
}

// ---- 挑好的配对卡（存在这个分页里，玩完回来还在） ----
let pick = { mode: 'en', words: [] };
try { pick = JSON.parse(sessionStorage.getItem('shih:libPick') || 'null') || pick; } catch (e) {}
const save = () => { try { sessionStorage.setItem('shih:libPick', JSON.stringify(pick)); } catch (e) {} };
const has = w => pick.words.some(x => x.zh === w.zh);
function add(w) {
  if (has(w)) return;
  if (pick.words.length >= 12) { $('note').textContent = '12 cards at most!'; return; }
  pick.words.push(Object.assign({}, w, { img: picOf(w) })); save(); paintTray(); paintMarks();   // 图一起带去配对
}
function remove(zh) { pick.words = pick.words.filter(x => x.zh !== zh); save(); paintTray(); paintMarks(); }
function paintTray() {
  const n = pick.words.length;
  $('count').innerHTML = `<b>${n}</b> / 12`;
  $('drop').innerHTML = n ? pick.words.map(w => `<div class="chip">${R(w)}<button type="button" class="x" data-zh="${esc(w.zh)}" aria-label="Remove">✕</button></div>`).join('')
    : `<div class="empty">Drag words here<br>or tap ＋</div>`;
  $('drop').querySelectorAll('.x').forEach(b => b.addEventListener('click', () => remove(b.dataset.zh)));
  $('go').disabled = n < 2;
  $('note').textContent = n < 2 ? 'Pick at least 2 words.' : '';
  $('mode').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === pick.mode)));
}
$('mode').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { pick.mode = b.dataset.m; save(); paintTray(); }));
$('clear').addEventListener('click', () => { pick.words = []; save(); paintTray(); paintMarks(); });
$('go').addEventListener('click', () => { if (pick.words.length >= 2) { save(); location.href = 'match.html?unit=library'; } });
// 拖进左边的框（电脑上可以拖；平板就按 ＋）
const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); const w = current.find(x => x.zh === e.dataTransfer.getData('text/plain')); if (w) add(w); });

// ---- 书：书签、翻页 ----
let chap = 0, spread = 0, current = [];
const PER = () => (innerHeight <= 720 ? 7 : 8);   // 一页几个字
function paintTabs() {
  $('tabs').innerHTML = LIBRARY.chapters.map((c, k) => `<button type="button" class="tab" role="tab" data-k="${k}" aria-selected="${k === chap}"><span class="ruby">${Shih.ruby(c.zh, c.py)}</span><span class="en">${esc(c.en)}</span></button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { chap = +b.dataset.k; spread = 0; paintTabs(); paintBook(); }));
}
function entryHTML(w) {
  return `<div class="entry${has(w) ? ' chosen' : ''}" draggable="true" data-zh="${esc(w.zh)}"><span class="pic">${picOf(w)}</span>` +
    `<span class="txt">${R(w)}<span class="en">${esc(w.en || '')}</span></span>` +
    `<button type="button" class="say" aria-label="Listen">🔊</button><button type="button" class="add" aria-label="Add">${has(w) ? '✓' : '＋'}</button></div>`;
}
function paintBook() {
  const c = LIBRARY.chapters[chap];
  current = c.list || [];
  const per = PER(), two = innerWidth > 1000, perSpread = two ? per * 2 : per;
  const spreads = Math.max(1, Math.ceil(current.length / perSpread));
  spread = Math.min(spread, spreads - 1);
  const items = current.slice(spread * perSpread, (spread + 1) * perSpread);
  const head = `<div class="chap"><span class="ruby">${Shih.rubyText(c.zh, c.py)}</span><span class="en">${esc(c.en)}</span></div>`;
  const pageA = items.slice(0, per), pageB = two ? items.slice(per) : [];
  $('pages').innerHTML = `<div class="page">${head}${pageA.map(entryHTML).join('')}</div>` + (two ? `<div class="page">${head.replace('class="chap"', 'class="chap" style="visibility:hidden"')}${pageB.map(entryHTML).join('')}</div>` : '') +
    `<div class="flip"><button type="button" id="prev">◀ Back</button><span>${spread + 1} / ${spreads}</span><button type="button" id="next">Next ▶</button></div>`;
  $('prev').disabled = spread === 0; $('next').disabled = spread >= spreads - 1;
  $('prev').addEventListener('click', () => { spread--; paintBook(); });
  $('next').addEventListener('click', () => { spread++; paintBook(); });
  $('pages').querySelectorAll('.entry').forEach(el => {
    const w = current.find(x => x.zh === el.dataset.zh);
    el.querySelector('.say').addEventListener('click', () => Shih.speak(w.zh));
    el.querySelector('.add').addEventListener('click', () => (has(w) ? remove(w.zh) : add(w)));
    el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', w.zh); });
  });
}
function paintMarks() { if (current.length) paintBook(); }
addEventListener('resize', () => paintBook());

loadAll().then(() => { pick.words.forEach(w => { w.img = picOf(w); }); save(); paintTabs(); paintBook(); paintTray(); });
</script>
</body>
</html>
