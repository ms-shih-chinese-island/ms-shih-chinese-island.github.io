<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>送信</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 送信：左边是邮差的包包和要送的信，右边是社区的小地图（九栋房子，每次位置不一样）。
   Level 1：一封信，「请送到＿＿。」（有拼音），点对的房子
   Level 2：三封不同颜色的信，「红色的信，送到医院。」（有拼音）：先点对的信，再点房子
   Level 3：包包里 8 封信，「两封红色的信，送到医院。」（有拼音）：拿对颜色、对的封数，再点房子
   地图上的房子下面写英文（题目是中文，学生要找到对的地方）。
   点错了摇一摇（不算错）。时间内送完就有金币。设定在 units/community/words.js 的 UNIT.post */
body.game { background: #E6F4F8; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: 12px; }
.ask { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 18px; padding: 10px 12px; text-align: center; }
.ask .ruby { flex-wrap: wrap; justify-content: center; } .ask .ruby .py { font-size: 12px; } .ask .ruby .zh { font-size: 24px; }
.ask .w { font-size: 26px; font-weight: 700; }
.nb { display: inline-flex; white-space: nowrap; gap: 3px; align-items: flex-end; }
.ruby > .nb { flex-direction: row; } .nb > span { display: flex; flex-direction: column; align-items: center; }
.ask .w .nb { display: inline; }
.ask .again { margin-left: 6px; background: #FFF6D6; border: 2px solid #2B2B2B; border-radius: 10px; font-size: 18px; cursor: pointer; vertical-align: middle; }
.bag { position: relative; margin-top: 30px; height: 190px; }
/* 邮差包：简单的样子（背带 + 包身 + 盖子），信压在包上面 */
.bag .strap { position: absolute; left: 0; top: -10px; width: 100%; height: 110px; pointer-events: none; }
.bag .body { position: absolute; left: 14px; right: 14px; top: 56px; bottom: 0; background: #A9C6EE; border: 3px solid #2B2B2B; border-radius: 12px 12px 22px 22px; }
.bag .body::before { content: ''; position: absolute; left: -3px; right: -3px; top: -3px; height: 44px; background: #8DB4E8; border: 3px solid #2B2B2B; border-radius: 12px 12px 30% 30% / 12px 12px 20px 20px; }
.bag .letters { position: absolute; left: 0; right: 0; top: 84px; display: flex; gap: 8px; justify-content: center; z-index: 1; }
.letter { width: 100px; height: 72px; border: 3px solid #2B2B2B; border-radius: 8px; position: relative; cursor: pointer; display: flex; align-items: flex-start; justify-content: center; padding-top: 4px; box-sizing: border-box; transition: transform .2s; }
.letter::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 58%; background: linear-gradient(to top right, transparent calc(50% - 1.5px), #2B2B2B calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)) left / 50% 100% no-repeat, linear-gradient(to top left, transparent calc(50% - 1.5px), #2B2B2B calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)) right / 50% 100% no-repeat; opacity: .7; }   /* 信封的盖子：角朝下（V） */
.letter .to { position: relative; background: #FFFFFF; border: 2px solid #2B2B2B; border-radius: 6px; padding: 0 8px; font-size: 20px; font-weight: 700; }
.letter .to .ruby .py { font-size: 11px; } .letter .to .ruby .zh { font-size: 20px; }
.letter.sel { transform: translateY(-14px) scale(1.06); outline: 4px solid var(--pick); outline-offset: 3px; }
.letter.oops { animation: shake .35s; }
.letter.gone { visibility: hidden; }
.bag.many { height: auto; padding-bottom: 18px; }
.bag.many .letters { position: relative; top: auto; padding-top: 84px; flex-wrap: wrap; padding-left: 14px; padding-right: 14px; row-gap: 12px; }
.bag.many .letter { width: 72px; height: 50px; }
.map { position: relative; background: #CFE8B8; border: 4px solid #2B2B2B; border-radius: 22px; padding: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; background-image: linear-gradient(#E9DFC9, #E9DFC9), linear-gradient(#E9DFC9, #E9DFC9); background-size: 100% 16px, 16px 100%; background-position: 0 33.5%, 33.5% 0; background-repeat: no-repeat; }
.map::after { content: ''; position: absolute; left: 0; right: 0; top: 66.5%; height: 16px; background: #E9DFC9; z-index: 0; }
.place { position: relative; z-index: 1; background: #E6F2D8; border: 3px solid #2B2B2B; border-radius: 16px; cursor: pointer; aspect-ratio: 1.55; display: flex; align-items: center; justify-content: center; }
.place { flex-direction: column; }
.place svg { width: 92%; height: 84%; }
.place .en { font: 700 13px var(--f-latin); color: #2F5A2F; line-height: 1.1; margin-top: -2px; }
.place:hover { background: #FFF6D6; }
.place.oops { animation: shake .35s; border-color: var(--bad); }
.place.got { background: #FFF6D6; }
.place .n { position: absolute; right: 6px; top: 4px; font: 800 16px var(--f-latin); color: #2F7A4D; }
.fly { position: fixed; width: 60px; height: 40px; border: 3px solid #2B2B2B; border-radius: 6px; z-index: 60; pointer-events: none; transition: left .5s ease-in-out, top .5s ease-in-out, transform .5s; }
.timer.low { background: #FCE3E0; border-color: var(--bad); }
.timeUp { text-align: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 18px; padding: 10px; margin: 0 auto 10px; max-width: 640px; font: 700 18px var(--f-latin); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.timeUp .ruby .py { font-size: 12px; } .timeUp .ruby .zh { font-size: 26px; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill timer" id="timer">0:00</span>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>
  <div class="timeUp" id="timeUp" hidden><span class="ruby" id="timeUpRuby"></span><span id="timeUpTxt"></span><button class="ctl" id="again2" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="wrap">
        <div class="side">
          <div class="ask" id="ask"></div>
          <div class="bag" id="bag"></div>
        </div>
        <div class="map" id="map"></div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/places.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.post, PA = window.PLACE_ART;
  const $ = id => document.getElementById(id);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  $('timeUpRuby').innerHTML = Shih.ruby('时间到了', 'shí jiān dào le');
  Shih.soundButton($('soundBtn'));

  const timerEl = $('timer');
  const LIMIT = lv => C.time[lv - 1] * 1000;
  let left = 0, lastT = 0, tick = 0, running = false;
  const fmt = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  function loop() {
    if (!running) return;
    const now = performance.now(); left -= now - lastT; lastT = now;
    timerEl.textContent = '⏱ ' + fmt(Math.max(0, left)); timerEl.classList.toggle('low', left < 15000);
    if (left <= 0) { running = false; $('timeUpTxt').textContent = `Time's up! You delivered ${qi} of ${qs.length}. Try again!`; $('timeUp').hidden = false; Shih.speak('时间到了'); return; }
    tick = requestAnimationFrame(loop);
  }

  const LEVELS = [{ note: 'Find the place + pinyin' }, { note: 'Pick the color + pinyin' }, { note: 'Number + color + pinyin' }];
  let level = Shih.startLevel('postLevel', 3);
  const paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('postLevel', lv); setup(); });
  const HELP = ['Read where the letter goes. Tap the right place on the map!',
                'Tap the letter with the right color, then tap the right place on the map!',
                'Tap the right number of letters with the right color, then tap the right place!'];
  const oops = el => { el.classList.remove('oops'); void el.offsetWidth; el.classList.add('oops'); setTimeout(() => el.classList.remove('oops'), 400); };
  const pinyin = () => true;   // 三级都有拼音
  const COUNT = [{ zh: '一', py: 'yì' }, { zh: '两', py: 'liǎng' }, { zh: '三', py: 'sān' }];
  // 标点跟前面的字黏在一起，不会自己掉到下一行
  // 句子照逗号分成几段，每一段不会从中间断开（「超级市场。」不会断成两行）
  const say = (zh, py) => {
    const zs = zh.split(/(?<=，)/), ps = (py || '').split(/(?<=,)/);
    return pinyin() ? `<span class="ruby">${zs.map((z, i) => `<span class="nb">${Shih.rubyText(z, ps[i] || '')}</span>`).join('')}</span>`
                    : `<span class="w">${zs.map(z => `<span class="nb">${z}</span>`).join('')}</span>`;
  };

  // 题目：每封信送到哪里（Level 3 有一半送给人）
  let qs = [], qi = 0, bagLetters = [], picked = null, busy = false;
  function makeQuestions() {
    const places = shuffle(PA.list).slice(0, C.rounds);
    return places.map((p, i) => {
      const info = PA.info(p);
      // Level 3：要送几封（两封或三封）
      return { place: p, to: info, give: false, k: level === 3 ? 2 + Math.floor(Math.random() * 2) : 1 };
    });
  }
  function ask() {
    const q = qs[qi];
    const verb = q.give ? '送给' : '送到', verbPy = q.give ? 'sòng gěi' : 'sòng dào';
    let zh, py;
    if (level === 1) { zh = `请${verb}${q.to.zh}。`; py = `qǐng ${verbPy} ${q.to.py}.`; }
    else if (level === 2) { zh = `${q.color.zh}的信，${verb}${q.to.zh}。`; py = `${q.color.py} de xìn, ${verbPy} ${q.to.py}.`; }
    else { const k = COUNT[q.k - 1]; zh = `${k.zh}封${q.color.zh}的信，${verb}${q.to.zh}。`; py = `${k.py} fēng ${q.color.py} de xìn, ${verbPy} ${q.to.py}.`; }
    q.say = zh;
    $('ask').innerHTML = say(zh, py) + `<button type="button" class="again" id="again" aria-label="Listen again">🔊</button>`;
    $('again').addEventListener('click', () => Shih.speak(zh));
    if (running) Shih.speak(zh);
    paintBag();
    window.__post = { place: q.place, color: q.color && q.color.zh, k: q.k, qi };
  }
  // 包包：Level 1 一封信（上面写地方）；Level 2、3 三封不同颜色的信
  function paintBag() {
    const q = qs[qi];
    $('bag').innerHTML = `<svg class="strap" viewBox="0 0 360 120" preserveAspectRatio="none"><path d="M60 80 C80 0 280 0 300 80" fill="none" stroke="#2B2B2B" stroke-width="11" stroke-linecap="round"/><path d="M60 80 C80 0 280 0 300 80" fill="none" stroke="#6E9BDB" stroke-width="6" stroke-linecap="round"/></svg>` +
      `<div class="body"></div><div class="letters" id="letters"></div>`;
    picked = null;
    if (level === 1) {
      q.color = C.colors[qi % C.colors.length];
      bagLetters = [{ color: q.color, right: true }];
    } else if (level === 2) {
      const others = shuffle(C.colors.filter(c => c !== q.color)).slice(0, 2);
      bagLetters = shuffle([{ color: q.color, right: true }].concat(others.map(c => ({ color: c }))));
    } else {
      // Level 3：包包里 8 封信；对的颜色比要送的多一两封，要数对才送得出去
      const same = q.k + 1 + Math.floor(Math.random() * 2), others = shuffle(C.colors.filter(c => c !== q.color)).slice(0, 3);
      bagLetters = shuffle(Array.from({ length: same }, () => ({ color: q.color, right: true }))
        .concat(Array.from({ length: 8 - same }, (_, i) => ({ color: others[i % others.length] }))));
    }
    $('bag').classList.toggle('many', level === 3);
    bagLetters.forEach(L => {
      const el = document.createElement('div');
      el.className = 'letter'; el.style.background = L.color.hex; el.dataset.color = L.color.zh;
      el.addEventListener('click', () => pickLetter(L, el));
      L.el = el;
      $('letters').appendChild(el);
    });
    if (level === 1) picked = bagLetters[0];   // 只有一封：直接拿着，不用抬起来（位置跟 Level 2、3 一样）
  }
  function pickLetter(L, el) {
    if (!running || busy || level === 1) return;
    if (!L.right) { oops(el); return; }      // 拿错颜色：摇一摇（不算错）
    if (level === 3) {                       // Level 3：可以拿好几封，再点一次放回去
      L.sel = !L.sel; el.classList.toggle('sel', L.sel);
      const n = bagLetters.filter(x => x.sel).length;
      picked = n ? bagLetters.find(x => x.sel) : null;
      if (L.sel) Shih.speak(['一', '两', '三', '四', '五'][n - 1] + '封');
      return;
    }
    bagLetters.forEach(x => x.el.classList.remove('sel'));
    picked = L; el.classList.add('sel');
    Shih.speak(L.color.zh + '的信');
  }
  function tapPlace(p, el) {
    if (!running || busy) return;
    if (!picked) { bagLetters.forEach(x => oops(x.el)); return; }   // 还没拿信
    const q = qs[qi];
    if (p !== q.place) { oops(el); return; }
    const chosen = level === 3 ? bagLetters.filter(x => x.sel) : [picked];
    if (chosen.length !== q.k) { bagLetters.filter(x => x.right).forEach(x => oops(x.el)); return; }   // 封数不对：信摇一摇
    busy = true;
    chosen.forEach(x => x.el.classList.add('gone'));
    // 信飞过去
    const from = picked.el.getBoundingClientRect(), to = el.getBoundingClientRect();
    const f = document.createElement('div'); f.className = 'fly'; f.style.background = picked.color.hex;
    f.style.left = from.left + 'px'; f.style.top = from.top + 'px';
    document.body.appendChild(f); picked.el.classList.add('gone');
    requestAnimationFrame(() => requestAnimationFrame(() => { f.style.left = (to.left + to.width / 2 - 30) + 'px'; f.style.top = (to.top + to.height / 2 - 20) + 'px'; f.style.transform = 'scale(.6)'; }));
    setTimeout(() => {
      f.remove(); el.classList.add('got'); busy = false;
      Shih.speak(q.give ? '谢谢！' : q.place);
      qi++; update();
      if (qi >= qs.length) {
        running = false; cancelAnimationFrame(tick);
        $('winTime').textContent = 'Time left: ' + fmt(Math.max(0, left));
        setTimeout(() => { $('winMsg').hidden = false; Shih.speak('太棒了'); }, 400);
      } else { setTimeout(() => el.classList.remove('got'), 500); ask(); }
    }, 560);
  }

  function setup() {
    paintLevels(level);
    $('help').textContent = HELP[level - 1] + ` Deliver ${C.rounds} letters in ${fmt(LIMIT(level))} to get coins!`;
    qs = makeQuestions(); qi = 0; busy = false;
    const cols = shuffle(C.colors);
    qs.forEach((q, i) => { q.color = cols[i % cols.length]; });
    // 地图：九栋房子，每次位置不一样
    $('map').innerHTML = '';
    shuffle(PA.list).forEach(p => {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'place'; el.dataset.place = p; el.setAttribute('aria-label', PA.info(p).en);
      el.innerHTML = PA.svg(p) + `<span class="en">${PA.info(p).en}</span>`;   // 小图下面写英文
      el.addEventListener('click', () => tapPlace(p, el));
      $('map').appendChild(el);
    });
    running = false; cancelAnimationFrame(tick); left = LIMIT(level); timerEl.textContent = '⏱ ' + fmt(left); timerEl.classList.remove('low');
    $('winMsg').hidden = true; $('timeUp').hidden = true; update();
    ask();
    wait();
  }
  function update() { $('score').textContent = `${qi} / ${qs.length}`; }
  const wait = Shih.startCover($('playArea'), () => { running = true; lastT = performance.now(); tick = requestAnimationFrame(loop); Shih.speak(qs[qi].say); });
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  $('again2').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
