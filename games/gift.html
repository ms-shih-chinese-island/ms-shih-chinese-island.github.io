<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>送礼物</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 送礼物（七夕情人节）：祝你节日快乐！
   Level 1 卡片「这是我送你的帽子。」点对的衣服；Level 2 卡片「我想送你红色的毛衣。」点对的；
   Level 3 打开礼物盒，用字卡排出「这是我送你的红色的毛衣。」再按 Submit。
   答对 target 题就马上结束、给金币。点错了摇一摇（不扣分）。设定在 units/qixi/words.js 的 UNIT.gift */
body.game { background: #FDEEF3; }
.box { max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { .box { grid-template-columns: 1fr; } }
.card { background: #FFFFFF; border: 4px solid #E2557A; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 0 #F49AC1; }
.card .ruby { flex-wrap: wrap; row-gap: 6px; }
.card .ruby .py { font-size: 13px; } .card .ruby .zh { font-size: 25px; font-weight: 700; }
.card .hi .ruby .zh { color: #E2557A; }
.giftbox { width: 150px; height: 150px; margin: 4px auto 0; position: relative; }
.giftbox svg { width: 100%; height: 100%; display: block; }
.giftbox .inside { position: absolute; left: 25px; top: 20px; width: 100px; height: 100px; }
.again { align-self: flex-start; background: #FFF6D6; border: 2px solid #2B2B2B; border-radius: 10px; font-size: 18px; cursor: pointer; }
.shelf { background: #FFF8FA; border: 4px solid #2B2B2B; border-radius: 20px; padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.item { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 16px; padding: 6px; cursor: pointer; display: flex; justify-content: center; }
.item svg { width: 110px; height: 110px; display: block; }
.item.oops { animation: shake .35s; border-color: var(--bad); }
.item.ok { border-color: var(--me); background: #E3F4DC; }
.builder { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.builder[hidden], .shelf[hidden] { display: none; }
.sent { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; justify-content: center; }
.sent .ruby .py { font-size: 13px; } .sent .ruby .zh { font-size: 26px; font-weight: 700; }
.sent .dropSlot { min-width: 54px; min-height: 54px; padding: 2px 4px; box-sizing: border-box; cursor: pointer; }
.sent .dropSlot.bad { animation: shake .35s; border-color: var(--bad); background: #FCE3E0; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.bank .wcard { min-width: 54px; justify-content: center; }
.bank .wcard .py { font-size: 13px; } .bank .wcard .zh { font-size: 24px; font-weight: 700; }
.bank .wcard.used { visibility: hidden; }
.go { font: 800 18px var(--f-latin); background: var(--me); color: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 12px; padding: 4px 22px; cursor: pointer; }
.timer.low { background: #FCE3E0; border-color: var(--bad); }
.timeUp { text-align: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 18px; padding: 10px; margin: 0 auto 10px; max-width: 640px; font: 700 18px var(--f-latin); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.timeUp .ruby .py { font-size: 12px; } .timeUp .ruby .zh { font-size: 26px; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill timer" id="timer">0:00</span>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>
  <div class="timeUp" id="timeUp" hidden><span class="ruby" id="timeUpRuby"></span><span id="timeUpTxt"></span><button class="ctl" id="again2" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="box">
        <div class="card" id="card"></div>
        <div><div class="shelf" id="shelf"></div><div class="builder" id="builder" hidden></div></div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/clothes-art.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.gift, CL = C.clothes, COL = C.colors, CA = window.CLOTHES_ART;
  const $ = id => document.getElementById(id);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.ruby('节日快乐', 'jié rì kuài lè');
  $('timeUpRuby').innerHTML = Shih.ruby('时间到了', 'shí jiān dào le');
  Shih.soundButton($('soundBtn'));

  const timerEl = $('timer');
  const LIMIT = lv => C.time[lv - 1] * 1000, GOAL = () => C.target[level - 1];
  let left = 0, lastT = 0, tick = 0, running = false;
  const fmt = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  function loop() {
    if (!running) return;
    const now = performance.now(); left -= now - lastT; lastT = now;
    timerEl.textContent = '⏱ ' + fmt(Math.max(0, left)); timerEl.classList.toggle('low', left < 15000);
    if (left <= 0) { finish(); return; }
    tick = requestAnimationFrame(loop);
  }
  function finish() {
    running = false; cancelAnimationFrame(tick);
    if (done >= GOAL()) { $('winTime').textContent = 'Time left: ' + fmt(Math.max(0, left)); $('winMsg').hidden = false; Shih.speak('祝你节日快乐！'); }
    else { $('timeUpTxt').textContent = `You got ${done} of ${GOAL()}. Try again!`; $('timeUp').hidden = false; Shih.speak('时间到了'); }
  }

  const LEVELS = [{ note: '这是我送你的＿＿' }, { note: '我想送你＿＿色的＿＿' }, { note: 'Write the card' }];
  let level = Shih.startLevel('giftLevel', 3);
  const paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('giftLevel', lv); setup(); });
  const HELP = ['Read the gift card. Tap the gift!',
                'Read the gift card. Look at the color and the clothes. Tap the gift!',
                'Look in the gift box. Write the card with the word cards, then press Submit.'];
  const oops = el => { el.classList.remove('oops'); void el.offsetWidth; el.classList.add('oops'); setTimeout(() => el.classList.remove('oops'), 400); };
  const BOX = open => `<svg viewBox="0 0 150 150" aria-hidden="true">${open ? '' : `<rect x="14" y="40" width="122" height="22" fill="#F49AC1" stroke="#2B2B2B" stroke-width="4"/>`}` +
    `<rect x="22" y="${open ? 92 : 62}" width="106" height="${open ? 50 : 80}" fill="#E2557A" stroke="#2B2B2B" stroke-width="4"/><path d="M75 ${open ? 92 : 40} L75 142" stroke="#F5C531" stroke-width="12"/>` +
    (open ? '' : `<path d="M75 40 Q50 8 44 26 Q46 38 75 40 Q100 8 106 26 Q104 38 75 40 Z" fill="#F5C531" stroke="#2B2B2B" stroke-width="3"/>`) + `</svg>`;
  let done = 0, q = null, busy = false, lastKey = '';
  function show() {
    busy = false;
    let t; do { t = { w: pick(CL), c: pick(COL) }; } while (t.w.zh + t.c.zh === lastKey); lastKey = t.w.zh + t.c.zh;
    q = { t };
    const head = `<div class="hi"><span class="ruby">${Shih.rubyWords([['祝你', 'zhù nǐ'], ['节日', 'jié rì'], ['快乐！', 'kuài lè']])}</span></div>`;
    $('shelf').hidden = level === 3; $('builder').hidden = level !== 3;
    if (level < 3) {
      const zh = level === 1 ? `这是我送你的${t.w.zh}。` : `我想送你${t.c.zh}的${t.w.zh}。`;
      const py = level === 1 ? `zhè shì wǒ sòng nǐ de ${t.w.py}.` : `wǒ xiǎng sòng nǐ ${t.c.py} de ${t.w.py}.`;
      q.say = zh;
      // 照词组换行（不会把「牛仔裤」切成「牛仔／裤」）
      // Level 2：分两行，「我想送你：」下面是「粉红色的牛仔裤」（比较短、好读）
      // Level 1 也分两行：「这是我送你的：」下面是「牛仔裤」
      const lines = level === 1 ? [[['这是', 'zhè shì'], ['我', 'wǒ'], ['送你的：', 'sòng nǐ de']], [[t.w.zh, t.w.py]]]
                                 : [[['我想', 'wǒ xiǎng'], ['送你：', 'sòng nǐ']], [[t.c.zh + '的', t.c.py + ' de'], [t.w.zh, t.w.py]]];
      $('card').innerHTML = head + lines.map(w => `<div><span class="ruby">${Shih.rubyWords(w)}</span></div>`).join('') + `<button type="button" class="again" id="again">🔊</button><div class="giftbox">${BOX(false)}</div>`;
      let items;
      if (level === 1) items = [t].concat(shuffle(CL.filter(w => w !== t.w)).slice(0, 5).map(w => ({ w, c: pick(COL) })));
      else {
        const oc = shuffle(COL.filter(c => c !== t.c)), ow = shuffle(CL.filter(w => w !== t.w));
        items = [t, { w: t.w, c: oc[0] }, { w: t.w, c: oc[1] }, { w: ow[0], c: t.c }, { w: ow[1], c: t.c }, { w: ow[2], c: oc[2] }];
      }
      items = shuffle(items); q.items = items;
      $('shelf').innerHTML = '';
      items.forEach((x, i) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'item'; b.innerHTML = CA.svg(x.w.zh, x.c.hex);
        b.addEventListener('click', () => {
          if (!running || busy) return;
          if (x !== t) { oops(b); return; }                         // 不对：摇一摇（不扣分）
          b.classList.add('ok');
          $('card').querySelector('.giftbox').innerHTML = BOX(true) + `<div class="inside">${CA.svg(t.w.zh, t.c.hex)}</div>`;
          good(q.say);
        });
        $('shelf').appendChild(b);
      });
      window.__g = { level, done, t: items.indexOf(t) };
    } else {
      // Level 3：礼物盒打开了，自己写卡片
      const need = ['这是', '我', '送', '你', '的', t.c.zh, '的', t.w.zh];
      q.need = need; q.say = `祝你节日快乐！这是我送你的${t.c.zh}的${t.w.zh}。`;
      $('card').innerHTML = head + `<div class="giftbox">${BOX(true)}<div class="inside">${CA.svg(t.w.zh, t.c.hex)}</div></div>`;
      const W = (zh, py) => ({ zh, py });
      const oc = pick(COL.filter(c => c !== t.c)), ow = pick(CL.filter(w => w !== t.w));
      const cards = shuffle([W('这是', 'zhè shì'), W('我', 'wǒ'), W('送', 'sòng'), W('你', 'nǐ'), W('的', 'de'), t.c, W('的', 'de'), t.w, W('买', 'mǎi'), oc, ow]);
      $('builder').innerHTML = `<div class="sent" id="sent">${need.map(() => '<span class="dropSlot"></span>').join('')}<span class="ruby">${Shih.rubyText('。', '')}</span></div>` +
        `<div class="bank" id="bank">${cards.map((w, i) => `<button type="button" class="wcard" data-i="${i}" data-zh="${w.zh}"><span class="ruby">${Shih.ruby(w.zh, w.py)}</span></button>`).join('')}</div>` +
        `<button type="button" class="go" id="go">✓ Submit</button>`;
      const slots = [...$('sent').querySelectorAll('.dropSlot')];
      const clear = s => { const b = $('bank').querySelector(`.wcard[data-i="${s.dataset.from}"]`); if (b) b.classList.remove('used'); delete s.dataset.zh; s.innerHTML = ''; s.classList.remove('filled'); };
      $('bank').querySelectorAll('.wcard').forEach(b => b.addEventListener('click', () => {
        if (!running || busy || b.classList.contains('used')) return;
        const s = slots.find(x => !x.dataset.zh); if (!s) return;
        s.dataset.zh = b.dataset.zh; s.dataset.from = b.dataset.i; s.innerHTML = b.innerHTML; s.classList.add('filled'); b.classList.add('used');
      }));
      slots.forEach(s => s.addEventListener('click', () => { if (running && !busy && s.dataset.zh) clear(s); }));
      $('go').addEventListener('click', () => {
        if (!running || busy) return;
        let ok = true;
        slots.forEach((s, i) => { if (s.dataset.zh !== need[i]) { ok = false; if (s.dataset.zh) clear(s); s.classList.remove('bad'); void s.offsetWidth; s.classList.add('bad'); setTimeout(() => s.classList.remove('bad'), 400); } });
        if (ok) good(q.say);
      });
      window.__g = { level, done, need };
    }
    $('again') && $('again').addEventListener('click', () => Shih.speak(q.say));
    if (running && level < 3) Shih.speak(q.say);
  }
  function good(say) {
    busy = true; done++; update(); Shih.speak(say);
    if (done >= GOAL()) { running = false; cancelAnimationFrame(tick); setTimeout(finish, 800); return; }   // 达标了：马上结束，给金币
    setTimeout(() => { if (running) show(); }, 700);
  }
  function setup() {
    paintLevels(level);
    $('help').textContent = HELP[level - 1] + ` Get ${GOAL()} right in ${fmt(LIMIT(level))} to get coins!`;
    done = 0; lastKey = '';
    running = false; cancelAnimationFrame(tick); left = LIMIT(level); timerEl.textContent = '⏱ ' + fmt(left); timerEl.classList.remove('low');
    $('winMsg').hidden = true; $('timeUp').hidden = true; update();
    show(); wait();
  }
  function update() { $('score').textContent = `${done} / ${GOAL()}`; }
  const wait = Shih.startCover($('playArea'), () => { running = true; lastT = performance.now(); tick = requestAnimationFrame(loop); if (level < 3) Shih.speak(q.say); });
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  $('again2').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
