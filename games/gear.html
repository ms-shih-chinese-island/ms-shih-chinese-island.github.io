<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>找装备</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 找装备（消防局）：着火了！消防员说「我的帽子呢？」，学生在架子上点对的装备，装备就穿到他身上。
   Level 2 再选穿／戴；Level 3 一次两样，再排「他穿＿＿，戴＿＿。」
   答对 target 题就马上结束、给金币。点错了摇一摇（不算错）。设定在 units/fire/words.js 的 UNIT.gear */
body.game { background: #F6E3D6; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.bub { position: relative; width: 100%; box-sizing: border-box; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 20px; padding: 10px 14px; text-align: center; }
.bub::after { content: ''; position: absolute; left: 50%; bottom: -18px; margin-left: -9px; border: 9px solid transparent; border-top: 10px solid #2B2B2B; }
.bub .ruby { flex-wrap: wrap; justify-content: center; } .bub .ruby .py { font-size: 12px; } .bub .ruby .zh { font-size: 26px; }
.bub .again { margin-left: 6px; background: #FFF6D6; border: 2px solid #2B2B2B; border-radius: 10px; font-size: 18px; cursor: pointer; vertical-align: middle; }
.nb { display: inline-flex; white-space: nowrap; gap: 3px; align-items: flex-end; }
.ruby > .nb { flex-direction: row; } .nb > span { display: flex; flex-direction: column; align-items: center; }
.man { width: 150px; height: 270px; }
.man svg { width: 100%; height: 100%; display: block; }
.main { display: flex; flex-direction: column; gap: 12px; }
/* 装备架（消防局的车库） */
.rack { background: #B23B3B; border: 4px solid #2B2B2B; border-radius: 18px; padding: 56px 12px 12px; position: relative; box-shadow: inset 0 -10px 0 #8E2E2E; }
.rack .lbl { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); background: #FFF6D6; border: 3px solid #2B2B2B; border-radius: 10px; padding: 0 14px; white-space: nowrap; }
.rack .lbl .ruby .py { font-size: 11px; } .rack .lbl .ruby .zh { font-size: 20px; }
.items { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.it { background: #FFF8EC; border: 3px solid #2B2B2B; border-radius: 14px; cursor: pointer; padding: 4px 4px 6px; display: flex; flex-direction: column; align-items: center; font: inherit; }
.it svg { width: 100%; height: 74px; display: block; }
.it .en { font: 700 15px var(--f-latin); color: #2B2B2B; }
.it:hover { background: #FFF6D6; }
.it.oops { animation: shake .35s; border-color: var(--bad); }
.it.gone { visibility: hidden; }
.it.pick { background: #E3F4DC; border-color: var(--me); outline: 4px solid var(--me); outline-offset: 1px; }
.tip { text-align: center; background: #FFF6D6; border: 2px solid #E9B949; border-radius: 14px; padding: 4px 12px; font: 600 15px var(--f-latin); display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
.tip .ruby .py { font-size: 11px; } .tip .ruby .zh { font-size: 20px; } .tip > span { display: inline-flex; align-items: flex-end; gap: 6px; }
.tip[hidden], .panel[hidden] { display: none; }
.panel { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.sent { display: flex; align-items: flex-end; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 70px; }
.sent .ruby .py { font-size: 14px; } .sent .ruby .zh { font-size: 30px; font-weight: 700; }
.sent .dropSlot { min-height: 58px; padding: 2px 8px; box-sizing: border-box; }
.sent .dropSlot:not(.filled) { width: 96px; }
.sent .dropSlot .ruby .zh { font-size: 28px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.bank .wcard { min-width: 56px; justify-content: center; }
.bank .wcard .py { font-size: 13px; } .bank .wcard .zh { font-size: 26px; font-weight: 700; }
.bank .wcard.oops { animation: shake .35s; border-color: var(--bad); }
.timer.low { background: #FCE3E0; border-color: var(--bad); }
.timeUp { text-align: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 18px; padding: 10px; margin: 0 auto 10px; max-width: 640px; font: 700 18px var(--f-latin); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.timeUp .ruby .py { font-size: 12px; } .timeUp .ruby .zh { font-size: 26px; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill timer" id="timer">0:00</span>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>
  <div class="timeUp" id="timeUp" hidden><span class="ruby" id="timeUpRuby"></span><span id="timeUpTxt"></span><button class="ctl" id="again2" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="wrap">
        <div class="side">
          <div class="bub" id="bub"></div>
          <div class="man" id="man"></div>
        </div>
        <div class="main">
          <div class="rack"><span class="lbl" id="lbl"></span><div class="items" id="items"></div></div>
          <div class="tip" id="tip" hidden></div>
          <div class="panel" id="panel" hidden><div class="sent" id="sent"></div><div class="bank" id="bank"></div></div>
        </div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../units/fire/art.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.gear, ITEMS = C.items, V = C.verbs, FART = window.FART;
  const $ = id => document.getElementById(id);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  $('timeUpRuby').innerHTML = Shih.ruby('时间到了', 'shí jiān dào le');
  $('lbl').innerHTML = `<span class="ruby">${Shih.ruby('装备', 'zhuāng bèi')}</span>`;
  // 穿／戴 的小提示（Level 2）
  $('tip').innerHTML = ['穿', '戴'].map(k => `<span><span class="ruby">${Shih.ruby(V[k].zh, V[k].py)}</span>${V[k].en}</span>`).join('');
  Shih.soundButton($('soundBtn'));

  // ---- 计时：答对 target 题就马上结束、给金币；时间到了还没达标就没有金币 ----
  const timerEl = $('timer');
  const LIMIT = lv => C.time[lv - 1] * 1000, GOAL = () => C.target[level - 1];
  let left = 0, lastT = 0, tick = 0, running = false;
  const fmt = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  function loop() {
    if (!running) return;
    const now = performance.now(); left -= now - lastT; lastT = now;
    timerEl.textContent = '⏱ ' + fmt(Math.max(0, left)); timerEl.classList.toggle('low', left < 15000);
    if (left <= 0) { finish(); return; }
    tick = requestAnimationFrame(loop);
  }
  function finish() {
    running = false; cancelAnimationFrame(tick);
    if (done >= GOAL()) { $('winTime').textContent = 'Time left: ' + fmt(Math.max(0, left)); $('winMsg').hidden = false; Shih.speak('太棒了'); }
    else { $('timeUpTxt').textContent = `You got ${done} of ${GOAL()}. Try again!`; $('timeUp').hidden = false; Shih.speak('时间到了'); }
  }

  const LEVELS = [{ note: 'Find the gear + pinyin' }, { note: '+ 穿 or 戴?' }, { note: 'Two at a time + 穿／戴' }];
  let level = Shih.startLevel('gearLevel', 3);
  const paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('gearLevel', lv); setup(); });
  const HELP = ['Fire! The firefighter asks for his gear. Read and tap the right one.',
                'Tap the right gear, then choose 穿 or 戴 to finish the sentence.',
                'The firefighter asks for two things. Tap them both, then put them in the sentence: 穿 or 戴?'];
  const oops = el => { el.classList.remove('oops'); void el.offsetWidth; el.classList.add('oops'); setTimeout(() => el.classList.remove('oops'), 400); };
  const card = w => `<span class="ruby">${Shih.ruby(w.zh, w.py)}</span>`;

  // 一个消防员：6 样装备。Level 1、2 一题一样；Level 3 一题两样（一样穿、一样戴）
  let done = 0, worn = [], plan = [], q = null, got = [], busy = false;
  function newMan() {
    worn = [];
    if (level === 3) { const a = shuffle(ITEMS.filter(x => x.verb === '穿')), b = shuffle(ITEMS.filter(x => x.verb === '戴')); plan = a.map((x, i) => shuffle([x, b[i]])); }
    else plan = shuffle(ITEMS).map(x => [x]);
    // 架子：6 样装备 + 干扰，每个消防员换一次位置
    $('items').innerHTML = '';
    shuffle(ITEMS.concat(C.extra)).forEach(t => {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'it'; el.dataset.zh = t.zh;
      el.innerHTML = FART.icon(t.zh) + `<span class="en">${t.en}</span>`;      // 只写英文，不写中文
      el.addEventListener('click', () => tap(t, el));
      $('items').appendChild(el);
    });
  }
  function show() {
    if (!plan.length) newMan();
    q = plan.shift(); got = []; busy = false;
    const zh = `我的${q.map(x => x.zh).join('和')}呢？`, py = `wǒ de ${q.map(x => x.py).join(' hé ')} ne?`;
    q.say = zh;
    $('bub').innerHTML = `<span class="ruby"><span class="nb">${Shih.rubyText(zh, py)}</span></span><button type="button" class="again" id="again" aria-label="Listen again">🔊</button>`;
    $('again').addEventListener('click', () => Shih.speak(zh));
    $('man').innerHTML = FART.man(worn);
    $('panel').hidden = true;
    if (running) Shih.speak(zh);
    window.__gear = { ask: q.map(x => x.zh), step: 'tap', done };
  }
  function tap(t, el) {
    if (!running || busy || el.classList.contains('gone')) return;
    if (!q.includes(t) || got.includes(t)) { oops(el); return; }        // 拿错：摇一摇（不算错）
    got.push(t); worn.push(t.zh);
    el.classList.add('gone');
    $('man').innerHTML = FART.man(worn);
    if (got.length < q.length) return;
    if (level === 1) { good(); return; }
    busy = true;
    setTimeout(() => { if (running) say(); }, 400);
  }
  // Level 2：「他＿帽子。」选穿／戴；Level 3：「他穿＿＿，戴＿＿。」放装备
  function say() {
    let parts, opts;
    if (level === 2) {
      const x = q[0];
      parts = [{ zh: '他', py: 'tā' }, { want: x.verb }, x, { zh: '。', py: '' }];
      opts = [V['穿'], V['戴']];
    } else {
      const c = q.find(x => x.verb === '穿'), d = q.find(x => x.verb === '戴');
      parts = [{ zh: '他', py: 'tā' }, V['穿'], { want: c.zh }, { zh: '，', py: '' }, V['戴'], { want: d.zh }, { zh: '。', py: '' }];
      opts = shuffle(q.concat(shuffle(ITEMS.filter(x => !q.includes(x))).slice(0, 1)));
    }
    $('sent').innerHTML = parts.map(x => x.want ? `<span class="dropSlot" data-want="${x.want}"></span>` : `<span class="ruby">${Shih.rubyText(x.zh, x.py)}</span>`).join('');
    $('bank').innerHTML = '';
    const cards = opts.map(t => {
      const el = document.createElement('div');
      el.className = 'wcard'; el.dataset.zh = t.zh; el.innerHTML = card(t);
      $('bank').appendChild(el); return el;
    });
    $('panel').hidden = false; busy = false;
    const dnd = Shih.dragCards(cards, {
      slots: () => [...$('sent').querySelectorAll('.dropSlot:not(.filled)')],
      accept(cd, slot) {
        if (!running || busy) return true;
        if (cd.dataset.zh !== slot.dataset.want) { oops(cd); return true; }     // 拉错：摇一摇（不算错）
        const t = opts.find(x => x.zh === cd.dataset.zh);
        cd.classList.add('used'); slot.classList.add('filled'); slot.innerHTML = card(t);
        if (!$('sent').querySelector('.dropSlot:not(.filled)')) {
          Shih.speak(parts.map(x => x.want ? x.want : x.zh).join(''));
          good();
        }
        return true;
      }
    });
    $('sent').querySelectorAll('.dropSlot').forEach(d => d.addEventListener('click', () => { if (!d.classList.contains('filled')) dnd.tapSlot(d); }));
    window.__gear = { ask: q.map(x => x.zh), step: 'say', slots: [...$('sent').querySelectorAll('.dropSlot')].map(s => s.dataset.want), done };
  }
  function good() {
    busy = true; done++; update();
    const full = !plan.length;
    if (full) { $('man').innerHTML = FART.man(worn, 'great'); setTimeout(() => Shih.speak('谢谢！出发！'), 500); }
    if (done >= GOAL()) { running = false; cancelAnimationFrame(tick); setTimeout(finish, 800); return; }   // 达标了：马上结束，给金币
    setTimeout(() => { if (running) show(); }, full ? 1000 : (level === 1 ? 500 : 700));
  }
  function setup() {
    paintLevels(level);
    $('help').textContent = HELP[level - 1] + ` Get ${GOAL()} right in ${fmt(LIMIT(level))} to get coins!`;
    $('tip').hidden = level !== 2;
    done = 0; plan = [];
    running = false; cancelAnimationFrame(tick); left = LIMIT(level); timerEl.textContent = '⏱ ' + fmt(left); timerEl.classList.remove('low');
    $('winMsg').hidden = true; $('timeUp').hidden = true; update();
    show(); wait();
  }
  function update() { $('score').textContent = `${done} / ${GOAL()}`; }
  const wait = Shih.startCover($('playArea'), () => { running = true; lastT = performance.now(); tick = requestAnimationFrame(loop); Shih.speak(q.say); });
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  $('again2').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
