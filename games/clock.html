<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>几点起飞？</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 几点起飞？（机场）：看时钟说几点。Level 1 大时钟「现在几点？」选整点；Level 2 起飞时刻表，有「半」，选；Level 3 一个起飞时间，有「半」，学生自己用字键写。
   答对 target 题就马上结束、给金币。点错了摇一摇（不算错）。设定在 units/airport/words.js 的 UNIT.clock */
body.game { background: #E3EEF6; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.bub { position: relative; width: 100%; box-sizing: border-box; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 20px; padding: 10px 14px; text-align: center; }
.bub::after { content: ''; position: absolute; left: 50%; bottom: -18px; margin-left: -9px; border: 9px solid transparent; border-top: 10px solid #2B2B2B; }
.bub .ruby { flex-wrap: wrap; justify-content: center; } .bub .ruby .py { font-size: 12px; } .bub .ruby .zh { font-size: 24px; }
.bub .again { margin-left: 6px; background: #FFF6D6; border: 2px solid #2B2B2B; border-radius: 10px; font-size: 18px; cursor: pointer; vertical-align: middle; }
.nb { display: inline-flex; white-space: nowrap; gap: 3px; align-items: flex-end; }
.ruby > .nb { flex-direction: row; } .nb > span { display: flex; flex-direction: column; align-items: center; }
.pilot { width: 140px; height: 200px; }
.pilot svg { width: 100%; height: 100%; display: block; }
.tip { width: 100%; box-sizing: border-box; text-align: center; background: #FFF6D6; border: 2px solid #E9B949; border-radius: 14px; padding: 4px 12px; font: 600 15px var(--f-latin); display: flex; justify-content: center; gap: 4px 14px; flex-wrap: wrap; }
.tip > span { display: inline-flex; align-items: flex-end; gap: 6px; }
.tip .ruby .py { font-size: 11px; } .tip .ruby .zh { font-size: 20px; }
.main { display: flex; flex-direction: column; gap: 12px; }
.big { background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 22px; padding: 10px; display: flex; justify-content: center; }
.big svg { width: min(46%, 230px); }
.big.oops { animation: shake .35s; border-color: var(--bad); }
.big[hidden], .board[hidden] { display: none; }
/* 起飞时刻表 */
.board { background: #1F2A36; border: 4px solid #2B2B2B; border-radius: 18px; padding: 10px 14px 14px; color: #FFFFFF; }
.board .head { text-align: center; margin-bottom: 6px; }
.board .head .ruby .py { font-size: 11px; color: #C9D3DC; } .board .head .ruby .zh { font-size: 22px; color: #F5C531; }
.board .rows { display: grid; grid-template-columns: repeat(2, auto); gap: 8px 14px; justify-content: center; }
.board .row { display: flex; align-items: center; gap: 12px; background: #2E3D4D; border-radius: 12px; padding: 4px 14px; }
.board .row .ruby { min-width: 80px; justify-content: center; }
.board .row .ruby .py { font-size: 12px; color: #C9D3DC; } .board .row .ruby .zh { font-size: 26px; color: #FFFFFF; }
.board .row svg { width: 66px; height: 66px; display: block; }
.board .plane { font-size: 26px; }
.panel { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.sent { display: flex; align-items: flex-end; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 64px; }
.sent .ruby .py { font-size: 14px; } .sent .ruby .zh { font-size: 28px; font-weight: 700; }
.sent .dropSlot { min-height: 58px; padding: 2px 8px; box-sizing: border-box; }
.sent .dropSlot:not(.filled) { width: 120px; }
.sent .dropSlot .ruby .zh { font-size: 26px; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.bank .wcard { min-width: 70px; justify-content: center; cursor: pointer; }
.bank .wcard .py { font-size: 13px; } .bank .wcard .zh { font-size: 26px; font-weight: 700; }
.bank .wcard.oops { animation: shake .35s; border-color: var(--bad); }
.bank .nk { min-width: 46px; padding: 2px 6px; font: inherit; }
.bank .tool { font: 800 22px var(--f-latin); min-width: 54px; padding: 2px 12px; }
.bank .tool.ok { background: #E3F4DC; border-color: var(--me); }
.sent .numbox { min-width: 150px; width: auto !important; }
.numbox.oops { animation: shake .35s; border-color: var(--bad); }
.timer.low { background: #FCE3E0; border-color: var(--bad); }
.timeUp { text-align: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 18px; padding: 10px; margin: 0 auto 10px; max-width: 640px; font: 700 18px var(--f-latin); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.timeUp .ruby .py { font-size: 12px; } .timeUp .ruby .zh { font-size: 26px; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill timer" id="timer">0:00</span>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>
  <div class="timeUp" id="timeUp" hidden><span class="ruby" id="timeUpRuby"></span><span id="timeUpTxt"></span><button class="ctl" id="again2" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="wrap">
        <div class="side">
          <div class="bub" id="bub"></div>
          <div class="pilot" id="pilot"></div>
          <div class="tip" id="tip"></div>
        </div>
        <div class="main">
          <div class="big" id="big"></div>
          <div class="board" id="board" hidden></div>
          <div class="panel"><div class="sent" id="sent"></div><div class="bank" id="bank"></div></div>
        </div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/npcs.js"></script>
<script src="../units/airport/art.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.clock, H = C.hours, CITIES = UNIT.weather.cities, WART = window.WART;
  const $ = id => document.getElementById(id);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh.replace('？', ''), C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  $('timeUpRuby').innerHTML = Shih.ruby('时间到了', 'shí jiān dào le');
  Shih.soundButton($('soundBtn'));

  // ---- 计时：答对 target 题就马上结束、给金币；时间到了还没达标就没有金币 ----
  const timerEl = $('timer');
  const LIMIT = lv => C.time[lv - 1] * 1000, GOAL = () => C.target[level - 1];
  let left = 0, lastT = 0, tick = 0, running = false;
  const fmt = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  function loop() {
    if (!running) return;
    const now = performance.now(); left -= now - lastT; lastT = now;
    timerEl.textContent = '⏱ ' + fmt(Math.max(0, left)); timerEl.classList.toggle('low', left < 15000);
    if (left <= 0) { finish(); return; }
    tick = requestAnimationFrame(loop);
  }
  function finish() {
    running = false; cancelAnimationFrame(tick);
    if (done >= GOAL()) { $('winTime').textContent = 'Time left: ' + fmt(Math.max(0, left)); $('winMsg').hidden = false; Shih.speak('太棒了'); }
    else { $('timeUpTxt').textContent = `You got ${done} of ${GOAL()}. Try again!`; $('timeUp').hidden = false; Shih.speak('时间到了'); }
  }

  const LEVELS = [{ note: "Read the clock (o'clock)" }, { note: 'Departure board + half past (半)' }, { note: 'Half past (半), write it yourself' }];
  let level = Shih.startLevel('clockLevel', 3);
  const paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('clockLevel', lv); setup(); });
  const HELP = ['Look at the clock. What time is it? Tap the right time.',
                'Read the departure board — some planes leave at half past (半). Tap the right time.',
                'Look at the clock — it may be half past (半). Write the time yourself with the keys, then press Submit.'];
  const oops = el => { el.classList.remove('oops'); void el.offsetWidth; el.classList.add('oops'); setTimeout(() => el.classList.remove('oops'), 400); };
  const card = w => `<span class="ruby">${Shih.ruby(w.zh, w.py)}</span>`;

  // 时间 { h: 1～12, m: 0 或 30 } → 三点、三点半
  const tw = t => ({ zh: H[t.h - 1].zh + (t.m ? C.half.zh : ''), py: H[t.h - 1].py + (t.m ? ' ' + C.half.py : ''), key: t.h + ':' + t.m });
  const wrapH = h => ((h - 1 + 12) % 12) + 1;
  // 时钟
  // small：时刻表上的小时钟，只写 12、3、6、9
  function clockSVG(t, small) {
    const nums = Array.from({ length: 12 }, (_, i) => { const n = i + 1, a = n * Math.PI / 6; if (small && n % 3) return ''; return `<text x="${50 + Math.sin(a) * 32}" y="${50 - Math.cos(a) * 32 + 4}" text-anchor="middle" font-size="${small ? 13 : 10}" font-weight="800" font-family="Fredoka, sans-serif" fill="#2B2B2B">${n}</text>`; }).join('');
    const ha = ((t.h % 12) + t.m / 60) * 30, ma = t.m * 6;
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4"/>` +
      Array.from({ length: 12 }, (_, i) => `<path d="M50 6 L50 10" transform="rotate(${i * 30} 50 50)" stroke="#2B2B2B" stroke-width="2"/>`).join('') + nums +
      `<path d="M50 50 L50 32" transform="rotate(${ha} 50 50)" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"/>` +
      `<path d="M50 50 L50 23" transform="rotate(${ma} 50 50)" stroke="#3B78D8" stroke-width="3.5" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#2B2B2B"/></svg>`;
  }

  let done = 0, q = null, lastKey = '', busy = false;
  const randT = () => ({ h: rnd(1, 12), m: level >= 2 && Math.random() < .6 ? 30 : 0 });
  function show() {
    busy = false;
    let t; do { t = randT(); } while (t.h + ':' + t.m === lastKey); lastKey = t.h + ':' + t.m;
    q = { t };
    // Level 1、3：一个大时钟；Level 2：起飞时刻表（4 个城市）
    $('big').hidden = level === 2; $('board').hidden = level !== 2;
    let opts = [tw(t)];
    const add = x => { const w = tw(x); if (!opts.some(o => o.key === w.key)) opts.push(w); };
    let head, tail;
    if (level === 1) {
      $('big').innerHTML = clockSVG(t);
      say('现在几点？', 'xiàn zài jǐ diǎn?');
      if (t.h !== 12) add({ h: 12, m: 0 });                  // 时针、分针看反了（分针指着 12）
      add({ h: wrapH(t.h + (Math.random() < .5 ? 1 : -1)), m: 0 });
      head = { zh: '现在', py: 'xiàn zài' }; tail = { zh: '。', py: '' };
    } else if (level === 2) {
      // 时刻表：4 个城市，时间都不一样，有半点
      const cs = shuffle(CITIES).slice(0, 4);
      const ts = [t];
      while (ts.length < 4) { const x = randT(); if (!ts.some(y => y.h === x.h && y.m === x.m)) ts.push(x); }
      q.rows = shuffle(cs.map((c, i) => ({ c, t: ts[i] })));
      q.row = q.rows.find(r => r.t === t); q.city = q.row.c;
      $('board').innerHTML = `<div class="head"><span class="ruby">${Shih.ruby('起飞时间', 'qǐ fēi shí jiān')}</span></div><div class="rows">` +
        q.rows.map(r => `<div class="row"><span class="plane">✈</span>${card(r.c)}${clockSVG(r.t, true)}</div>`).join('') + '</div>';
      say(`去${q.city.zh}的飞机几点起飞？`, `qù ${q.city.py} de fēi jī jǐ diǎn qǐ fēi?`, q.city.zh.length + 1);
      // 混淆：三点／三点半、看成四点或两点半、时刻表上别的城市的时间
      add({ h: t.h, m: t.m ? 0 : 30 });
      if (t.m) add({ h: wrapH(t.h + 1), m: 0 }); else add({ h: wrapH(t.h - 1), m: 30 });
      const other = q.rows.filter(r => r !== q.row)[0]; add(other.t);
      head = { zh: `去${q.city.zh}的飞机`, py: `qù ${q.city.py} de fēi jī` }; tail = { zh: '起飞。', py: 'qǐ fēi.' };
    } else {
      // Level 3：一个起飞时间（不分城市），有半点，自己写
      $('big').innerHTML = clockSVG(t);
      say('飞机几点起飞？', 'fēi jī jǐ diǎn qǐ fēi?');
      head = { zh: '飞机', py: 'fēi jī' }; tail = { zh: '起飞。', py: 'qǐ fēi.' };
    }
    while (opts.length < 3) add({ h: wrapH(t.h + rnd(1, 3) * (Math.random() < .5 ? 1 : -1)), m: t.m });
    opts = shuffle(opts.slice(0, level === 2 ? 4 : 3));
    q.ans = tw(t);
    $('sent').innerHTML = `<span class="ruby">${Shih.rubyText(head.zh, head.py)}</span><span class="dropSlot" id="slot"></span><span class="ruby">${Shih.rubyText(tail.zh, tail.py)}</span>`;
    $('bank').innerHTML = '';
    if (level === 3) { writeIt(head, tail); return; }
    opts.forEach(o => {
      const el = document.createElement('div');
      el.className = 'wcard'; el.dataset.zh = o.zh; el.innerHTML = card(o);
      el.addEventListener('click', () => {
        if (!running || busy) return;
        if (o.key !== q.ans.key) { oops(el); return; }               // 选错：摇一摇（不算错）
        el.classList.add('used'); $('slot').classList.add('filled'); $('slot').innerHTML = card(o);
        Shih.speak(head.zh + o.zh + tail.zh); good();
      });
      $('bank').appendChild(el);
    });
    window.__ck = { ans: q.ans.zh, done };
  }
  // Level 3：没有选项，学生用字键自己写时间（一～十、两、点、半），⌫ 删掉，按 Submit
  const KEYS = '一二三四五六七八九十'.split('').map((zh, i) => ({ zh, py: ['yī', 'èr', 'sān', 'sì', 'wǔ', 'liù', 'qī', 'bā', 'jiǔ', 'shí'][i] }))
    .concat([{ zh: '两', py: 'liǎng' }, { zh: '点', py: 'diǎn' }, C.half]);
  function writeIt(head, tail) {
    let typed = [];
    const box = $('slot'); box.classList.add('numbox');
    const paint = () => { box.innerHTML = typed.length ? `<span class="ruby">${typed.map(x => Shih.ruby(x.zh, x.py)).join('')}</span>` : ''; };
    KEYS.forEach(k => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'wcard nk'; b.dataset.zh = k.zh; b.innerHTML = card(k);
      b.addEventListener('click', () => { if (!running || busy) return; if (typed.length < 6) { typed.push(k); paint(); } });
      $('bank').appendChild(b);
    });
    $('bank').insertAdjacentHTML('beforeend', `<button type="button" class="wcard nk tool" id="del" aria-label="Delete">⌫</button><button type="button" class="wcard nk tool ok" id="chk">✓ Submit</button>`);
    $('del').addEventListener('click', () => { typed.pop(); paint(); });
    $('chk').addEventListener('click', e => {
      if (!running || busy) return;
      if (typed.map(x => x.zh).join('') !== q.ans.zh) { oops(box); oops(e.currentTarget); return; }   // 不对：摇一摇，改一改
      box.classList.add('filled'); box.innerHTML = card(q.ans);
      Shih.speak(head.zh + q.ans.zh + tail.zh); good();
    });
    window.__ck = { ans: q.ans.zh, keys: Array.from(q.ans.zh), done };
  }
  function say(zh, py, cut) {
    let zs = [zh], ps = [py];
    if (cut) { const pc = py.split(' '); zs = [zh.slice(0, cut), zh.slice(cut)]; ps = [pc.slice(0, cut).join(' '), pc.slice(cut).join(' ')]; }
    $('bub').innerHTML = `<span class="ruby">${zs.map((z, i) => `<span class="nb">${Shih.rubyText(z, ps[i] || '')}</span>`).join('')}</span><button type="button" class="again" id="again" aria-label="Listen again">🔊</button>`;
    $('again').addEventListener('click', () => Shih.speak(zh));
    q.say = zh;
    if (running) Shih.speak(zh);
  }
  function good() {
    busy = true; done++; update();
    if (done >= GOAL()) { running = false; cancelAnimationFrame(tick); setTimeout(finish, 1100); return; }   // 达标了：马上结束，给金币
    setTimeout(() => { if (running) show(); }, 1200);
  }
  function setup() {
    paintLevels(level);
    $('help').textContent = HELP[level - 1] + ` Get ${GOAL()} right in ${fmt(LIMIT(level))} to get coins!`;
    $('tip').innerHTML = C.tips[level - 1].map(t => `<span><span class="ruby">${Shih.ruby(t.zh, t.py)}</span>${t.en}</span>`).join('');
    $('pilot').innerHTML = WART.pilot(Math.random() < .5 ? 'man' : 'woman');
    done = 0; lastKey = '';
    running = false; cancelAnimationFrame(tick); left = LIMIT(level); timerEl.textContent = '⏱ ' + fmt(left); timerEl.classList.remove('low');
    $('winMsg').hidden = true; $('timeUp').hidden = true; update();
    show(); wait();
  }
  function update() { $('score').textContent = `${done} / ${GOAL()}`; }
  const wait = Shih.startCover($('playArea'), () => { running = true; lastT = performance.now(); tick = requestAnimationFrame(loop); Shih.speak(q.say); });
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  $('again2').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
