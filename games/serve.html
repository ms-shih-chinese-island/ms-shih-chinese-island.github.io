<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>快手出菜 Speedy Server</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 快手出菜（取代以前的「小小服务生」）
   三个客人排队，头上说要什么：我要吃炒饭。我要喝茶。请给我（一双）筷子。你有没有饺子？（按 有／没有）
   把厨房窗口的东西拉给对的客人。
   ⚡ 快手：90 秒，每个客人有耐心条，太慢客人生气走掉。  🐢 慢慢来：没有时间，客人会一直等。
   Level 1：一次一样，有拼音，餐具不加量词
   Level 2：一、两样，没有拼音，餐具加量词（一双筷子、一把叉子）
   Level 3：两样，或「我要喝汤。」（哪一种汤都可以）
   👀 看：有字；👂 听：只有 🔊（多一颗金币）。⚡ 快手也多一颗金币。
   金币：时间内送完指定的客人数就有（拉错、客人生气走掉都没关系）；时间到没送完就没有。 */
body.game { background: #FFF3E6; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.line3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 22px; padding: 10px; min-height: 250px;
  background-image: linear-gradient(transparent 82%, #E8D29A 82%); }
.spot { position: relative; border: 3px dashed transparent; border-radius: 18px; padding: 6px 4px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; transition: transform .25s, opacity .25s; }
.spot.empty { opacity: 0; transform: translateX(30px); pointer-events: none; }
.spot.hover, .spot.armed { border-color: var(--pick); background: var(--pick-soft); }
.spot.oops { animation: shake .35s; }
.kitem.oops { animation: shake .35s; border-color: var(--bad); }
.spot.bye { opacity: 0; transform: translateX(-40px); }
.spot .bub { position: relative; border: 3px solid #E9B949; background: #FFF6D6; border-radius: 18px; padding: 4px 10px 6px; min-height: 54px; max-width: 100%; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 2px 4px; cursor: pointer; }
.spot .bub::after { content: ''; position: absolute; bottom: -14px; left: 50%; margin-left: -8px; border: 8px solid transparent; border-top: 8px solid #E9B949; }
.spot .bub .ruby { flex-wrap: wrap; row-gap: 2px; }
.spot .bub .ruby .py { font-size: 13px; } .spot .bub .ruby .zh { font-size: clamp(20px, 2.6vw, 28px); }
.spot .bub .plain { font: 700 clamp(20px, 2.6vw, 28px) var(--f-zh); }
.spot .bub .ear { font-size: 32px; line-height: 1; }
.spot .bub.happy { border-color: var(--me-ink); background: var(--me-done); }
.spot .bub.happy::after { border-top-color: var(--me-ink); }
.spot .bub.mad { border-color: var(--bad); background: #FCE3E0; }
.spot .bub.mad::after { border-top-color: var(--bad); }
.spot .kid svg { width: 96px; height: 96px; display: block; }
.spot .nm { font: 700 13px var(--f-latin); }
.spot .got { display: flex; gap: 2px; min-height: 40px; }
.spot .got svg { width: 40px; height: 40px; }
.patience { width: 80%; height: 10px; border: 2px solid #2B2B2B; border-radius: 6px; background: #FFFFFF; overflow: hidden; }
.patience i { display: block; height: 100%; width: 100%; background: #5BB36A; transition: width .1s linear; }
.patience.mid i { background: #F5C531; } .patience.low i { background: #E5483B; }
.yn { display: flex; gap: 8px; }
.yn button { font: 700 14px var(--f-latin); border: 3px solid #2B2B2B; border-radius: 12px; background: #FFFFFF; padding: 2px 10px 4px; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 3px 0 #2B2B2B; }
.yn button .ruby .py { font-size: 11px; } .yn button .ruby .zh { font-size: 22px; }
.yn button.oops { animation: shake .35s; border-color: var(--bad); }
.kitchen { background: #F2D6A8; border: 3px solid #2B2B2B; border-radius: 22px; padding: 8px 10px 10px; }
.kitchen .cap { font: 700 14px var(--f-latin); color: #7A4A2A; display: flex; align-items: flex-end; gap: 6px; margin-bottom: 6px; }
.kitchen .cap .ruby .py { font-size: 10px; } .kitchen .cap .ruby .zh { font-size: 16px; }
.kitems { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.kitem { background: #FFFDF6; border: 3px solid #2B2B2B; border-radius: 16px; padding: 4px; cursor: grab; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; touch-action: none; }
.kitem svg { width: 100%; height: 100%; display: block; pointer-events: none; }
.kitem.picked { outline: 4px solid var(--pick); outline-offset: 2px; }
.kitem.dragging { position: fixed; z-index: 50; pointer-events: none; box-shadow: 0 10px 24px rgba(43,43,43,.25); }
.clock { font-variant-numeric: tabular-nums; }
.clock.low { background: #FCE3E0; border-color: var(--bad); }
.timeUp { text-align: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 18px; padding: 10px; margin: 0 auto 10px; max-width: 640px; font: 700 18px var(--f-latin); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.timeUp .ruby .py { font-size: 12px; } .timeUp .ruby .zh { font-size: 26px; }
@media (max-width: 700px) { .spot .kid svg { width: 70px; height: 70px; } .kitems { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); } }
@media (orientation: landscape) and (max-height: 720px) { .line3 { min-height: 200px; } .spot .kid svg { width: 70px; height: 70px; } .kitems { grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); } }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill clock" id="clock" hidden>1:30</span>
      <span class="pill" id="timer">0:00</span>
      <button class="ctl" id="timerBtn" type="button"></button>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>
  <div class="timeUp" id="timeUp" hidden><span class="ruby" id="timeUpRuby"></span><span id="timeUpTxt"></span><button class="ctl" id="again2" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="wrap">
        <div class="line3" id="line"></div>
        <div class="kitchen"><div class="cap" id="kcap"></div><div class="kitems" id="kitems"></div></div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/kids.js"></script>
<script src="../units/restaurant/art.js"></script>
<script src="../shared/rest.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.serve, KIDS = window.ART, RART = window.RART;
  const $ = id => document.getElementById(id);
  const { pick, take, shuffle } = Rest;
  const W = Shih.wordMap(UNIT);
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  $('timeUpRuby').innerHTML = Shih.ruby('时间到了', 'shí jiān dào le');
  $('kcap').innerHTML = `<span class="ruby">${Shih.ruby('厨房', 'chú fáng')}</span> Kitchen — drag to a customer`;
  let speed = Shih.get('serveSpeed', 'fast') === 'slow' ? 'slow' : 'fast';
  const timerEl = $('timer'), timer = Shih.timer(timerEl);
  const timerOn = Shih.toggle($('timerBtn'), 'timer', '⏱ Timer on', '⏱ Timer off', true, on => { timerEl.hidden = !on || speed === 'fast'; });
  Shih.soundButton($('soundBtn'));

  // ---- 👀／👂、🐢／⚡、Level ----
  const mode = Rest.modeRow(() => { buildLevels(); setup(); });
  const SPEEDS = [
    { id: 'slow', icon: '🐢', zh: '慢慢来', py: 'màn màn lái', en: 'Practice' },
    { id: 'fast', icon: '⚡', zh: '快手', py: 'kuài shǒu', en: '90 seconds (+1 coin)' }
  ];
  const paintSpeed = Shih.choiceRow(SPEEDS, speed, id => { speed = id; Shih.set('serveSpeed', id); paintSpeed(id); buildLevels(); setup(); }, 'Speed');
  Shih.coinBonus = () => (mode() === 'listen' ? 1 : 0) + (speed === 'fast' ? 1 : 0);
  const LEVELS = [{ note: '1 thing + pinyin' }, { note: '1–2 things + 一双、一把' }, { note: '2 things, or 我要喝汤' }];
  let level = Shih.startLevel('serveLevel', 3);
  let paintLevels = () => {};
  function buildLevels() { paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('serveLevel', lv); setup(); }); }
  buildLevels();

  // ---- 句子 ----
  const MW = { 筷子: ['一双', 'yì shuāng'], 叉子: ['一把', 'yì bǎ'], 刀子: ['一把', 'yì bǎ'], 餐巾: ['一张', 'yì zhāng'] };
  const mw = z => MW[z] || ['一个', 'yí ge'];
  const sip = w => w.drink || /汤$/.test(w.zh);
  const joinL = parts => parts.length === 1 ? parts[0] : { zh: parts.slice(0, -1).map(p => p.zh).join('、') + '和' + parts[parts.length - 1].zh, py: parts.slice(0, -1).map(p => p.py).join(' ') + ' hé ' + parts[parts.length - 1].py };
  // items → 「我要吃A和B，我要喝C，请给我一双筷子。」
  function sentence(items) {
    const eat = items.filter(w => w.kind !== 'tool' && !sip(w)), drink = items.filter(w => w.kind !== 'tool' && sip(w)), tool = items.filter(w => w.kind === 'tool');
    const out = [];
    if (eat.length) { const L = joinL(eat.map(w => ({ zh: w.zh, py: w.py }))); out.push({ zh: '我要吃' + L.zh, py: 'wǒ yào chī ' + L.py }); }
    if (drink.length) { const L = joinL(drink.map(w => ({ zh: w.zh, py: w.py }))); out.push({ zh: '我要喝' + L.zh, py: 'wǒ yào hē ' + L.py }); }
    if (tool.length) {
      const L = joinL(tool.map(w => level === 1 ? { zh: w.zh, py: w.py } : { zh: mw(w.zh)[0] + w.zh, py: mw(w.zh)[1] + ' ' + w.py }));
      out.push({ zh: '请给我' + L.zh, py: 'qǐng gěi wǒ ' + L.py });
    }
    return { zh: out.map(o => o.zh).join('，') + '。', py: out.map(o => o.py).join(', ') + '.' };
  }

  // ---- 一个客人要什么 ----
  // need: { zh } 一样东西；或 { cat } 一类（汤、小菜、主菜、米饭），哪一样都可以
  const foods = () => UNIT.pool(level, 'food'), drinks = () => UNIT.pool(level, 'drink'), tools = () => UNIT.pool(1, 'tool');
  const catOf = w => w.menu || null;
  const fits = (need, z) => need.zh ? need.zh === z : (W[z] && catOf(W[z]) === need.cat);
  function makeOrder() {
    const F = foods(), D = drinks(), T = tools();
    const r = Math.random();
    if (level <= 2 && r < 0.2) {                      // 你有没有＿＿？
      const it = pick(F), has = Math.random() < 0.5;
      return { ask: { w: it, has }, needs: [] };
    }
    let items;
    if (level === 1) items = [pick(Math.random() < 0.35 ? T : Math.random() < 0.3 ? D : F)];
    else if (level === 2) {
      const k = Math.random();
      items = k < 0.35 ? [pick(F.concat(D))] : k < 0.65 ? take(F, 2) : [pick(F), pick(T)];
    } else {
      // 只用「汤」：我要喝汤。→ 哪一种汤都可以（小菜、主菜太难分，不用）
      const cats = ['汤'].filter(c => F.filter(w => w.menu === c).length >= 2);
      if (cats.length && r < 0.25) {
        const cat = cats[0];
        const col = UNIT.menuCols.find(c => c.zh === cat);
        const verb = cat === '汤' ? ['喝', 'hē'] : ['吃', 'chī'];
        return { line: { zh: `我要${verb[0]}${cat}。`, py: `wǒ yào ${verb[1]} ${col.py}.` }, needs: [{ cat }] };
      }
      const k = Math.random();
      items = k < 0.35 ? take(F, 2) : k < 0.7 ? [pick(F), pick(D)] : [pick(F), pick(T)];
    }
    return { line: sentence(items), needs: items.map(w => ({ zh: w.zh })) };
  }

  // ---- 状态 ----
  const TARGET = () => (C.target || [8, 8, 6])[level - 1];
  // 每个客人等多久（秒）：基本时间＋要的东西越多等越久
  const PATIENCE = n => ([30, 40, 45][level - 1] + 8 * Math.max(0, (n || 1) - 1)) * 1000;
  const GAME_MS = 90 * 1000;
  let spots = [null, null, null], served = 0, spawned = 0, playing = false, ended = false, left = GAME_MS, tick = 0, lastT = 0, kitchen = [], dnd = null, peopleBag = [];
  const nextKid = () => { if (!peopleBag.length) peopleBag = shuffle(KIDS.people); return peopleBag.pop(); };
  const hidePy = () => level > 1;
  const rb = (zh, py) => hidePy() ? `<span class="plain">${zh}</span>` : `<span class="ruby">${Shih.rubyText(zh, py)}</span>`;

  function spawn(i) {
    if (ended || spots[i]) return;
    const active = spots.filter(Boolean).length;
    if (served + active >= TARGET()) return;
    const o = makeOrder();
    // 同一个时间，不要两个客人问同一样东西「有没有」
    if (o.ask && spots.some(c => c && c.ask && c.ask.w.zh === o.ask.w.zh)) return spawn(i);
    spots[i] = Object.assign(o, { kid: nextKid(), got: [], wait: PATIENCE(o.needs.length), max: PATIENCE(o.needs.length), id: ++spawned, state: o.ask ? 'ask' : 'order' });
    refreshKitchen();
    paintSpot(i);
    say(i);
  }
  function lineOf(c) { return c.state === 'ask' ? { zh: `你有没有${c.ask.w.zh}？`, py: `nǐ yǒu méi yǒu ${c.ask.w.py}?` } : c.line; }
  function say(i) { const c = spots[i]; if (c && playing) Rest.speak(lineOf(c).zh); }
  function paintSpot(i) {
    const el = $('line').children[i], c = spots[i];
    if (!c) { el.className = 'spot empty'; el.innerHTML = ''; return; }
    const L = lineOf(c), listen = mode() === 'listen' && c.state !== 'done';
    const body = c.state === 'done' ? `<span class="ruby">${Shih.rubyText('谢谢你！', 'xiè xie nǐ!')}</span>` :
      c.state === 'mad' ? `<span class="plain">😠</span>` :
      listen ? `<span class="ear" aria-label="Listen">🔊</span>` : rb(L.zh, L.py) + (hidePy() ? '' : Rest.alt(c.needs[0] && c.needs[0].zh ? W[c.needs[0].zh] : null));
    el.className = 'spot' + (c.state === 'order' ? ' dropSlot' : '');
    el.dataset.i = i;
    el.innerHTML = `<div class="bub${c.state === 'done' ? ' happy' : c.state === 'mad' ? ' mad' : ''}">${body}</div>` +
      (c.state === 'ask' ? `<div class="yn"><button type="button" data-y="1">${'<span class="ruby">' + Shih.ruby('有', 'yǒu') + '</span>'}Yes</button><button type="button" data-y="0"><span class="ruby">${Shih.ruby('没有', 'méi yǒu')}</span>No</button></div>` : '') +
      `<div class="kid">${KIDS.kid(c.kid, c.state === 'done' ? 'great' : c.state === 'mad' ? 'notgood' : 'hungry')}</div><div class="nm">${Shih.esc(c.kid.first)}</div>` +
      (speed === 'fast' && (c.state === 'order' || c.state === 'ask') ? `<div class="patience"><i></i></div>` : '') +
      `<div class="got">${c.got.map(z => RART.svg(z)).join('')}</div>`;
    el.querySelector('.bub').addEventListener('click', () => say(i));
    el.querySelectorAll('.yn button').forEach(b => b.addEventListener('click', () => answer(i, b.dataset.y === '1', b)));
    paintPatience(i);
  }
  function paintPatience(i) {
    const c = spots[i], bar = $('line').children[i].querySelector('.patience');
    if (!c || !bar) return;
    const f = Math.max(0, c.wait / c.max);
    bar.querySelector('i').style.width = (f * 100) + '%';
    bar.className = 'patience' + (f < 0.25 ? ' low' : f < 0.55 ? ' mid' : '');
  }
  function answer(i, yes, btn) {
    const c = spots[i];
    if (!playing || !c || c.state !== 'ask') return;
    if (yes !== c.ask.has) { oops(btn); return; }
    if (yes) {
      Shih.speak('有');
      c.state = 'order'; c.line = sentence([c.ask.w]); c.needs = [{ zh: c.ask.w.zh }];
      paintSpot(i); setTimeout(() => say(i), 500);
    } else {
      Shih.speak('没有');
      c.line = { zh: '好。', py: 'hǎo.' };
      finish(i, true);
    }
  }
  // 摇一摇：用 oops，不用 shake/wrong（那两个会让这一局没有金币）。快手出菜只要时间内送完就有金币
  const oops = el => { if (!el || !el.classList) return; el.classList.remove('oops'); void el.offsetWidth; el.classList.add('oops'); };
  // 客人走了：happy = 送对了；不然是生气走掉
  function finish(i, happy) {
    const c = spots[i];
    c.state = happy ? 'done' : 'mad';
    if (happy) { served++; update(); }
    else oops($('line').children[i]);
    paintSpot(i);
    setTimeout(() => {
      if (spots[i] !== c) return;
      $('line').children[i].classList.add('bye');
      setTimeout(() => {
        if (spots[i] !== c) return;
        spots[i] = null; paintSpot(i); refreshKitchen();
        if (served >= TARGET()) return win();
        setTimeout(() => spawn(i), speed === 'fast' ? 700 : 900);
      }, 300);
    }, happy ? 900 : 1200);
  }

  // ---- 厨房窗口：一直有客人要的东西，再加别的 ----
  function refreshKitchen() {
    const K = level === 1 ? 8 : 10;
    const active = spots.filter(Boolean);
    const must = new Set(), no = new Set();
    active.forEach(c => {
      if (c.ask) (c.ask.has ? must : no).add(c.ask.w.zh);
      if (c.state === 'order' || c.state === 'ask') c.needs.forEach((n, k) => { if (n.zh && !c.got[k]) must.add(n.zh); });
    });
    let list = kitchen.filter(z => !no.has(z));
    const needed = z => must.has(z) || active.some(c => c.state === 'order' && c.needs.some(n => n.cat && fits(n, z)));
    const put = z => {
      if (list.includes(z)) return;
      if (list.length < K) { list.push(z); return; }
      const free = list.map((x, k) => k).filter(k => !needed(list[k]));
      list[pick(free)] = z;
    };
    must.forEach(put);
    active.forEach(c => { if (c.state === 'order') c.needs.forEach(n => { if (n.cat && !list.some(z => fits(n, z))) put(pick(foods().filter(w => w.menu === n.cat)).zh); }); });
    const extra = shuffle(foods().concat(drinks(), take(tools(), level === 1 ? 3 : 4))).map(w => w.zh).filter(z => !no.has(z));
    for (const z of extra) { if (list.length >= K) break; if (!list.includes(z)) list.push(z); }
    if (list.join() === kitchen.join()) return;
    kitchen = list;
    const box = $('kitems'); box.innerHTML = '';
    const cards = kitchen.map(z => {
      const el = document.createElement('div');
      el.className = 'kitem'; el.dataset.zh = z; el.setAttribute('aria-label', W[z].en);
      el.innerHTML = RART.svg(z);
      box.appendChild(el);
      return el;
    });
    dnd = Shih.dragCards(cards, { slots: () => [...$('line').querySelectorAll('.spot.dropSlot')], accept: give });
  }
  // 把东西拉给客人
  function give(card, slot) {
    if (!playing) return true;
    const i = +slot.dataset.i, c = spots[i], z = card.dataset.zh;
    if (!c || c.state !== 'order') return true;
    const k = c.needs.findIndex((n, j) => !c.got[j] && fits(n, z));
    if (k < 0) { oops(slot); oops(card); return true; }   // 拉错：摇一摇，东西回到厨房（不算错，金币照拿）
    c.got[k] = z;
    Rest.speak(z);
    if (c.needs.every((n, j) => c.got[j])) finish(i, true);
    else { paintSpot(i); refreshKitchen(); }
    return true;
  }

  // ---- 时间 ----
  const fmt = ms => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  function loop() {
    if (!playing || ended) return;
    const now = performance.now(), dt = now - lastT; lastT = now;
    if (speed === 'fast') {
      left -= dt;
      $('clock').textContent = '⏱ ' + fmt(Math.max(0, left));
      $('clock').classList.toggle('low', left < 15000);
      spots.forEach((c, i) => {
        if (!c || (c.state !== 'order' && c.state !== 'ask')) return;
        c.wait -= dt; paintPatience(i);
        if (c.wait <= 0) finish(i, false);
      });
      if (left <= 0) return timeUp();
    }
    tick = requestAnimationFrame(loop);
  }
  function win() {
    if (ended) return;
    ended = true; playing = false; cancelAnimationFrame(tick);
    const ms = timer.stop();
    $('winTime').textContent = speed === 'fast' ? `Time left: ${fmt(Math.max(0, left))}` : timerOn() ? 'Time: ' + Shih.fmt(ms) : '';
    $('winMsg').hidden = false; Shih.speak('太棒了');
  }
  function timeUp() {
    ended = true; playing = false; cancelAnimationFrame(tick); timer.stop();
    $('timeUpTxt').textContent = `Time's up! You served ${served} of ${TARGET()} customers. Try again!`;
    $('timeUp').hidden = false; Shih.speak('时间到了');
  }
  function update() { $('score').textContent = `${served} / ${TARGET()}`; }
  const wait = Shih.startCover($('playArea'), () => {
    playing = true; lastT = performance.now();
    if (speed === 'slow' && timerOn()) timer.start();
    spawn(0); setTimeout(() => spawn(1), 1800); setTimeout(() => spawn(2), 3600);
    tick = requestAnimationFrame(loop);
  });
  function setup() {
    paintLevels(level); paintSpeed(speed);
    cancelAnimationFrame(tick);
    playing = false; ended = false; served = 0; spawned = 0; left = GAME_MS; kitchen = []; peopleBag = [];
    spots = [null, null, null];
    $('line').innerHTML = '<div class="spot empty"></div><div class="spot empty"></div><div class="spot empty"></div>';
    $('clock').hidden = speed !== 'fast'; $('clock').textContent = '⏱ ' + fmt(GAME_MS); $('clock').classList.remove('low');
    timerEl.hidden = speed === 'fast' || !timerOn(); $('timerBtn').hidden = speed === 'fast';
    $('help').textContent = (mode() === 'listen' ? 'Tap 🔊 to hear each customer. ' : 'Read what each customer wants. ') +
      'Drag the right thing from the kitchen to them.' + (speed === 'fast' ? ' Be quick — they won\'t wait forever!' : '');
    refreshKitchen();
    timer.reset(); $('winMsg').hidden = true; $('timeUp').hidden = true; update();
    window.__serve = { spots: () => spots, kitchen: () => kitchen, give: (z, i) => give({ dataset: { zh: z } }, $('line').children[i]), answer: (i, y) => answer(i, y, $('line').children[i]), level: () => level, served: () => served };
    wait();
  }
  // 先点东西、再点客人（或先点客人、再点东西）
  $('line').addEventListener('click', e => { const s = e.target.closest('.spot.dropSlot'); if (s && dnd && !e.target.closest('.bub')) dnd.tapSlot(s); });
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  $('again2').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
