<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>划龙舟</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 划龙舟（端午节）：数字答对了，我的龙舟就往前划。先划到终点（答对 target 题）就赢了、给金币。
   Level 1 英文 one～ten → 选中文；Level 2 英文 1～100 → 拼出中文；Level 3 英文（百、千）→ 拼出中文。
   答错了摇一摇（不扣分）。设定在 units/duanwu/words.js 的 UNIT.dragonboat */
body.game { background: #E8F4F8; }
.box { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.river { position: relative; height: 300px; border: 4px solid #2B2B2B; border-radius: 22px; overflow: hidden; background: linear-gradient(#9CCB8A 0 9%, #5BA7D6 9% 91%, #9CCB8A 91%); }
.lane { position: absolute; left: 0; right: 0; height: 0; border-top: 3px dashed rgba(255, 255, 255, .55); }
.finish { position: absolute; top: 9%; bottom: 9%; right: 70px; width: 14px; background: repeating-linear-gradient(#FFFFFF 0 14px, #2B2B2B 14px 28px); border: 2px solid #2B2B2B; }
.zongzi { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 60px; }
.boat { position: absolute; left: 10px; width: 170px; height: 70px; transition: left .5s ease-out; }
.boat svg { width: 100%; height: 100%; display: block; }
.boat .me { position: absolute; left: 50%; top: -20px; transform: translateX(-50%); font: 800 14px var(--f-latin); background: #FFF6D6; border: 2px solid #2B2B2B; border-radius: 8px; padding: 0 6px; white-space: nowrap; }
.boat.row svg { animation: row .5s; }
@keyframes row { 50% { transform: translateY(-5px) rotate(-2deg); } }
.panel { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 170px; }
.ask { display: flex; align-items: center; gap: 14px; }
.ask .big { font: 800 44px var(--f-latin); line-height: 1.1; text-align: center; }
.ask .ruby .py { font-size: 20px; } .ask .ruby .zh { font-size: 60px; font-weight: 800; }
.again { background: #FFF6D6; border: 2px solid #2B2B2B; border-radius: 12px; font-size: 26px; cursor: pointer; padding: 4px 12px; }
.opts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.opts button { min-width: 96px; font: 800 30px var(--f-latin); background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 14px; box-shadow: 0 4px 0 #2B2B2B; cursor: pointer; padding: 4px 14px; }
.opts button .ruby .py { font-size: 14px; } .opts button .ruby .zh { font-size: 30px; }
.opts button.oops, .typed.oops { animation: shake .35s; border-color: var(--bad); }
.typed { min-width: 220px; min-height: 56px; border: 3px solid #2B2B2B; border-radius: 12px; background: #FFFBF2; display: flex; align-items: center; justify-content: center; font: 800 34px 'Noto Sans SC', sans-serif; }
.keys { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.keys button { min-width: 50px; font: 700 24px 'Noto Sans SC', sans-serif; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 10px; box-shadow: 0 3px 0 #2B2B2B; cursor: pointer; padding: 2px 6px; }
.keys button .py { display: block; font: 400 11px var(--f-latin); color: #B4471C; }
.go { font: 800 18px var(--f-latin); background: var(--me); color: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 12px; padding: 4px 22px; cursor: pointer; }
.timer.low { background: #FCE3E0; border-color: var(--bad); }
.timeUp { text-align: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 18px; padding: 10px; margin: 0 auto 10px; max-width: 640px; font: 700 18px var(--f-latin); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.timeUp .ruby .py { font-size: 12px; } .timeUp .ruby .zh { font-size: 26px; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill timer" id="timer">0:00</span>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>
  <div class="timeUp" id="timeUp" hidden><span class="ruby" id="timeUpRuby"></span><span id="timeUpTxt"></span><button class="ctl" id="again2" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="box">
        <div class="river" id="river"></div>
        <div class="panel" id="panel"></div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/numbers.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.dragonboat, NUM = window.ShihNum;
  const $ = id => document.getElementById(id);
  const shuffle = NUM.shuffle, rnd = NUM.rnd;
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.rubyText(C.win.zh, C.win.py);
  $('timeUpRuby').innerHTML = Shih.ruby('时间到了', 'shí jiān dào le');
  Shih.soundButton($('soundBtn'));

  // ---- 河、三条龙舟、终点、粽子 ----
  const INK = '#2B2B2B';
  const BOAT = (c, head) => `<svg viewBox="0 0 170 70" aria-hidden="true">` +
    `<path d="M14 40 L150 40 Q146 60 124 62 L36 62 Q18 60 14 40 Z" fill="${c}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>` +
    `<path d="M30 48 L130 48" stroke="#F5C531" stroke-width="4" stroke-dasharray="8 6"/>` +
    // 龙头、龙尾
    `<path d="M146 42 Q150 20 162 14 Q170 18 164 28 L156 30 Q160 38 150 44 Z" fill="${head}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><circle cx="160" cy="20" r="2.5" fill="${INK}"/>` +
    `<path d="M16 42 Q6 30 10 18 Q20 26 22 40 Z" fill="${head}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>` +
    // 划船的人和桨
    [44, 72, 100, 126].map(x => `<path d="M${x} 46 L${x - 10} 66" stroke="#8A5A2B" stroke-width="4" stroke-linecap="round"/><circle cx="${x}" cy="28" r="7" fill="#F6D9B5" stroke="${INK}" stroke-width="3"/><path d="M${x - 7} 40 Q${x} 32 ${x + 7} 40" fill="${c}" stroke="${INK}" stroke-width="3"/>`).join('') +
    `<circle cx="86" cy="12" r="0" fill="none"/></svg>`;
  const ZONGZI = `<svg viewBox="0 0 60 70" aria-hidden="true"><path d="M30 6 L56 60 L4 60 Z" fill="#6DAA4F" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><path d="M8 44 L52 44" stroke="#F5E6B8" stroke-width="5"/><path d="M30 6 L22 60 M30 6 L40 60" stroke="#4E8A36" stroke-width="2.5"/></svg>`;
  const LANES = [{ y: 18, c: '#E5483B', h: '#F5C531' }, { y: 50, c: '#F5C531', h: '#E5483B', me: true }, { y: 82, c: '#45A852', h: '#F28C28' }];
  $('river').innerHTML = `<div class="lane" style="top:34%"></div><div class="lane" style="top:66%"></div><div class="finish"></div><div class="zongzi">${ZONGZI}</div>` +
    LANES.map((l, i) => `<div class="boat" id="boat${i}" style="top:calc(${l.y}% - 35px)">${BOAT(l.c, l.h)}${l.me ? `<span class="me">${Shih.ruby('我', 'wǒ')}</span>` : ''}</div>`).join('');
  const FIN = () => $('river').clientWidth - 70 - 170;          // 船头到终点线
  const place = (i, f) => { $('boat' + i).style.left = (10 + Math.min(1, f) * FIN()) + 'px'; };

  const timerEl = $('timer');
  const LIMIT = lv => C.time[lv - 1] * 1000, GOAL = () => C.target[level - 1];
  let left = 0, lastT = 0, tick = 0, running = false, speed = [0.97, 0.9];
  const fmt = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  function loop() {
    if (!running) return;
    const now = performance.now(); left -= now - lastT; lastT = now;
    timerEl.textContent = '⏱ ' + fmt(Math.max(0, left)); timerEl.classList.toggle('low', left < 15000);
    const f = 1 - left / LIMIT(level);                              // 别的龙舟：时间到的时候刚好划到终点
    $('boat0').style.transition = $('boat2').style.transition = 'none';
    place(0, f * speed[0] / 0.97); place(2, f * speed[1] / 0.97);
    if (left <= 0) { finish(); return; }
    tick = requestAnimationFrame(loop);
  }
  function finish() {
    running = false; cancelAnimationFrame(tick);
    if (done >= GOAL()) { $('winTime').textContent = 'Time left: ' + fmt(Math.max(0, left)); $('winMsg').hidden = false; Shih.speak(C.win.zh); }
    else { $('timeUpTxt').textContent = `You got ${done} of ${GOAL()}. Try again!`; $('timeUp').hidden = false; Shih.speak('时间到了'); }
  }

  const LEVELS = [{ note: 'one–ten → 中文' }, { note: '1–100: type 中文' }, { note: '百、千: type 中文' }];
  let level = Shih.startLevel('dragonLevel', 3);
  const paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('dragonLevel', lv); setup(); });
  const HELP = ['Read the number in English. Tap the right Chinese to row!',
                'Read the number in English. Type it in Chinese and press Submit to row!',
                'Big numbers! Type it in Chinese with 百 and 千 (2 = 两 before 百／千). Press Submit to row!'];
  const oops = el => { el.classList.remove('oops'); void el.offsetWidth; el.classList.add('oops'); setTimeout(() => el.classList.remove('oops'), 400); };
  let done = 0, q = null, busy = false, last = 0;
  // 英文的数字（one、forty-two、two thousand five hundred）
  const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  const en = n => n < 20 ? ONES[n] : n < 100 ? TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '') :
    n < 1000 ? ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + en(n % 100) : '') : en(Math.floor(n / 1000)) + ' thousand' + (n % 1000 ? ' ' + en(n % 1000) : '');
  // Level 3：用到百、千（中间没有零的数，例如 2500、1250、360）
  const bigNum = () => { const L = rnd(3, 4), k = rnd(1, L); let d = ''; for (let i = 0; i < L; i++) d += i < k ? rnd(1, 9) : 0; return +d; };
  function show() {
    busy = false;
    const [a, b] = C.range[level - 1];
    let n; do { n = level === 3 ? bigNum() : rnd(a, b); } while (n === last || !NUM.ok(n)); last = n;
    q = { n, typed: '' };
    const P = $('panel');
    if (level === 1) {
      P.innerHTML = `<div class="ask"><span class="big">${en(n)}</span></div><div class="opts" id="opts"></div>`;
      const opts = shuffle(NUM.options(n, shuffle([n - 1, n + 1, n + 2, n - 2, 11 - n]), a, b, 3));
      opts.forEach(x => { const btn = document.createElement('button'); btn.type = 'button'; btn.dataset.n = x; btn.innerHTML = `<span class="ruby">${Shih.ruby(NUM.zh(x), NUM.py(x))}</span>`; btn.addEventListener('click', () => answer(x, btn)); $('opts').appendChild(btn); });
    } else {
      // 用按键拼出中文：Level 2 一～十、百；Level 3 再加千、两
      const K = [['一', 'yī'], ['二', 'èr'], ['三', 'sān'], ['四', 'sì'], ['五', 'wǔ'], ['六', 'liù'], ['七', 'qī'], ['八', 'bā'], ['九', 'jiǔ'], ['十', 'shí'], ['百', 'bǎi']].concat(level === 3 ? [['千', 'qiān'], ['两', 'liǎng']] : []);
      P.innerHTML = `<div class="ask"><span class="big">${en(n)}</span></div><div class="typed" id="typed"></div>` +
        `<div class="keys" id="keys">${K.map(([k, p]) => `<button type="button" data-k="${k}">${k}<span class="py">${p}</span></button>`).join('')}<button type="button" data-k="⌫">⌫</button></div>` +
        `<button type="button" class="go" id="go">✓ Submit</button>`;
      $('keys').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        if (!running || busy) return;
        q.typed = b.dataset.k === '⌫' ? q.typed.slice(0, -1) : (q.typed + b.dataset.k).slice(0, 8);
        $('typed').textContent = q.typed;
      }));
      $('go').addEventListener('click', () => { if (!running || busy) return; if (q.typed === NUM.zh(n)) answer(n); else { oops($('typed')); } });
    }
    window.__db = { n, zh: NUM.zh(n), en: en(n), done };
  }
  function answer(x, btn) {
    if (!running || busy) return;
    if (x !== q.n) { oops(btn); return; }                            // 答错：摇一摇（不扣分）
    busy = true; done++; update();
    const b = $('boat1'); b.classList.remove('row'); void b.offsetWidth; b.classList.add('row');
    place(1, done / GOAL()); Shih.speak(NUM.zh(q.n));
    if (done >= GOAL()) { running = false; cancelAnimationFrame(tick); setTimeout(finish, 800); return; }   // 先到终点：赢了，给金币
    setTimeout(() => { if (running) show(); }, 700);
  }
  function setup() {
    paintLevels(level);
    $('help').textContent = HELP[level - 1] + ` Get ${GOAL()} right in ${fmt(LIMIT(level))} to win the race and get coins!`;
    done = 0; last = 0; speed = [0.94 + Math.random() * .05, 0.86 + Math.random() * .06];
    running = false; cancelAnimationFrame(tick); left = LIMIT(level); timerEl.textContent = '⏱ ' + fmt(left); timerEl.classList.remove('low');
    $('winMsg').hidden = true; $('timeUp').hidden = true; update();
    [0, 1, 2].forEach(i => { $('boat' + i).style.transition = 'none'; place(i, 0); });
    requestAnimationFrame(() => { $('boat1').style.transition = ''; });
    show(); wait();
  }
  function update() { $('score').textContent = `${done} / ${GOAL()}`; }
  const wait = Shih.startCover($('playArea'), () => { running = true; lastT = performance.now(); tick = requestAnimationFrame(loop); });
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  $('again2').addEventListener('click', setup);
  window.addEventListener('resize', () => place(1, done / GOAL()));
  setup();
});
</script>
</body>
</html>
