<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>点菜算一算 Order &amp; Add Up</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 点菜算一算：三个 Level 都是同一个画面——左边价目表、中间朋友点菜（对话框里是图）、下面点菜机、最后算一共多少钱
   Level 1：1 位朋友点 2 样；点菜机拉一张字卡（有拼音）；一共 10 块以内
   Level 2：2 位朋友各点 1–2 样；字卡没有拼音；一共 50 块以内
   Level 3：2 位朋友各点 1–2 样，有加料（鸡肉＋炒饭）；点菜机拉两张字卡；价目表有「加」；一共 99 块以内
   👀 看：对话框里是图；👂 听：对话框只有 🔊，朋友用说的（多一颗金币）
   Level 3 的主食、加料、价钱：units/restaurant/words.js 的 UNIT.combo
   选总数的时候只有中文（七块），要会读中文数字。块 kuài = measure word for money */
body.game { background: #FFF3E6; }
.payWrap { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 820px) { .payWrap { grid-template-columns: 1fr; } }
.bill { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 10px; padding: 10px 14px; box-shadow: 4px 6px 0 rgba(43,43,43,.15); position: relative;
  background-image: repeating-linear-gradient(#FFFFFF 0 33px, #EEF4F8 33px 34px); }
.bill .ttl { display: flex; align-items: flex-end; justify-content: center; gap: 8px; border-bottom: 3px dashed #2B2B2B; padding-bottom: 6px; margin-bottom: 4px; }
.bill .ttl .ruby .py { font-size: 12px; } .bill .ttl .ruby .zh { font-size: 26px; }
.bill .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.bill .row svg { width: 46px; height: 46px; flex: none; }
.bill .row .nm { flex: 1; display: flex; flex-wrap: wrap; align-items: flex-end; }
.bill .row .nm .ruby .py { font-size: 11px; } .bill .row .nm .ruby .zh { font-size: 22px; }
.bill .row .pr { font: 800 26px var(--f-latin); }
.bill .sum { border-top: 3px solid #2B2B2B; margin-top: 6px; padding-top: 6px; display: flex; align-items: center; justify-content: space-between; font: 800 24px var(--f-latin); }
.bill .sum .ruby .py { font-size: 11px; } .bill .sum .ruby .zh { font-size: 22px; }
.step { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.q { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 8px; }
.q .ruby .py { font-size: 14px; } .q .ruby .zh { font-size: clamp(24px, 3vw, 32px); }
.q .en { font: 600 15px var(--f-latin); color: var(--muted); flex-basis: 100%; }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.opt { font: 800 26px var(--f-latin); border: 3px solid #2B2B2B; border-radius: 16px; background: #FFFFFF; padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 0 #2B2B2B; }
.opt .ruby .py { font-size: 13px; } .opt .ruby .zh { font-size: 26px; }
.opt.shake { animation: shake .35s; border-color: var(--bad); }
.opt.right { background: var(--me-done); border-color: var(--me-ink); }
.wallet { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; background: #7A4A2A; border: 3px solid #2B2B2B; border-radius: 18px; padding: 12px; }
.money { width: 112px; height: 56px; border: 3px solid #2B2B2B; border-radius: 8px; background: #CFE8C4; display: flex; align-items: center; justify-content: center; font: 800 26px var(--f-latin); color: #2F5E2A; cursor: pointer; position: relative; }
.money::before { content: ''; position: absolute; inset: 6px; border: 2px solid #8CC7A0; border-radius: 4px; }
.money.out { visibility: hidden; }
.paid { min-height: 76px; border: 3px dashed #C98B4E; border-radius: 18px; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; align-items: center; justify-content: center; background: #FFFBEF; }
.paid.shake { animation: shake .35s; border-color: var(--bad); }
.paid .hint { font: 600 14px var(--f-latin); color: var(--muted); }
.payBtn { align-self: center; font: 700 18px var(--f-latin); border: 3px solid #2B2B2B; border-radius: 16px; background: #F5C531; padding: 6px 20px 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 0 #2B2B2B; }
.payBtn .ruby .py { font-size: 13px; } .payBtn .ruby .zh { font-size: 26px; }
.mwNote { text-align: center; }
/* ---- Level 2、3：两个朋友点菜 ---- */
.friendsWrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 820px) { .friendsWrap { grid-template-columns: 1fr; } }
.fmenu { background: #FFFBEF; border: 4px solid #2B2B2B; border-radius: 20px; padding: 8px 10px 10px; box-shadow: 0 5px 0 #C98B4E; }
.fmenu .ttl { text-align: center; border-bottom: 3px double #C98B4E; padding-bottom: 4px; margin-bottom: 6px; display: flex; justify-content: center; align-items: flex-end; gap: 8px; }
.fmenu .ttl .ruby .py { font-size: 12px; } .fmenu .ttl .ruby .zh { font-size: 26px; color: #B4471C; }
.fmenu .items { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fmenu .item { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 4px 6px; border-radius: 12px; }
.fmenu .item svg { width: 64px; height: 64px; flex: none; }
.bubble .ruby.noPy .py { visibility: hidden; }
.fmenu .item .nm { flex: 1; min-width: 0; }
.fmenu .item .nm .py { font-size: 10px; } .fmenu .item .nm .zh { font-size: 20px; font-weight: 700; }
.fmenu .item .pr { font: 800 18px var(--f-latin); color: #B4471C; }
.fmenu .item.used { visibility: visible; opacity: .35; }
.fmenu .item.lit { opacity: 1; border-color: #E9B949; background: #FFF6D6; }
.fmenu .item.lit .pr { background: #F5C531; border-radius: 8px; padding: 0 4px; color: #2B2B2B; }
.fmenu.summing .item:not(.lit) { opacity: .3; }
.table.one { grid-template-columns: minmax(0, 1fr); max-width: 520px; }
.table { background: #C98B4E; border: 4px solid #2B2B2B; border-radius: 26px; padding: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.friend { background: #FFF6E5; border: 3px solid #2B2B2B; border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.friend .top { display: flex; align-items: flex-start; gap: 6px; }
.friend .top svg { width: 82px; height: 82px; flex: none; }
.friend .nm { font: 700 14px var(--f-latin); text-align: center; }
.bubble > .ruby { display: flex; flex-wrap: wrap; row-gap: 4px; }
.bubble { position: relative; flex: 1; min-width: 0; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 16px; padding: 6px 8px; cursor: pointer; min-height: 60px; }
.bubble::before { content: ''; position: absolute; left: -12px; top: 18px; border: 6px solid transparent; border-right: 8px solid #2B2B2B; }
.bubble .ruby .py { font-size: 12px; } .bubble .ruby .zh { font-size: 22px; }
.bubble .en { display: block; font: 600 14px var(--f-latin); color: var(--muted); margin-top: 2px; }
.bubble .ear { font-size: 34px; line-height: 1; }
.plate { min-height: 96px; border: 3px dashed #8A5A2B; border-radius: 50%; background: radial-gradient(#FFFFFF 55%, #EFEFEF 56%); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px; padding: 8px 14px; cursor: pointer; }
.plate.hover, .plate.armed { border-style: solid; border-color: var(--pick); }
.plate.full { border-style: solid; border-color: var(--me-ink); }
.plate svg { width: 50px; height: 50px; }
.enBtn { align-self: center; }
/* ---- Level 3：价目表、点菜机 ---- */
.prices { background: #2F4A3A; color: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 20px; padding: 8px 12px 12px; box-shadow: 0 5px 0 #1E3227; }
.prices .ttl { text-align: center; border-bottom: 2px dashed #8CC7A0; padding-bottom: 4px; margin-bottom: 6px; display: flex; justify-content: center; align-items: flex-end; gap: 8px; }
.prices .ttl .ruby .py { font-size: 12px; color: #CDEBD6; } .prices .ttl .ruby .zh { font-size: 26px; color: #F5C531; }
.prices .ttl b { font: 700 15px var(--f-latin); color: #CDEBD6; }
.prices h4 { margin: 8px 0 4px; font: 700 14px var(--f-latin); color: #CDEBD6; display: flex; align-items: flex-end; gap: 6px; }
.prices h4 .ruby .py { font-size: 10px; color: #CDEBD6; } .prices h4 .ruby .zh { font-size: 18px; color: #FFFFFF; }
.prices .pr { display: flex; align-items: center; gap: 8px; padding: 2px 4px; border-radius: 10px; }
.prices .pr svg { width: 46px; height: 46px; flex: none; background: #FFFFFF; border-radius: 10px; }
.prices .pr .zh { flex: 1; font: 700 22px var(--f-zh); }
.prices .pr b { font: 800 22px var(--f-latin); color: #F5C531; }
.prices .pr.lit { background: rgba(245,197,49,.25); }
.bubble.pics { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; cursor: default; }
.bubble .dishPic { position: relative; width: 86px; height: 86px; }
.bubble .dishPic svg { width: 100%; height: 100%; }
.bubble .dishPic i, .posRow .num { position: absolute; left: -4px; top: -4px; width: 24px; height: 24px; border-radius: 50%; background: #2B2B2B; color: #FFFFFF; font: 800 14px/24px var(--f-latin); text-align: center; font-style: normal; }
.pos { margin-top: 12px; background: #DCE6EE; border: 4px solid #2B2B2B; border-radius: 20px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.pos .ttl { display: flex; align-items: flex-end; gap: 8px; font: 700 15px var(--f-latin); color: #3B5566; }
.pos .ttl .ruby .py { font-size: 11px; } .pos .ttl .ruby .zh { font-size: 22px; }
.posRows { background: #1F2D36; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.posRow { position: relative; display: flex; align-items: center; gap: 8px; padding-left: 26px; }
.posRow .num:empty { display: none; }
.posRow .num { left: 0; top: 50%; margin-top: -12px; background: #F5C531; color: #2B2B2B; }
.posRow .who { font: 700 14px var(--f-latin); color: #CDEBD6; width: 64px; }
.posRow .slot { min-width: 96px; min-height: 48px; border: 3px dashed #7FA3B8; border-radius: 12px; background: #2B3D49; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.posRow .slot.base { min-width: 128px; }
.posRow .slot.hover, .posRow .slot.armed { border-style: solid; border-color: #F5C531; }
.posRow .slot.filled { border-style: solid; border-color: #8CC7A0; background: #E9F6EE; cursor: default; }
.posRow .slot .zh { font: 700 24px var(--f-zh); color: #2B2B2B; }
.posRow .plus { color: #CDEBD6; font: 800 20px var(--f-latin); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tiles .wcard { padding: 4px 14px; }
.tiles .wcard .zh { font-size: 24px; font-weight: 700; }
.tiles .wcard.fill { background: #FFF6D6; }
.totalStep { grid-column: 1 / -1; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill" id="timer">0:00</span>
      <button class="ctl" id="timerBtn" type="button"></button>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="friendsWrap" id="friendsWrap">
        <div class="prices" id="fmenu"></div>
        <div>
          <div class="table" id="table"></div>
          <div class="pos" id="pos"></div>
        </div>
        <div class="totalStep" id="totalStep" hidden></div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/numbers.js"></script>
<script src="../shared/kids.js"></script>
<script src="../units/restaurant/art.js"></script>
<script src="../shared/rest.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.pay, RART = window.RART, N = window.ShihNum, KIDS = window.ART, CB = UNIT.combo;
  const $ = id => document.getElementById(id);
  const { take, shuffle } = Rest;
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const W = Shih.wordMap(UNIT);
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  const timerEl = $('timer'), timer = Shih.timer(timerEl);
  const timerOn = Shih.toggle($('timerBtn'), 'timer', '⏱ Timer on', '⏱ Timer off', true, on => { timerEl.hidden = !on; });
  Shih.soundButton($('soundBtn'));
  let level = Shih.startLevel('payLevel', 3);
  const LEVELS = [{ note: '1 friend · pinyin · up to $10' }, { note: '2 friends · up to $50' }, { note: '2 friends · add meat or veggies' }];
  const mode = Rest.modeRow(() => { buildLevels(); setup(); });
  let paintLevels = () => {};
  function buildLevels() { paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('payLevel', lv); buildLevels(); setup(); }); }
  buildLevels();
  const listen = () => mode() === 'listen';

  // ---- 钱：几块（2 念「两」） ----
  const kuaiParts = n => (n === 2 ? [['两', 'liǎng']] : N.parts(n)).concat([['块', 'kuài']]);
  const kuai = n => { const p = kuaiParts(n); return { zh: p.map(x => x[0]).join(''), py: p.map(x => x[1]).join(' ') }; };
  const rb = (zh, py) => `<span class="ruby">${Shih.ruby(zh, py)}</span>`;
  const NOTE = '<span class="mwNote">块 kuài = measure word for money ($)</span>';
  function near(right, max) {
    const out = new Set([right]);
    for (const d of shuffle([-1, 1, -2, 2, 10, -10, 5, -5])) { if (out.size === 3) break; const v = right + d; if (v >= 1 && v <= max) out.add(v); }
    for (let v = 1; out.size < 3; v++) out.add(v);
    return shuffle([...out]);
  }
  const optsHTML = right => `<div class="opts">${near(right, 99).map(v => { const k = kuai(v); return `<button type="button" class="opt" data-v="${v}">${rb(k.zh, k.py)}</button>`; }).join('')}</div>`;
  const shake = b => { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); };

  // ---- 一道菜：{ base: '炒饭', fill: '鸡肉'（Level 3 才有） } ----
  const nameOf = d => (d.fill || '') + d.base;
  const pyOf = d => [d.fill && (CB.fill.find(f => f.zh === d.fill) || {}).py, (W[d.base] || {}).py].filter(Boolean).join(' ');
  const picOf = d => d.fill ? RART.combo(d.fill, d.base) : RART.svg(d.base);
  const sip = d => !d.fill && W[d.base] && (W[d.base].drink || /汤$/.test(d.base));   // 饮料、汤 → 喝
  function sayOrder(ds) {
    const eat = ds.filter(d => !sip(d)), drink = ds.filter(sip), out = [];
    const L = a => a.length === 1 ? nameOf(a[0]) : a.slice(0, -1).map(nameOf).join('、') + '和' + nameOf(a[a.length - 1]);
    if (eat.length) out.push('我想吃' + L(eat));
    if (drink.length) out.push('我想喝' + L(drink));
    return out.join('，') + '。';
  }

  // ---- 出一题 ----
  let PRICE = {};
  function makeRound(prevPeople) {
    const nf = level === 1 ? 1 : 2;
    for (let g = 0; g < 400; g++) {
      let menu, price = {}, dishes;
      if (level === 3) {
        CB.base.forEach(b => price[b.zh] = rnd(b.price[0], b.price[1]));
        CB.fill.forEach(f => price[f.zh] = rnd(f.add[0], f.add[1]));
        const all = shuffle(CB.base.flatMap(b => CB.fill.filter(f => !b.with || b.with.includes(f.zh)).map(f => ({ fill: f.zh, base: b.zh }))));
        const na = rnd(1, 2), nb = Math.max(rnd(1, 2), 3 - na);
        dishes = [all.slice(0, na), all.slice(na, na + nb)];
        menu = null;
      } else {
        const foods = UNIT.pool(level, 'food'), drinks = UNIT.pool(level, 'drink');
        menu = shuffle(take(foods, level === 1 ? 4 : 6).concat(take(drinks, 2)));
        menu.forEach(w => price[w.zh] = w.drink ? rnd(1, level === 1 ? 3 : 4) : level === 1 ? rnd(2, 6) : rnd(3, 12));
        const pick = shuffle(menu);
        if (level === 1) {   // 1 位朋友：一样吃的、一样喝的（或两样吃的）
          const f = pick.find(w => !w.drink), d = Math.random() < 0.7 ? pick.find(w => w.drink) : pick.find(w => !w.drink && w !== f);
          dishes = [[f, d].map(w => ({ base: w.zh }))];
        } else {
          const na = rnd(1, 2), nb = rnd(1, 2);
          dishes = [pick.slice(0, na), pick.slice(na, na + nb)].map(a => a.map(w => ({ base: w.zh })));
        }
      }
      const total = dishes.flat().reduce((t, d) => t + price[d.base] + (d.fill ? price[d.fill] : 0), 0);
      const cap = [10, 50, 99][level - 1];
      if (total > cap || total < 3) continue;
      const people = shuffle(KIDS.people.filter(p => !prevPeople || !prevPeople.includes(p))).slice(0, nf);
      return { menu, price, friends: people.map((p, i) => ({ p, want: dishes[i] })), total };
    }
  }

  // ---- 画面 ----
  let rounds = [], ri = 0, done = 0, busy = false, playing = false;
  function priceBoard(r) {
    const row = (zh, pic, money) => `<div class="pr" data-zh="${zh}">${pic}<span class="zh">${zh}</span><b>${money}</b></div>`;
    if (level === 3) return `<div class="ttl">${rb('价目表', 'jià mù biǎo')}<b>Prices</b></div>` +
      `<h4>${rb('主食', 'zhǔ shí')} Food</h4>` + CB.base.map(b => row(b.zh, RART.svg(b.zh), '$' + r.price[b.zh])).join('') +
      `<h4>${rb('加', 'jiā')} Add</h4>` + CB.fill.map(f => row(f.zh, RART.badgeSvg(f.zh), '+$' + r.price[f.zh])).join('');
    return `<div class="ttl">${rb('价目表', 'jià mù biǎo')}<b>Prices</b></div>` + r.menu.map(w => row(w.zh, RART.svg(w.zh), '$' + r.price[w.zh])).join('');
  }
  function speakFriends() { const r = rounds[ri]; Rest.speak(r.friends.map(f => sayOrder(f.want)).join('')); }
  function show() {
    const r = rounds[ri];
    busy = false;
    $('totalStep').hidden = true; $('totalStep').innerHTML = '';
    $('fmenu').innerHTML = priceBoard(r);
    let no = 0;
    const rows = [];
    $('table').className = 'table' + (r.friends.length === 1 ? ' one' : '');
    $('table').innerHTML = r.friends.map((f, i) => {
      const body = listen() ? `<span class="ear" aria-label="Listen">🔊</span>`
        : f.want.map(d => { no++; return `<span class="dishPic">${picOf(d)}<i>${no}</i></span>`; }).join('');
      if (listen()) f.want.forEach(() => no++);
      f.want.forEach((d, k) => rows.push({ i, d, no: no - f.want.length + k + 1 }));
      return `<div class="friend"><div class="top"><div>${KIDS.kid(f.p, 'hungry')}<div class="nm">${Shih.esc(f.p.first)}</div></div>` +
        `<div class="bubble pics" data-i="${i}">${body}</div></div></div>`;
    }).join('');
    $('table').querySelectorAll('.bubble').forEach(b => b.addEventListener('click', () => { if (listen()) Rest.speak(sayOrder(r.friends[+b.dataset.i].want)); }));
    // 点菜机
    const slot = (need, cls) => `<span class="slot ${cls} dropSlot" data-need="${need}"></span>`;
    $('pos').innerHTML = `<div class="ttl">${rb('点菜机', 'diǎn cài jī')} Order machine — drag the words in</div>` +
      `<div class="posRows">${rows.map(x => `<div class="posRow"><span class="num">${listen() ? '' : x.no}</span><span class="who">${Shih.esc(r.friends[x.i].p.first)}</span>` +
        (x.d.fill ? slot(x.d.fill, 'fillS') + `<span class="plus">+</span>` : '') + slot(x.d.base, 'base') + `</div>`).join('')}</div>` +
      `<div class="tiles" id="tiles"></div>`;
    const tileWords = level === 3 ? CB.fill.map(f => ({ zh: f.zh, py: f.py, fill: true })).concat(CB.base.map(b => ({ zh: b.zh, py: (W[b.zh] || {}).py })))
      : shuffle(r.menu.map(w => ({ zh: w.zh, py: w.py })));
    $('tiles').innerHTML = tileWords.map(t => `<div class="wcard${t.fill ? ' fill' : ''}" data-zh="${t.zh}">${level === 1 ? `<span class="ruby">${Shih.ruby(t.zh, t.py)}</span>` : `<span class="zh">${t.zh}</span>`}</div>`).join('');
    // 听的时候：同一个朋友的菜，顺序不限；看的时候：照编号
    const need = $('pos').querySelectorAll('.slot').length;
    let filled = 0;
    const cards = [...$('tiles').querySelectorAll('.wcard')];
    const dnd = Shih.dragCards(cards, {
      slots: () => [...$('pos').querySelectorAll('.slot:not(.filled)')],
      accept(card, sl) {
        if (!playing || busy) return true;
        let target = sl;
        if (card.dataset.zh !== sl.dataset.need) {
          // 听的时候顺序不一定：同一个人、同一种格子，有别格要这张就放那格
          if (!listen()) return false;
          const row = sl.closest('.posRow'), who = row.querySelector('.who').textContent, kind = sl.classList.contains('base') ? '.base' : '.fillS';
          target = [...$('pos').querySelectorAll('.posRow')].filter(rw => rw.querySelector('.who').textContent === who)
            .map(rw => rw.querySelector(kind)).find(x => x && !x.classList.contains('filled') && x.dataset.need === card.dataset.zh);
          if (!target) return false;
        }
        target.classList.add('filled'); target.innerHTML = `<span class="zh">${card.dataset.zh}</span>`;
        Shih.speak(card.dataset.zh);
        if (++filled >= need) setTimeout(totalStep, 600);
        return true;
      }
    });
    $('pos').querySelectorAll('.slot').forEach(sl => sl.addEventListener('click', () => { if (!sl.classList.contains('filled')) dnd.tapSlot(sl); }));
    if (playing && listen()) speakFriends();
  }
  function totalStep() {
    const r = rounds[ri];
    const used = new Set(r.friends.flatMap(f => f.want.flatMap(d => [d.fill, d.base].filter(Boolean))));
    $('fmenu').querySelectorAll('.pr').forEach(el => el.classList.toggle('lit', used.has(el.dataset.zh)));
    if (listen()) $('table').querySelectorAll('.bubble').forEach((b, i) => { b.innerHTML = r.friends[i].want.map(d => `<span class="dishPic">${picOf(d)}</span>`).join(''); });
    $('totalStep').hidden = false;
    $('totalStep').innerHTML = `<div class="q">${rb('一共多少钱？', 'yí gòng duō shǎo qián')}<span class="en">${ri + 1} / ${rounds.length} · ${level === 3 ? 'Food price + extra for each dish. ' : ''}How much is it in all?</span></div>` + optsHTML(r.total) + NOTE;
    $('totalStep').querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      if (busy) return;
      if (+b.dataset.v !== r.total) { shake(b); return; }
      b.classList.add('right'); Shih.speak('一共' + kuai(r.total).zh); finishRound();
    }));
    Shih.speak('一共多少钱？');
    $('totalStep').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function finishRound() {
    busy = true; done++; update();
    setTimeout(() => {
      ri++;
      if (ri >= rounds.length) {
        const ms = timer.stop();
        $('winTime').textContent = timerOn() ? 'Time: ' + Shih.fmt(ms) : '';
        $('winMsg').hidden = false; Shih.speak('太棒了');
      } else show();
    }, 1300);
  }
  function update() { $('score').textContent = `${done} / ${rounds.length}`; }
  const wait = Shih.startCover($('playArea'), () => { playing = true; if (timerOn()) timer.start(); if (listen()) speakFriends(); });
  function setup() {
    paintLevels(level); playing = false;
    $('help').textContent = (listen() ? 'Tap 🔊 to hear what each friend wants. ' : 'Look at what each friend wants. ') +
      (level === 3 ? 'Type each order into the machine (meat + food). ' : 'Drag the right word into the order machine. ') + 'Then add up the prices.';
    rounds = [];
    for (let i = 0; i < (C.rounds || 4); i++) { const prev = rounds[rounds.length - 1]; rounds.push(makeRound(prev && prev.friends.map(f => f.p))); }
    ri = 0; done = 0;
    timer.reset(); $('winMsg').hidden = true; update();
    show();
    window.__pay = { round: () => rounds[ri], level: () => level, mode };
    wait();
  }
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
