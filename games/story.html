<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>四格故事 Story Panels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 四格故事：先把四格图排好顺序，再把台词拖进对话泡泡。用法：story.html?unit=moon */
body.game { background: #FFF6D6; }
.step { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; color: #8A5A2B; background: #FFF; border: 2px solid #E9B949; border-radius: 999px; padding: 4px 14px; margin-bottom: 10px; }
.step b { background: #F5C531; border: 2px solid var(--ink); border-radius: 999px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; }

/* 第一步：排顺序 */
.order { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.slots .dropSlot { position: relative; width: 100%; aspect-ratio: 320 / 220; min-width: 0; min-height: 0; padding: 0; border-color: #E9B949; background: #FFFDF4; border-radius: 16px; overflow: hidden; }
.slots .dropSlot.filled { border-color: var(--me); background: #fff; }
.slots .num { position: absolute; left: 8px; top: 6px; z-index: 2; background: #F5C531; border: 2px solid var(--ink); border-radius: 999px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font: 700 18px var(--f-latin); }
.slots .dropSlot:not(.filled) .num { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 48px; height: 48px; font-size: 26px; background: #FFF1C4; }
.slots svg, .pcard svg { width: 100%; height: auto; display: block; }
.order .bank { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.pcard.wcard { padding: 4px; min-width: 0; min-height: 0; border-radius: 16px; }
@media (max-width: 760px) { .slots, .order .bank { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* 第二步：填台词 */
.wrap { max-width: 1150px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 14px; align-items: start; }
.wrap .bank { position: sticky; top: 10px; flex-direction: column; align-items: stretch; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } .wrap .bank { position: static; flex-direction: row; } }
.story { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 600px) { .story { grid-template-columns: 1fr; } }
.cell { background: var(--card); border: 3px solid var(--ink); border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.cell .pic { position: relative; }
.cell .pic .num { position: absolute; left: 8px; top: 6px; background: #F5C531; border: 2px solid var(--ink); border-radius: 999px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font: 700 17px var(--f-latin); }
.cell .pic svg { width: 100%; height: auto; display: block; }
.line { display: flex; align-items: center; gap: 6px; }
.line .who { display: flex; flex: none; }
.line .who svg { width: 58px; height: 72px; }
.line .say { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.line .en { font-size: 14px; color: var(--muted); padding-left: 8px; min-height: 18px; }
.line .dropSlot { width: 100%; min-height: 64px; border-color: #E9B949; background: #FFFDF4; border-radius: 18px; position: relative; }
.line .dropSlot::before { content: ''; position: absolute; left: -11px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right: 10px solid #E9B949; border-left: 0; }
.line .dropSlot.filled { border-color: var(--me); background: var(--me-done); }
.line .dropSlot.filled::before { border-right-color: var(--me); }
.wrap .bank .wcard .zh { font-size: 24px; } .wrap .bank .wcard .py { font-size: 13px; }
.line .dropSlot .zh { font-size: 24px; } .line .dropSlot .py { font-size: 13px; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill" id="timer">0:00</span>
      <button class="ctl" id="timerBtn" type="button"></button>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="step" id="step"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner" id="inner"></div>
  </div>

<script src="../shared/common.js"></script>
<script>
Shih.islandBar();
Promise.all([Shih.loadUnit(), Shih.loadArt()]).then(([UNIT, ART]) => {
  const S = UNIT.story;
  document.title = `${S.title.zh} ${S.title.en}`;
  document.getElementById('titleRuby').innerHTML = Shih.ruby(S.title.zh, S.title.py);
  document.getElementById('titleEn').textContent = S.title.en;
  document.getElementById('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  const inner = document.getElementById('inner'), stepEl = document.getElementById('step'), help = document.getElementById('help');
  const scoreEl = document.getElementById('score'), winMsg = document.getElementById('winMsg'), winTime = document.getElementById('winTime');
  const timerEl = document.getElementById('timer'), timer = Shih.timer(timerEl);
  const timerOn = Shih.toggle(document.getElementById('timerBtn'), 'timer', '⏱ Timer on', '⏱ Timer off', true, on => { timerEl.hidden = !on; });
  Shih.soundButton(document.getElementById('soundBtn'));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const N = S.panels.length;
  const LINES = S.panels.flatMap((p, k) => p.lines.map(L => Object.assign({ panel: k }, L)));
  let done = 0, total = N + LINES.length;
  const update = () => { scoreEl.textContent = `${done} / ${total}`; };

  // ---- 第一步：把四格图排好顺序 ----
  function stepOrder() {
    stepEl.innerHTML = '<b>1</b> Put the story in order';
    help.textContent = 'Drag each picture into the right box, 1 to 4. You can also tap a picture, then tap a box.';
    inner.innerHTML = `<div class="order"><div class="slots" id="slots">` +
      S.panels.map((_, k) => `<div class="dropSlot" data-n="${k + 1}"><span class="num">${k + 1}</span></div>`).join('') +
      `</div><div class="bank" id="bank"></div></div>`;
    const bank = document.getElementById('bank'), slots = document.getElementById('slots');
    let order = shuffle(S.panels.map((_, k) => k + 1));
    while (order.every((n, i) => n === i + 1)) order = shuffle(order);   // never already in order
    const cards = order.map(n => {
      const el = document.createElement('div');
      el.className = 'wcard pcard'; el.dataset.n = n;
      el.innerHTML = ART.panel(n);
      bank.appendChild(el);
      return el;
    });
    const dnd = Shih.dragCards(cards, {
      slots: () => [...slots.querySelectorAll('.dropSlot:not(.filled)')],
      accept(card, slot) {
        if (card.dataset.n !== slot.dataset.n) return false;
        card.classList.add('used');
        slot.classList.add('filled');
        slot.insertAdjacentHTML('beforeend', ART.panel(+slot.dataset.n));
        done++; update();
        if (!slots.querySelector('.dropSlot:not(.filled)')) setTimeout(stepLines, 1000);
        return true;
      }
    });
    slots.querySelectorAll('.dropSlot').forEach(s => s.addEventListener('click', () => dnd.tapSlot(s)));
  }

  // ---- 第二步：把台词拖进对话泡泡 ----
  function stepLines() {
    stepEl.innerHTML = '<b>2</b> Who says what?';
    help.textContent = 'Drag the words into the empty bubbles. You can also tap a card, then tap a bubble.';
    inner.innerHTML = `<div class="wrap"><div class="story" id="story">` +
      S.panels.map((p, k) => `<div class="cell"><div class="pic"><span class="num">${k + 1}</span>${ART.panel(k + 1)}</div>` +
        LINES.map((L, i) => L.panel !== k ? '' : `<div class="line"><span class="who">${L.who.map(w => ART.who(w)).join('')}</span>` +
          `<span class="say"><span class="dropSlot" data-i="${i}"></span><span class="en" data-en="${i}"></span></span></div>`).join('') +
        `</div>`).join('') +
      `</div><div class="bank" id="bank"></div></div>`;
    const bank = document.getElementById('bank'), story = document.getElementById('story');
    const cards = shuffle(LINES.concat(S.wrong || [])).map(t => {
      const el = document.createElement('div');
      el.className = 'wcard'; el.dataset.zh = t.zh;
      el.innerHTML = `<span class="ruby">${Shih.rubyText(t.zh, t.py)}</span>`;
      bank.appendChild(el);
      return el;
    });
    const dnd = Shih.dragCards(cards, {
      slots: () => [...story.querySelectorAll('.dropSlot:not(.filled)')],
      accept(card, slot) {
        const i = +slot.dataset.i, L = LINES[i];
        if (card.dataset.zh !== L.zh) return false;
        card.classList.add('used');
        slot.classList.add('filled');
        slot.innerHTML = `<span class="ruby">${Shih.rubyText(L.zh, L.py)}</span>`;
        story.querySelector(`[data-en="${i}"]`).textContent = L.en;
        Shih.speak(L.zh);
        done++; update();
        if (!story.querySelector('.dropSlot:not(.filled)')) {
          const ms = timer.stop();
          winTime.textContent = timerOn() ? 'Time: ' + Shih.fmt(ms) : '';
          setTimeout(() => { winMsg.hidden = false; winMsg.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 700);
        }
        return true;
      }
    });
    story.querySelectorAll('.dropSlot').forEach(s => s.addEventListener('click', () => dnd.tapSlot(s)));
  }

  const wait = Shih.startCover(document.getElementById('playArea'), () => { if (timerOn()) timer.start(); });
  function setup() {
    done = 0; timer.reset(); winMsg.hidden = true; update();
    stepOrder();
    wait();
  }
  document.getElementById('resetBtn').addEventListener('click', setup);
  document.getElementById('againBtn').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
