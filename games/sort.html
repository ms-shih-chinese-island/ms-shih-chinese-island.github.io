<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>快手分信</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 快手分信：信从上面掉下来，点牌子颜色对的邮筒（邮筒都是蓝色的，只看牌子上的字）。
   装了信的邮筒会被收走，换一个新颜色的邮筒。掉到底的信不见了，再来下一封（不扣分，只是浪费时间）。点错了邮筒摇一摇。
   时间内分完就有金币。设定在 units/community/words.js 的 UNIT.sort */
body.game { background: #E6F4F8; }
.stage { position: relative; max-width: 900px; margin: 0 auto; height: min(560px, calc(100vh - 230px)); min-height: 420px; background: linear-gradient(#DDEFF8 0 72%, #C8D7E0 72%); border: 4px solid #2B2B2B; border-radius: 22px; overflow: hidden; }
.drop { position: absolute; width: 96px; height: 64px; border: 3px solid #2B2B2B; border-radius: 7px; box-sizing: border-box; left: 50%; margin-left: -48px; z-index: 3; }
.drop::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 58%; background: linear-gradient(to top right, transparent calc(50% - 1.5px), #2B2B2B calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)) left / 50% 100% no-repeat, linear-gradient(to top left, transparent calc(50% - 1.5px), #2B2B2B calc(50% - 1.5px) calc(50% + 1.5px), transparent calc(50% + 1.5px)) right / 50% 100% no-repeat; opacity: .7; }
.drop.fly { transition: left .35s ease-in, top .35s ease-in, transform .35s; transform: scale(.4); }
.drop.lost { transition: opacity .3s; opacity: 0; }
.boxes { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: space-around; padding: 0 10px; }
.mbox { width: 120px; cursor: pointer; background: none; border: none; padding: 0; display: flex; flex-direction: column; align-items: center; }
.mbox .tag { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 10px; padding: 2px 10px; margin-bottom: -6px; position: relative; z-index: 2; min-width: 70px; }
.mbox .tag .ruby .py { font-size: 12px; } .mbox .tag .ruby .zh, .mbox .tag .w { font-size: 24px; font-weight: 700; }
.mbox svg { width: 110px; height: auto; display: block; }
.mbox.oops { animation: shake .35s; }
.mbox.swap { animation: swapIn .45s ease-out; }
@keyframes swapIn { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.mbox.oops .tag { border-color: var(--bad); }
.mbox:hover .tag { background: #FFF6D6; }
.count { position: absolute; left: 12px; top: 10px; font: 700 18px var(--f-latin); background: #FFFFFF; border: 2px solid #2B2B2B; border-radius: 999px; padding: 2px 12px; z-index: 4; }
.timer.low { background: #FCE3E0; border-color: var(--bad); }
.timeUp { text-align: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 18px; padding: 10px; margin: 0 auto 10px; max-width: 640px; font: 700 18px var(--f-latin); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.timeUp .ruby .py { font-size: 12px; } .timeUp .ruby .zh { font-size: 26px; }
@media (max-width: 640px) { .mbox { width: 80px; } .mbox svg { width: 74px; } .mbox .tag .ruby .zh, .mbox .tag .w { font-size: 18px; } }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill timer" id="timer">0:00</span>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>
  <div class="timeUp" id="timeUp" hidden><span class="ruby" id="timeUpRuby"></span><span id="timeUpTxt"></span><button class="ctl" id="again2" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="stage" id="stage">
        <div class="boxes" id="boxes"></div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.sort, COLORS = UNIT.post.colors;
  const $ = id => document.getElementById(id);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  $('timeUpRuby').innerHTML = Shih.ruby('时间到了', 'shí jiān dào le');
  Shih.soundButton($('soundBtn'));

  const timerEl = $('timer');
  const LIMIT = lv => C.time[lv - 1] * 1000;
  let left = 0, lastT = 0, tick = 0, running = false;
  const fmt = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

  const LEVELS = [{ note: '3 mailboxes + pinyin' }, { note: '4 mailboxes + pinyin' }, { note: '5 mailboxes + pinyin' }];
  let level = Shih.startLevel('sortLevel', 3);
  const paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('sortLevel', lv); setup(); });
  const oops = el => { el.classList.remove('oops'); void el.offsetWidth; el.classList.add('oops'); setTimeout(() => el.classList.remove('oops'), 400); };
  // 美国的蓝色邮筒
  const mailbox = `<svg viewBox="0 0 110 120"><path d="M20 112 L20 52 Q20 18 55 18 Q90 18 90 52 L90 112 Z" fill="#3B78D8" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round"/>` +
    `<rect x="30" y="48" width="50" height="10" rx="5" fill="#1F4580" stroke="#2B2B2B" stroke-width="3"/>` +
    `<path d="M20 70 L90 70" stroke="#2B5FB0" stroke-width="3"/><rect x="14" y="108" width="20" height="10" fill="#2B2B2B"/><rect x="76" y="108" width="20" height="10" fill="#2B2B2B"/></svg>`;

  let boxes = [], sorted = 0, goal = 0, drop = null, busy = false;
  function newDrop() {
    if (!running) return;
    const c = boxes[Math.floor(Math.random() * boxes.length)].c;
    const el = document.createElement('div');
    el.className = 'drop'; el.style.background = c.hex; el.style.top = '-70px';
    el.style.left = (20 + Math.random() * 60) + '%';
    $('stage').appendChild(el);
    drop = { el, c, y: -70, t0: performance.now() };
    window.__sort = { c: c.zh, sorted };
  }
  function loop() {
    if (!running) return;
    const now = performance.now(), dt = now - lastT; left -= dt; lastT = now;
    timerEl.textContent = '⏱ ' + fmt(Math.max(0, left)); timerEl.classList.toggle('low', left < 15000);
    if (left <= 0) { running = false; if (drop) drop.el.remove(); $('timeUpTxt').textContent = `Time's up! You sorted ${sorted} of ${goal}. Try again!`; $('timeUp').hidden = false; Shih.speak('时间到了'); return; }
    if (drop && !busy) {
      const H = $('stage').clientHeight - 150;   // 掉到邮筒上面就算掉到底
      drop.y += dt * (H + 70) / (C.fall[level - 1] * 1000);
      drop.el.style.top = drop.y + 'px';
      if (drop.y >= H) { const d = drop; drop = null; d.el.classList.add('lost'); setTimeout(() => d.el.remove(), 300); setTimeout(newDrop, 350); }
    }
    tick = requestAnimationFrame(loop);
  }
  function tapBox(b) {
    if (!running || !drop || busy) return;
    if (b.c !== drop.c) { oops(b.el); return; }
    busy = true;
    const d = drop, r = b.el.getBoundingClientRect(), s = $('stage').getBoundingClientRect();
    d.el.classList.add('fly');
    d.el.style.left = (r.left - s.left + r.width / 2) + 'px'; d.el.style.top = (r.top - s.top + 40) + 'px';
    Shih.speak(b.c.zh);
    setTimeout(() => {
      d.el.remove(); drop = null; busy = false;
      sorted++; update();
      swapBox(b);
      if (sorted >= goal) {
        running = false; cancelAnimationFrame(tick);
        $('winTime').textContent = 'Time left: ' + fmt(Math.max(0, left));
        setTimeout(() => { $('winMsg').hidden = false; Shih.speak('太棒了'); }, 300);
      } else newDrop();
    }, 380);
  }
  // 装了信的邮筒收走，换一个新颜色（画面上没有的颜色）
  function swapBox(b) {
    const free = COLORS.filter(c => !boxes.some(x => x.c === c));
    if (!free.length) return;
    b.c = free[Math.floor(Math.random() * free.length)];
    b.el.dataset.c = b.c.zh;
    b.el.querySelector('.tag').innerHTML = `<span class="ruby">${Shih.ruby(b.c.zh, b.c.py)}</span>`;
    b.el.classList.remove('swap'); void b.el.offsetWidth; b.el.classList.add('swap');
  }
  function setup() {
    paintLevels(level);
    goal = C.target[level - 1]; sorted = 0; busy = false;
    $('help').textContent = `Tap the mailbox whose sign matches the letter's color, before it hits the bottom! Sort ${goal} letters in ${fmt(LIMIT(level))} to get coins!`;
    $('stage').querySelectorAll('.drop').forEach(e => e.remove()); drop = null;
    const cs = shuffle(COLORS).slice(0, C.boxes[level - 1]);
    $('boxes').innerHTML = '';
    boxes = cs.map(c => {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'mbox'; el.dataset.c = c.zh;
      el.innerHTML = `<span class="tag"><span class="ruby">${Shih.ruby(c.zh, c.py)}</span></span>${mailbox}`;   // 三级都有拼音
      const b = { el, c };
      el.addEventListener('click', () => tapBox(b));
      $('boxes').appendChild(el);
      return b;
    });
    running = false; cancelAnimationFrame(tick); left = LIMIT(level); timerEl.textContent = '⏱ ' + fmt(left); timerEl.classList.remove('low');
    $('winMsg').hidden = true; $('timeUp').hidden = true; update();
    wait();
  }
  function update() { $('score').textContent = `${sorted} / ${goal}`; }
  const wait = Shih.startCover($('playArea'), () => { running = true; lastT = performance.now(); tick = requestAnimationFrame(loop); newDrop(); });
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  $('again2').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
