<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>能去海滩吗？</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 能去海滩吗？（海滩）：收音机播天气预报（只有声音），学生选对的天气。
   Level 1 早上、下午的天气；Level 2 再加温度；Level 3 再决定去不去海滩。
   答对 target 题就马上结束、给金币。点错了摇一摇（不算错）。设定在 units/beach/words.js 的 UNIT.forecast */
body.game { background: #FBEFD5; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.radio { width: 200px; }
.radio svg { width: 100%; display: block; }
.play { font: 800 22px var(--f-latin); background: #FFF6D6; border: 3px solid #2B2B2B; border-radius: 16px; padding: 8px 18px; cursor: pointer; }
.play:hover { background: #FFE9A8; }
.kid { width: 130px; }
.kid svg { width: 130px; height: 130px; display: block; }
.tip { width: 100%; box-sizing: border-box; text-align: center; background: #FFF6D6; border: 2px solid #E9B949; border-radius: 14px; padding: 4px 12px; font: 600 15px var(--f-latin); display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
.tip > span { display: inline-flex; align-items: flex-end; gap: 6px; }
.tip .ruby .py { font-size: 11px; } .tip .ruby .zh { font-size: 20px; }
.tip[hidden] { display: none; }
.main { display: flex; flex-direction: column; gap: 12px; }
.step { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 20px; padding: 12px; }
.step[hidden] { display: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.half.done { background: #F1FAEC; }
.ti { width: 44px; height: 30px; }
.step .q { text-align: center; font: 700 17px var(--f-latin); margin-bottom: 8px; display: flex; justify-content: center; align-items: flex-end; gap: 8px; }
.step .q .ruby .py { font-size: 11px; } .step .q .ruby .zh { font-size: 20px; }
.skies { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 700px) { .two { grid-template-columns: 1fr; } }
.sk { position: relative; border: 3px solid #2B2B2B; border-radius: 16px; overflow: hidden; padding: 0; cursor: pointer; background: #FFFFFF; }
.sk svg { width: 100%; display: block; aspect-ratio: 200 / 140; }
.sk .when { position: absolute; left: 6px; top: 6px; background: #F5C531; border: 2px solid #2B2B2B; border-radius: 10px; padding: 0 6px; }
.sk .when .ruby .py { font-size: 10px; } .sk .when .ruby .zh { font-size: 17px; }
.step .q .en { font: 600 14px var(--f-latin); color: #555; padding-bottom: 3px; }
.sk.oops, .opt.oops { animation: shake .35s; border-color: var(--bad); }
.sk.ok, .opt.ok { outline: 5px solid var(--me); outline-offset: 1px; }
.opts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.opt { font: 800 30px var(--f-latin); background: #FFF6D6; border: 3px solid #2B2B2B; border-radius: 16px; padding: 6px 20px; cursor: pointer; display: inline-flex; flex-direction: column; align-items: center; }
.opt:hover { background: #FFE9A8; }
.opt .ruby .py { font-size: 13px; } .opt .ruby .zh { font-size: 28px; }
.opt .en { font: 600 13px var(--f-latin); color: #555; }
.timer.low { background: #FCE3E0; border-color: var(--bad); }
.timeUp { text-align: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 18px; padding: 10px; margin: 0 auto 10px; max-width: 640px; font: 700 18px var(--f-latin); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.timeUp .ruby .py { font-size: 12px; } .timeUp .ruby .zh { font-size: 26px; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill timer" id="timer">0:00</span>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>
  <div class="timeUp" id="timeUp" hidden><span class="ruby" id="timeUpRuby"></span><span id="timeUpTxt"></span><button class="ctl" id="again2" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="wrap">
        <div class="side">
          <div class="radio" id="radio"></div>
          <button type="button" class="play" id="play">🔊 Listen again</button>
          <div class="kid" id="kid"></div>
          <div class="tip" id="tip"></div>
        </div>
        <div class="main">
          <div class="two" id="s1"><div class="step half" id="am"></div><div class="step half" id="pm"></div></div>
          <div class="step" id="s2" hidden><div class="q" id="tq">How warm is it?</div><div class="opts" id="temps"></div></div>
          <div class="step" id="s3" hidden><div class="q" id="q3"></div><div class="opts" id="go"></div></div>
        </div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/numbers.js"></script>
<script src="../shared/kids.js"></script>
<script src="../shared/npcs.js"></script>
<script src="../units/airport/art.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.forecast, WX = C.weather, WART = window.WART, NUM = window.ShihNum, KIDS = window.ART;
  const $ = id => document.getElementById(id);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh.replace('？', ''), C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  $('timeUpRuby').innerHTML = Shih.ruby('时间到了', 'shí jiān dào le');
  $('q3').innerHTML = `<span class="ruby">${Shih.ruby('能去海滩吗', 'néng qù hǎi tān ma')}</span><span>？</span>`;
  // 收音机
  $('radio').innerHTML = `<svg viewBox="0 0 200 130" aria-hidden="true"><path d="M50 30 L150 6" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/><circle cx="150" cy="6" r="5" fill="#2B2B2B"/>` +
    `<rect x="10" y="30" width="180" height="96" rx="18" fill="#E5483B" stroke="#2B2B2B" stroke-width="4"/><circle cx="62" cy="78" r="32" fill="#FFF6D6" stroke="#2B2B2B" stroke-width="4"/>` +
    [0, 1, 2, 3].map(i => `<path d="M${40 + i * 0} ${66 + i * 8} L${84} ${66 + i * 8}" stroke="#2B2B2B" stroke-width="3"/>`).join('') +
    `<rect x="110" y="48" width="66" height="26" rx="5" fill="#BFE3EE" stroke="#2B2B2B" stroke-width="3"/><circle cx="126" cy="98" r="10" fill="#F5C531" stroke="#2B2B2B" stroke-width="3"/><circle cx="160" cy="98" r="10" fill="#F5C531" stroke="#2B2B2B" stroke-width="3"/></svg>`;
  Shih.soundButton($('soundBtn'));

  // ---- 计时：答对 target 题就马上结束、给金币；时间到了还没达标就没有金币 ----
  const timerEl = $('timer');
  const LIMIT = lv => C.time[lv - 1] * 1000, GOAL = () => C.target[level - 1];
  let left = 0, lastT = 0, tick = 0, running = false;
  const fmt = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  function loop() {
    if (!running) return;
    const now = performance.now(); left -= now - lastT; lastT = now;
    timerEl.textContent = '⏱ ' + fmt(Math.max(0, left)); timerEl.classList.toggle('low', left < 15000);
    if (left <= 0) { finish(); return; }
    tick = requestAnimationFrame(loop);
  }
  function finish() {
    running = false; cancelAnimationFrame(tick);
    if (done >= GOAL()) { $('winTime').textContent = 'Time left: ' + fmt(Math.max(0, left)); $('winMsg').hidden = false; Shih.speak('太棒了'); }
    else { $('timeUpTxt').textContent = `You got ${done} of ${GOAL()}. Try again!`; $('timeUp').hidden = false; Shih.speak('时间到了'); }
  }

  const LEVELS = [{ note: 'Morning & afternoon weather' }, { note: '+ temperature' }, { note: '+ beach or not?' }];
  let level = Shih.startLevel('forecastLevel', 3);
  const paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('forecastLevel', lv); setup(); });
  const HELP = ['Listen to the weather report (🔊 to listen again). Tap the morning sky, then the afternoon sky.',
                'Listen: tap the morning sky, the afternoon sky, then the temperature.',
                `Listen: tap the morning sky, the afternoon sky and the temperature. Can we go to the beach? Yes, if the morning OR the afternoon is sunny or cloudy AND it is ${C.warm}°F or warmer!`];
  const oops = el => { el.classList.remove('oops'); void el.offsetWidth; el.classList.add('oops'); setTimeout(() => el.classList.remove('oops'), 400); };
  const numZh = n => NUM.parts(n).map(x => x[0]).join('');

  let done = 0, q = null, lastW = '', busy = false, kid = null;
  const TIMES = [{ zh: '早上', py: 'zǎo shang', en: 'morning' }, { zh: '下午', py: 'xià wǔ', en: 'afternoon' }];
  // 早上、下午两个天气：不一样；温度要两个都合理（下雪和大太阳不会同一天）；Level 3 最多只有一个时间可以去海滩
  function makeQ() {
    for (let k = 0; k < 200; k++) {
      const [a, b] = shuffle(WX).slice(0, 2);
      if (a.zh + b.zh === lastW) continue;
      const lo = Math.max(a.temp[0], b.temp[0]), hi = Math.min(a.temp[1], b.temp[1]);
      if (hi - lo < 4) continue;
      lastW = a.zh + b.zh;
      return { ws: [a, b], t: rnd(lo, hi) };
    }
  }
  function show() {
    q = makeQ(); busy = false; q.pick = 0;
    const [a, b] = q.ws;
    // Level 3：早上或下午有一个是晴天或多云，而且够热，就去海滩
    q.go = q.ws.some(w => w.beach) && q.t >= C.warm;
    q.say = `早上的天气是${a.zh}，下午的天气是${b.zh}` + (level >= 2 ? `，${numZh(q.t)}度。` : '。');
    $('kid').innerHTML = KIDS.kid(kid, 'soso');
    // 早上、下午各一个框，各自选天气：Level 1 每个框 3 张，Level 2、3 每个框 4 张（另一个时间的答案也会出现，当干扰）
    q.got = [false, false];
    ['am', 'pm'].forEach((id, i) => {
      const ans = q.ws[i], other = q.ws[1 - i];
      const sk = shuffle([ans, other].concat(shuffle(WX.filter(x => x !== ans && x !== other)).slice(0, level === 1 ? 1 : 2)));
      const T = TIMES[i];
      $(id).innerHTML = `<div class="q">${TIME_ICON[i]}<span class="ruby">${Shih.ruby(T.zh + '的天气', T.py + ' de tiān qì')}</span><span class="en">(${T.en})</span></div><div class="skies" style="grid-template-columns: repeat(${level === 1 ? 3 : 4}, minmax(0, 1fr))"></div>`;
      sk.forEach(x => {
        const el = document.createElement('button');
        el.type = 'button'; el.className = 'sk'; el.dataset.zh = x.zh; el.dataset.when = id; el.innerHTML = WART.sky(x.zh);
        el.addEventListener('click', () => tapSky(i, x, el));
        $(id).querySelector('.skies').appendChild(el);
      });
      $(id).classList.remove('done');
    });
    $('s2').hidden = $('s3').hidden = true;
    if (running) Shih.speak(q.say);
    window.__fc = { ws: [a.zh, b.zh], t: q.t, go: q.go, step: 'sky', done };
  }
  // 早上、下午的小图：太阳刚升起来／太阳在高高的天上
  const TIME_ICON = [
    `<svg class="ti" viewBox="0 0 60 40" aria-hidden="true"><rect width="60" height="40" rx="8" fill="#FFD9A8"/><circle cx="30" cy="32" r="12" fill="#F28C28" stroke="#2B2B2B" stroke-width="2.5"/><rect x="0" y="32" width="60" height="8" fill="#7FC4D8" stroke="#2B2B2B" stroke-width="2.5"/></svg>`,
    `<svg class="ti" viewBox="0 0 60 40" aria-hidden="true"><rect width="60" height="40" rx="8" fill="#9ED3F0"/><circle cx="30" cy="14" r="9" fill="#F5C531" stroke="#2B2B2B" stroke-width="2.5"/><rect x="0" y="32" width="60" height="8" fill="#9CCB8A" stroke="#2B2B2B" stroke-width="2.5"/></svg>`
  ];
  function tapSky(i, x, el) {
    if (!running || busy || window.__fc.step !== 'sky' || q.got[i]) return;
    if (x !== q.ws[i]) { oops(el); return; }                            // 选错：摇一摇（不算错）
    el.classList.add('ok'); q.got[i] = true; $(i ? 'pm' : 'am').classList.add('done');
    if (!q.got[0] || !q.got[1]) return;                                 // 两个框都选好了才往下
    if (level === 1) { good(); return; }
    q.tpick = 0; tempStep();
  }
  // 温度三选一（数字颠倒、差十度）
  function tempStep() {
    const t = q.t;
    const flip = Number(String(t).split('').reverse().join(''));
    const ts = [t];
    if (t >= 10 && flip !== t && flip >= 10) ts.push(flip);
    while (ts.length < 3) { const v = t + (Math.random() < .5 ? -1 : 1) * rnd(1, 2) * 10; if (v > 0 && v < 100 && !ts.includes(v)) ts.push(v); }
    $('tq').textContent = 'How warm is it?';
    $('temps').innerHTML = '';
    shuffle(ts).forEach(v => {
      const bt = document.createElement('button');
      bt.type = 'button'; bt.className = 'opt'; bt.textContent = v + '°F';
      bt.addEventListener('click', () => {
        if (!running || window.__fc.step !== 'temp') return;
        if (v !== t) { oops(bt); return; }
        bt.classList.add('ok'); level === 3 ? goStep() : good();      // Level 2 选对温度就过关；Level 3 还要决定去不去
      });
      $('temps').appendChild(bt);
    });
    $('s2').hidden = false; window.__fc.step = 'temp'; window.__fc.tpick = q.tpick;
  }
  // Level 3：去不去海滩？
  function goStep() {
    $('go').innerHTML = '';
    [[C.go, true], [C.nogo, false]].forEach(([g, v]) => {
      const bt = document.createElement('button');
      bt.type = 'button'; bt.className = 'opt'; bt.dataset.go = v ? '1' : '0';
      bt.innerHTML = `<span class="ruby">${Shih.ruby(g.zh.replace(/[！。]/, ''), g.py.replace(/[!.]/, ''))}</span><span class="en">${g.en}</span>`;
      bt.addEventListener('click', () => {
        if (!running || window.__fc.step !== 'go') return;
        if (v !== q.go) { oops(bt); return; }
        bt.classList.add('ok'); Shih.speak(g.zh); good();
      });
      $('go').appendChild(bt);
    });
    $('s3').hidden = false; window.__fc.step = 'go';
  }
  function good() {
    busy = true; done++; update(); window.__fc.step = 'done';
    $('kid').innerHTML = KIDS.kid(kid, 'great');
    if (done >= GOAL()) { running = false; cancelAnimationFrame(tick); setTimeout(finish, 1000); return; }   // 达标了：马上结束，给金币
    setTimeout(() => { if (running) show(); }, 1200);
  }
  function setup() {
    paintLevels(level);
    $('help').textContent = HELP[level - 1] + ` Get ${GOAL()} right in ${fmt(LIMIT(level))} to get coins!`;
    $('tip').innerHTML = C.tips.filter(t => t.lv <= level).map(t => `<span><span class="ruby">${Shih.ruby(t.zh, t.py)}</span>${t.en}</span>`).join('');
    kid = KIDS.people[Math.floor(Math.random() * KIDS.people.length)];
    done = 0; lastW = '';
    running = false; cancelAnimationFrame(tick); left = LIMIT(level); timerEl.textContent = '⏱ ' + fmt(left); timerEl.classList.remove('low');
    $('winMsg').hidden = true; $('timeUp').hidden = true; update();
    show(); wait();
  }
  function update() { $('score').textContent = `${done} / ${GOAL()}`; }
  $('play').addEventListener('click', () => { if (q) Shih.speak(q.say); });
  const wait = Shih.startCover($('playArea'), () => { running = true; lastT = performance.now(); tick = requestAnimationFrame(loop); Shih.speak(q.say); });
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  $('again2').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
