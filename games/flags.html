<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../shared/gate.js"></script>
<title>涂国旗</title>
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/common.css">
<style>
/* 涂国旗（机场）：选颜料（只写中文颜色），点国旗上的格子涂上去。
   Level 1 格子里用英文写颜色（red），颜料是中文；Level 2 看小彩色国旗参考；Level 3 涂好再选「这是＿＿的国旗。」
   答对 target 题就马上结束、给金币。涂错了摇一摇（不算错）。设定在 units/airport/words.js 的 UNIT.flags */
body.game { background: #E3EEF6; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
.side { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.bub { position: relative; width: 100%; box-sizing: border-box; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 20px; padding: 10px 14px; text-align: center; }
.bub::after { content: ''; position: absolute; left: 50%; bottom: -18px; margin-left: -9px; border: 9px solid transparent; border-top: 10px solid #2B2B2B; }
.bub .ruby { flex-wrap: wrap; justify-content: center; } .bub .ruby .py { font-size: 12px; } .bub .ruby .zh { font-size: 24px; }
.bub .again { margin-left: 6px; background: #FFF6D6; border: 2px solid #2B2B2B; border-radius: 10px; font-size: 18px; cursor: pointer; vertical-align: middle; }
.nb { display: inline-flex; white-space: nowrap; gap: 3px; align-items: flex-end; }
.ruby > .nb { flex-direction: row; } .nb > span { display: flex; flex-direction: column; align-items: center; }
.pilot { width: 120px; height: 172px; }
.pilot svg { width: 100%; height: 100%; display: block; }
.main { display: flex; flex-direction: column; gap: 12px; }
.studio { background: #FFFFFF; border: 4px solid #2B2B2B; border-radius: 22px; padding: 14px; display: grid; grid-template-columns: 130px minmax(0, 1fr) 150px; gap: 14px; align-items: center; }
.studio.noref { grid-template-columns: 130px minmax(0, 1fr); }
/* 颜料：只写中文，没有颜色 */
.paints { display: flex; flex-direction: column; gap: 6px; }
.paint { display: flex; align-items: center; justify-content: center; gap: 6px; background: #FFF8EC; border: 3px solid #2B2B2B; border-radius: 14px; padding: 2px 8px; cursor: pointer; font: inherit; }
.paint .ruby .py { font-size: 12px; } .paint .ruby .zh { font-size: 24px; font-weight: 700; }
.paint .brush { width: 22px; height: 22px; }
.paint.on { outline: 4px solid var(--pick); outline-offset: 2px; background: #FFF6D6; }
.flag svg { width: 100%; max-width: 400px; max-height: 42vh; display: block; margin: 0 auto; }
.flag .part { cursor: pointer; transition: fill .2s; }
.flag .part:hover { filter: brightness(.95); }
.flag.oops { animation: shake .35s; }
.ref { text-align: center; font: 600 14px var(--f-latin); color: #555; }
.ref svg { width: 100%; display: block; margin-top: 4px; }
.ref[hidden] { display: none; }
.panel { background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.panel[hidden] { display: none; }
.sent { display: flex; align-items: flex-end; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 64px; }
.sent .ruby .py { font-size: 14px; } .sent .ruby .zh { font-size: 28px; font-weight: 700; }
.sent .dropSlot { min-height: 58px; padding: 2px 8px; box-sizing: border-box; }
.sent .dropSlot:not(.filled) { width: 120px; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.bank .wcard { min-width: 70px; justify-content: center; cursor: pointer; }
.bank .wcard .py { font-size: 13px; } .bank .wcard .zh { font-size: 26px; font-weight: 700; }
.bank .wcard.oops { animation: shake .35s; border-color: var(--bad); }
.timer.low { background: #FCE3E0; border-color: var(--bad); }
.timeUp { text-align: center; background: #FFFFFF; border: 3px solid #2B2B2B; border-radius: 18px; padding: 10px; margin: 0 auto 10px; max-width: 640px; font: 700 18px var(--f-latin); display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.timeUp .ruby .py { font-size: 12px; } .timeUp .ruby .zh { font-size: 26px; }
</style>
</head>
<body class="game">
  <div class="gameHead">
    <div class="gameTitle"><span class="ruby" id="titleRuby"></span><span class="en" id="titleEn"></span></div>
    <div class="controls">
      <span class="pill" id="score">0 / 0</span>
      <span class="pill timer" id="timer">0:00</span>
      <button class="ctl" id="soundBtn" type="button"></button>
      <button class="ctl" id="resetBtn" type="button">Start over</button>
    </div>
  </div>
  <div class="levels" id="levels" aria-label="Level"></div>
  <p class="help" id="help"></p>
  <div class="win" id="winMsg" hidden><span><span class="ruby" id="winRuby"></span> Great job! <span id="winTime"></span></span><button class="ctl" id="againBtn" type="button">Play again</button></div>
  <div class="timeUp" id="timeUp" hidden><span class="ruby" id="timeUpRuby"></span><span id="timeUpTxt"></span><button class="ctl" id="again2" type="button">Play again</button></div>

  <div class="playArea waiting" id="playArea">
    <div class="playInner">
      <div class="wrap">
        <div class="side">
          <div class="bub" id="bub"></div>
          <div class="pilot" id="pilot"></div>
        </div>
        <div class="main">
          <div class="studio" id="studio">
            <div class="paints" id="paints"></div>
            <div class="flag" id="flag"></div>
            <div class="ref" id="ref">Look!<div id="refImg"></div></div>
          </div>
          <div class="panel" id="panel" hidden><div class="sent" id="sent"></div><div class="bank" id="bank"></div></div>
        </div>
      </div>
    </div>
  </div>

<script src="../shared/coins.js"></script>
<script src="../shared/common.js"></script>
<script src="../shared/npcs.js"></script>
<script src="../units/airport/art.js"></script>
<script src="../units/airport/flags.js"></script>
<script>
Shih.islandBar();
Shih.loadUnit().then(UNIT => {
  const C = UNIT.flags, F = window.FLAGS, WART = window.WART;
  const $ = id => document.getElementById(id);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  document.title = `${C.title.zh} ${C.title.en}`;
  $('titleRuby').innerHTML = Shih.ruby(C.title.zh, C.title.py);
  $('titleEn').textContent = C.title.en;
  $('winRuby').innerHTML = Shih.ruby('太棒了', 'tài bàng le');
  $('timeUpRuby').innerHTML = Shih.ruby('时间到了', 'shí jiān dào le');
  Shih.soundButton($('soundBtn'));

  // ---- 计时：答对 target 题就马上结束、给金币；时间到了还没达标就没有金币 ----
  const timerEl = $('timer');
  const LIMIT = lv => C.time[lv - 1] * 1000, GOAL = () => C.target[level - 1];
  let left = 0, lastT = 0, tick = 0, running = false;
  const fmt = ms => { const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  function loop() {
    if (!running) return;
    const now = performance.now(); left -= now - lastT; lastT = now;
    timerEl.textContent = '⏱ ' + fmt(Math.max(0, left)); timerEl.classList.toggle('low', left < 15000);
    if (left <= 0) { finish(); return; }
    tick = requestAnimationFrame(loop);
  }
  function finish() {
    running = false; cancelAnimationFrame(tick);
    if (done >= GOAL()) { $('winTime').textContent = 'Time left: ' + fmt(Math.max(0, left)); $('winMsg').hidden = false; Shih.speak('太棒了'); }
    else { $('timeUpTxt').textContent = `You colored ${done} of ${GOAL()} flags. Try again!`; $('timeUp').hidden = false; Shih.speak('时间到了'); }
  }

  const LEVELS = [{ note: 'Read the color words' }, { note: 'Look at the flag' }, { note: '+ which country?' }];
  let level = Shih.startLevel('flagsLevel', 3);
  const paintLevels = Shih.levelButtons($('levels'), LEVELS, level, null, lv => { level = lv; Shih.set('flagsLevel', lv); setup(); });
  const HELP = ['Each part of the flag says its color in English. Tap the paint with the same color in Chinese, then tap that part.',
                'Look at the small flag. Tap the right paint, then tap the part of the flag to color it.',
                'Color the flag like the small one. Then tell which country it is!'];
  const oops = el => { el.classList.remove('oops'); void el.offsetWidth; el.classList.add('oops'); setTimeout(() => el.classList.remove('oops'), 400); };
  const card = w => `<span class="ruby">${Shih.ruby(w.zh, w.py)}</span>`;
  const BRUSH = `<svg class="brush" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 Q6 14 10 14 L14 18 Q14 22 4 20 Z" fill="#C9A27A" stroke="#2B2B2B" stroke-width="1.8"/><path d="M11 13 L19 4 L21 6 L15 15 Z" fill="#8A5A2B" stroke="#2B2B2B" stroke-width="1.8"/></svg>`;

  let done = 0, q = null, paint = null, busy = false, queue = [];
  function say(zh, py) {
    $('bub').innerHTML = `<span class="ruby">${Shih.rubyText(zh, py)}</span><button type="button" class="again" id="again" aria-label="Listen again">🔊</button>`;
    $('again').addEventListener('click', () => Shih.speak(zh));
    q.say = zh;
    if (running) Shih.speak(zh);
  }
  function show() {
    busy = false; paint = null;
    if (!queue.length) queue = shuffle(F.list.filter(n => level > 1 || F.info(n).simple));
    const name = queue.shift(), info = F.info(name);
    q = { name, info, filled: new Set() };
    if (level === 3) say('请涂这面国旗。', 'qǐng tú zhè miàn guó qí.');
    else say(`请涂${name}的国旗。`, `qǐng tú ${info.py} de guó qí.`);
    // 颜料：六个颜色，只写中文
    $('paints').innerHTML = '';
    C.colors.forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'paint'; b.dataset.c = c.zh; b.innerHTML = BRUSH + card(c);
      b.addEventListener('click', () => { if (!running || busy) return; paint = c.zh; $('paints').querySelectorAll('.paint').forEach(x => x.classList.toggle('on', x === b)); Shih.speak(c.zh); });
      $('paints').appendChild(b);
    });
    $('studio').classList.toggle('noref', level === 1);
    $('ref').hidden = level === 1;
    $('refImg').innerHTML = F.svg(name, { all: true });
    draw();
    $('panel').hidden = true;
    window.__fl = { name, parts: info.parts.map(p => p.c), step: 'paint', done };
  }
  function draw() {
    $('flag').innerHTML = F.svg(q.name, { filled: q.filled, labels: level === 1 });
    $('flag').querySelectorAll('.part').forEach(g => g.addEventListener('click', () => tapPart(+g.dataset.i)));
  }
  function tapPart(i) {
    if (!running || busy || q.filled.has(i)) return;
    const want = q.info.parts[i].c;
    if (!paint) { oops($('paints')); return; }                         // 还没选颜料
    if (paint !== want) { oops($('flag')); return; }                   // 颜色不对：摇一摇（不算错）
    q.filled.add(i); draw();
    if (q.filled.size < q.info.parts.length) return;
    // 涂好了
    if (level < 3) { Shih.speak(`${q.name}的国旗`); good(); return; }
    whichCountry();
  }
  // Level 3：这是哪一个国家的国旗？
  function whichCountry() {
    busy = true;
    say('这是哪一个国家的国旗？', 'zhè shì nǎ yí ge guó jiā de guó qí?');
    const opts = shuffle([q.name].concat(shuffle(F.list.filter(n => n !== q.name)).slice(0, 2)));
    $('sent').innerHTML = `<span class="ruby">${Shih.rubyText('这是', 'zhè shì')}</span><span class="dropSlot" id="slot"></span><span class="ruby">${Shih.rubyText('的国旗。', 'de guó qí.')}</span>`;
    $('bank').innerHTML = '';
    opts.forEach(n => {
      const el = document.createElement('div');
      el.className = 'wcard'; el.dataset.zh = n; el.innerHTML = card({ zh: n, py: F.info(n).py });
      el.addEventListener('click', () => {
        if (!running) return;
        if (n !== q.name) { oops(el); return; }
        el.classList.add('used'); $('slot').classList.add('filled'); $('slot').innerHTML = card({ zh: n, py: F.info(n).py });
        Shih.speak(`这是${n}的国旗。`); good();
      });
      $('bank').appendChild(el);
    });
    $('panel').hidden = false;
    window.__fl.step = 'country';
  }
  function good() {
    busy = true; done++; update();
    if (done >= GOAL()) { running = false; cancelAnimationFrame(tick); setTimeout(finish, 1100); return; }   // 达标了：马上结束，给金币
    setTimeout(() => { if (running) show(); }, 1200);
  }
  function setup() {
    paintLevels(level);
    $('help').textContent = HELP[level - 1] + ` Color ${GOAL()} flags in ${fmt(LIMIT(level))} to get coins!`;
    $('pilot').innerHTML = WART.pilot(Math.random() < .5 ? 'man' : 'woman');
    done = 0; queue = [];
    running = false; cancelAnimationFrame(tick); left = LIMIT(level); timerEl.textContent = '⏱ ' + fmt(left); timerEl.classList.remove('low');
    $('winMsg').hidden = true; $('timeUp').hidden = true; update();
    show(); wait();
  }
  function update() { $('score').textContent = `${done} / ${GOAL()}`; }
  const wait = Shih.startCover($('playArea'), () => { running = true; lastT = performance.now(); tick = requestAnimationFrame(loop); Shih.speak(q.say); });
  $('resetBtn').addEventListener('click', setup);
  $('againBtn').addEventListener('click', setup);
  $('again2').addEventListener('click', setup);
  setup();
});
</script>
</body>
</html>
