<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="shared/gate.js"></script>
<title>Ms. Shih's Chinese Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: one big island map. Each place has a sign; tap a sign to open that place's game menu. */
:root {
  --sea: #BFE3EE;
  --sea-deep: #8CCBDD;
  --sand: #F3DDA6;
  --grass: #B5DB98;
  --grass-deep: #86BD72;
  --ink: #2B2B2B;
  --muted: #5E625E;
  --card: #FFFFFF;
  --line: #CFD2CC;
  --dad: #F2A65A; --dad-ink: #B4471C; --dad-soft: #FFF6E5;
  --mom: #EC8FB3; --mom-ink: #B23D6E; --mom-soft: #FDEEF3;
  --me: #8CC7A0;  --me-ink: #2F7A4D;  --me-soft: #EEF7F1;
  --soon: #B9BDB8;
  --f-zh: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --f-latin: 'Andika', 'Trebuchet MS', system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--sea); color: var(--ink); font-family: var(--f-latin);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
/* 最下面：著作权和联络信箱 */
.siteFoot { text-align: center; font-size: 14px; color: var(--muted); padding-top: 4px; }
.siteFoot a { color: inherit; }
.ruby { display: inline-flex; gap: 3px; align-items: flex-end; }
.ruby > span { display: flex; flex-direction: column; align-items: center; }
.ruby .py { line-height: 1.1; white-space: nowrap; }
.ruby .zh { font-family: var(--f-zh); font-weight: 700; line-height: 1.1; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand .en { font-size: clamp(22px, 3vw, 34px); font-weight: 700; color: #1F5E73; line-height: 1.1; }
.brand .ruby .py { font-size: 15px; color: #1F5E73; } .brand .ruby .zh { font-size: 26px; color: #1F5E73; }
.listBtn {
  font: 700 18px var(--f-latin); color: var(--ink); background: var(--card);
  border: 2px solid var(--ink); border-radius: 12px; padding: 10px 16px; cursor: pointer;
}
button:focus-visible, a:focus-visible { outline: 3px solid #1F5E73; outline-offset: 2px; }

.map { position: relative; width: 100%; aspect-ratio: var(--ar, 1000 / 620); }
/* 手机横着拿：地图照画面的高度缩放，整座岛都看得到 */
@media (orientation: landscape) and (max-height: 720px) {
  body { padding-top: 8px; padding-bottom: 8px; }
  .wrap { gap: 6px; }
  .brand .en { font-size: 18px; } .brand .ruby .py { font-size: 11px; } .brand .ruby .zh { font-size: 18px; }
  .listBtn { font-size: 15px; padding: 6px 12px; }
  .map { width: min(100%, calc((100vh - 84px) * var(--ar, 1000 / 620))); margin: 0 auto; }
}
.goHoliday {
  position: absolute; transform: translate(-50%, -50%); cursor: pointer; font: inherit; color: var(--ink);
  background: #FFFFFF; border: 3px solid var(--ink); border-radius: 12px; padding: 4px 12px 6px; box-shadow: 0 4px 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; line-height: 1.1;
}
.goHoliday .py { font-size: clamp(9px, 1vw, 13px); } .goHoliday .zh { font-size: clamp(14px, 1.7vw, 22px); }
.goHoliday .en { font-size: clamp(10px, 1.1vw, 14px); font-weight: 700; color: #8A4FB8; white-space: nowrap; }
.goHoliday:hover { transform: translate(-50%, calc(-50% - 2px)); }
.back {
  font: 700 18px var(--f-latin); color: var(--ink); background: var(--card);
  border: 2px solid var(--ink); border-radius: 12px; padding: 10px 16px; cursor: pointer;
}
.scene { display: flex; flex-direction: column; gap: 12px; }
.scene.enter { animation: zoomIn .45s ease-out; }
@keyframes zoomIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
body.holiday { background: #CBC3E8; }
.list h3 { margin: 6px 0 -26px; font-size: 24px; color: #1F5E73; }
.list h3 + section { margin-top: 0; }
.list h3:not(:first-child) { margin-top: 18px; padding-top: 22px; border-top: 3px dashed var(--line); }
.map svg.island { position: absolute; inset: 0; width: 100%; height: 100%; }

/* a place sign on the map: tap it to see that place's games */
.spot {
  position: absolute; transform: translate(-50%, -50%); cursor: pointer; font: inherit; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center;
  background: var(--card); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 12px 6px;
  box-shadow: 0 4px 0 var(--c, var(--ink));
}
.spot::before {
  content: ""; position: absolute; top: -9px; right: -9px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--c, var(--me)); border: 2.5px solid var(--ink); animation: bob 2.6s ease-in-out infinite;
}
.spot .py { font-size: clamp(10px, 1.1vw, 14px); } .spot .zh { font-size: clamp(15px, 1.9vw, 24px); }
.spot .en { font-size: clamp(10px, 1.1vw, 14px); font-weight: 700; color: var(--muted); }
.spot:hover { transform: translate(-50%, calc(-50% - 2px)); }
.spot.soon { cursor: default; border-style: dashed; border-color: #8B908A; box-shadow: none; background: rgba(255,255,255,.9); }
.spot.soon::before { display: none; }
.spot.soon:hover { transform: translate(-50%, -50%); }
.spot.soon .zh { color: #4A4E4A; }
.spot.label { cursor: default; box-shadow: none; border-width: 2px; padding: 3px 10px 5px; background: rgba(255,255,255,.92); }
.spot.label::before { display: none; }
.spot.label:hover { transform: translate(-50%, -50%); }
.spot .soonTag { font-size: clamp(9px, 1vw, 12px); color: var(--muted); }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }

.overlay { position: fixed; inset: 0; background: rgba(31,94,115,.35); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.panel {
  width: min(560px, 100%); max-height: 90vh; overflow: auto; background: var(--card); border: 3px solid var(--ink);
  border-radius: 20px; box-shadow: 0 6px 0 var(--ink); padding: 18px; display: flex; flex-direction: column; gap: 14px;
}
.panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.panel-head .py { font-size: 16px; } .panel-head .zh { font-size: 34px; }
.panel-head .en { font-size: 18px; font-weight: 700; color: var(--muted); margin-left: 8px; }
.close { font: 700 22px var(--f-latin); width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); cursor: pointer; flex: none; }
.games { display: flex; flex-direction: column; gap: 10px; }
.game {
  display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px;
  border: 3px solid var(--c, var(--me)); background: var(--cs, var(--me-soft)); color: var(--ink); text-decoration: none;
}
.game .ruby .py { font-size: 14px; } .game .ruby .zh { font-size: 26px; }
.game .en { font-weight: 700; font-size: 17px; }
.game small { display: block; color: var(--muted); font-size: 14px; }
.game .go { margin-left: auto; font-size: 26px; font-weight: 700; }

.list { background: var(--card); border: 3px solid var(--ink); border-radius: 20px; padding: 20px 22px 30px; display: flex; flex-direction: column; gap: 48px; }
.list section { display: flex; flex-direction: column; gap: 12px; }
.list h2 { margin: 0; display: flex; align-items: flex-end; gap: 10px; font-size: 17px; color: var(--muted); padding-bottom: 6px; border-bottom: 2px solid var(--line); }
.list h2 .ruby .zh { font-size: 26px; color: var(--ink); } .list h2 .ruby .py { font-size: 14px; }
.list .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
/* in the list, each card puts the Chinese on top and the English under it, so nothing gets squeezed */
.list .game { display: grid; grid-template-columns: 1fr auto; column-gap: 10px; row-gap: 4px; align-items: start; }
.list .game > .ruby { grid-column: 1; }
.list .game > span:nth-child(2) { grid-column: 1; }
.list .game > .go { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.list .soonline { color: var(--muted); font-size: 15px; margin: 0; }
/* the little walker on the map */
.walker { position: absolute; width: 5.4%; transform: translate(-50%, -96%); pointer-events: none; z-index: 1; }
.walker.left .flip { transform: scaleX(-1); }
.walker .flip > svg { width: 100%; height: auto; display: block; overflow: visible; }
.walker .legL, .walker .legR, .walker .armL, .walker .armR { transform-box: fill-box; transform-origin: 50% 0; }
.walker .armL { transform: rotate(10deg); } .walker .armR { transform: rotate(-10deg); }
/* walking rhythm: quick little steps. Each step (--step) the body hops up and lands with a small squash,
   and it rocks side to side once per stride (two steps). Legs and arms swing the other way from each other. */
.walker { --step: .22s; }
.walker .bodyAll { transform-box: fill-box; transform-origin: 50% 100%; }
.walker.walking .bodyAll { animation: waddle calc(var(--step) * 2) ease-in-out infinite; }
.walker.walking .flip > svg { animation: hop var(--step) infinite; transform-origin: 50% 100%; }
.walker.walking .legL { animation: legCycle calc(var(--step) * 2) ease-in-out infinite; }
.walker.walking .legR { animation: legCycle calc(var(--step) * 2) ease-in-out infinite; animation-delay: calc(var(--step) * -1); }
.walker.walking .armL { animation: armCycle calc(var(--step) * 2) ease-in-out infinite; animation-delay: calc(var(--step) * -1); }
.walker.walking .armR { animation: armCycle calc(var(--step) * 2) ease-in-out infinite; }
@keyframes hop {
  0%   { transform: translateY(0) scale(1.06, .92); animation-timing-function: ease-out; }
  45%  { transform: translateY(-9%) scale(.97, 1.04); animation-timing-function: ease-in; }
  100% { transform: translateY(0) scale(1.06, .92); }
}
.walker .boat { display: none; } .walker.inBoat .boat { display: inline; } .walker.inBoat .legs { display: none; }
.walker.inBoat .armL, .walker.inBoat .armR { animation: none; }
.walker.inBoat .flip > svg { animation: rock .5s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes rock { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes waddle { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes legCycle { 0%, 100% { transform: rotate(28deg); } 50% { transform: rotate(-28deg); } }
@keyframes armCycle { 0%, 100% { transform: rotate(-35deg); } 50% { transform: rotate(35deg); } }
@keyframes rock { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
.spot.label { cursor: pointer; }
.whoPanel { width: min(900px, 100%); max-height: calc(100vh - 24px); overflow: auto; }
.maker { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 640px) { .maker { grid-template-columns: 1fr; } .maker .preview { width: 120px; margin: 0 auto; } }
.maker .preview { background: #E6F4F8; border: 3px solid #BFE3EE; border-radius: 18px; padding: 12px 18px 8px; }
.maker .preview svg { width: 100%; height: auto; display: block; overflow: visible; }
.maker .preview .boat { display: none; }
.maker .rows { display: flex; flex-direction: column; gap: 6px; }
.mrow { display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: center; gap: 8px; }
.mlab { display: flex; flex-direction: column; line-height: 1.1; }
.mlab .ruby .py { font-size: 11px; color: #1F5E73; } .mlab .ruby .zh { font-size: 18px; } .mlab .en { font-size: 12px; color: var(--muted); font-weight: 700; }
.mopts { display: flex; flex-wrap: wrap; gap: 6px; }
.mopt { font: inherit; color: var(--ink); background: var(--card); border: 3px solid var(--line); border-radius: 12px; padding: 3px 10px; cursor: pointer; min-height: 40px; display: flex; align-items: center; }
.mopt .ruby .py { font-size: 10px; } .mopt .ruby .zh { font-size: 17px; }
.mopt[aria-pressed="true"] { border-color: #1F5E73; background: #E6F4F8; box-shadow: 0 0 0 2px #1F5E73; }
.mopt .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); display: block; }
.mopt .sw + .ruby { margin-left: 5px; }
.mopt.face { padding: 2px; } .mopt.face svg { width: 46px; height: 46px; display: block; }
.whoGrid { display: block; }
.whoGrid button { font: 700 15px var(--f-latin); color: var(--ink); background: var(--card); border: 3px solid var(--line); border-radius: 14px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.whoGrid button svg { width: 84px; height: 84px; }
.whoGrid button[aria-pressed="true"] { border-color: #1F5E73; background: #E6F4F8; }
.whoGrid .ruby .py { font-size: 11px; } .whoGrid .ruby .zh { font-size: 17px; }
.coins { display: inline-flex; align-items: center; gap: 4px; font: 700 20px var(--f-latin); color: #8A5A2B; background: #FFF6D6; border: 2px solid #E9B949; border-radius: 999px; padding: 8px 16px; user-select: none; touch-action: none; }
@media (orientation: landscape) and (max-height: 720px) { .coins { font-size: 15px; padding: 4px 10px; } }
.coins .coinIc { width: 1.2em; height: 1.2em; }
#whoBtn { display: flex; align-items: center; gap: 8px; padding: 4px 14px 6px; }
#whoBtn svg { width: 36px; height: 36px; }
#whoBtn .ruby .py { font-size: 11px; } #whoBtn .ruby .zh { font-size: 18px; }
/* Ms. Shih in front of the school, saying hello */
.npc { position: absolute; width: 5.4%; transform: translate(-50%, -100%); z-index: 1; cursor: pointer; background: none; border: 0; padding: 0; }
.npc svg { width: 100%; height: auto; display: block; }
.npc .say { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -6px); background: #fff; border: 2.5px solid var(--ink); border-radius: 12px;
  padding: 2px 8px 4px; white-space: nowrap; display: flex; flex-direction: column; align-items: center; line-height: 1.1; box-shadow: 0 3px 0 var(--ink); }
.npc .say::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 7px solid transparent; border-top-color: var(--ink); }
.npc .say .py { font-size: clamp(8px, .9vw, 12px); color: #1F5E73; } .npc .say .zh { font-size: clamp(12px, 1.5vw, 19px); }
.npc .say .en { font-size: clamp(8px, .85vw, 11px); font-weight: 700; color: var(--muted); }
.npc .say .ruby { gap: 4px; }
.npc.talk .say { animation: pop .3s ease-out; }
.walker .say { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -4px); background: #fff; border: 2.5px solid var(--ink); border-radius: 12px;
  padding: 2px 8px 4px; white-space: nowrap; display: flex; flex-direction: column; align-items: center; line-height: 1.1; box-shadow: 0 3px 0 var(--ink); animation: pop .3s ease-out; }
.walker .say::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border: 7px solid transparent; border-top-color: var(--ink); }
.walker .say .py { font-size: clamp(8px, .9vw, 12px); color: #1F5E73; } .walker .say .zh { font-size: clamp(12px, 1.5vw, 19px); }
.walker .say .en { font-size: clamp(8px, .85vw, 11px); font-weight: 700; color: var(--muted); }
.walker .say .ruby { gap: 4px; }
.walker.talking { z-index: 6; }
.npc.quiet .say { visibility: hidden; }
.gift { position: absolute; width: 3%; transform: translate(-50%, -50%); z-index: 3; pointer-events: none; transition: left .32s ease-in-out, top .32s cubic-bezier(.3, -.8, .7, 1), transform .2s, opacity .2s; }
.gift svg { width: 100%; height: auto; display: block; }
.gift.got { transform: translate(-50%, -50%) scale(.3); opacity: 0; }
.npc.talk svg { animation: npcHop .3s ease-out; }
@keyframes pop { 0% { transform: translate(-50%, -6px) scale(.6); } 100% { transform: translate(-50%, -6px) scale(1); } }
@keyframes npcHop { 50% { transform: translateY(-8%); } }
@media (prefers-reduced-motion: reduce) { .spot::before { animation: none; } .scene.enter { animation: none; } .walker * { animation: none !important; } }

/* ===== 主选单（开始画面） ===== */
#home { position: fixed; inset: 0; z-index: 15; background: rgba(191,227,238,.86); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
.homeCard { background: var(--card); border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 #1F5E73; padding: 18px 28px 24px;
  width: min(860px, 100%); display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 10px 28px; align-items: center; }
.homeTitle { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.homeTitle .ruby .py { font-size: 15px; color: #1F5E73; } .homeTitle .ruby .zh { font-size: 30px; color: #1F5E73; }
.homeTitle .en { font-size: 20px; font-weight: 700; color: #1F5E73; }
.stage { position: relative; background: #E6F4F8; border: 3px solid #BFE3EE; border-radius: 22px; padding: 46px 40px 14px; display: flex; flex-direction: column; align-items: center; }
.stage svg { width: 190px; height: auto; display: block; overflow: visible; }
.stage .boat { display: none; }
.stage .nameTag { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.nameTag { font: 700 20px var(--f-latin); font-family: var(--f-latin), var(--f-zh); background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 2px 14px; white-space: nowrap; box-shadow: 0 3px 0 var(--ink); }
.stage .coins { margin-top: 10px; }
.homeBtns { display: flex; flex-direction: column; gap: 12px; }
.hbtn { font: inherit; color: var(--ink); cursor: pointer; background: var(--card); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink);
  padding: 8px 18px 10px; display: flex; align-items: center; gap: 14px; text-align: left; transition: transform .08s; }
.hbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.hbtn .ic { font-size: 30px; width: 40px; text-align: center; flex: none; }
.hbtn .ic svg { width: 40px; height: 40px; display: block; }
.hbtn .txt { display: flex; flex-direction: column; line-height: 1.15; }
.hbtn .ruby .py { font-size: 13px; color: #1F5E73; } .hbtn .ruby .zh { font-size: 24px; }
.hbtn .en { font-size: 15px; font-weight: 700; color: var(--muted); }
.hbtn.go { background: #8CC7A0; border-color: #2F7A4D; box-shadow: 0 5px 0 #2F7A4D; padding: 12px 18px 14px; }
.hbtn.go .ruby .zh { font-size: 32px; } .hbtn.go .ruby .py { font-size: 15px; color: #1D4D30; } .hbtn.go .en { font-size: 18px; color: #1D4D30; }
.nameForm { display: flex; flex-direction: column; gap: 12px; }
.nameForm .q .ruby .py { font-size: 15px; color: #1F5E73; } .nameForm .q .ruby .zh { font-size: 30px; }
.nameForm .q .en { display: block; font-size: 18px; font-weight: 700; color: var(--muted); }
.nameRow { display: flex; gap: 10px; }
.nameIn { font: 700 26px var(--f-latin); font-family: var(--f-latin), var(--f-zh); flex: 1; min-width: 0; border: 3px solid var(--ink); border-radius: 14px; padding: 8px 14px; }
.nameIn:focus { outline: 3px solid #1F5E73; outline-offset: 2px; }
.nameOk { font: 700 20px var(--f-latin); cursor: pointer; background: #8CC7A0; border: 3px solid #2F7A4D; border-radius: 14px; box-shadow: 0 4px 0 #2F7A4D; padding: 4px 16px; display: flex; flex-direction: column; align-items: center; }
.nameOk .ruby .py { font-size: 12px; } .nameOk .ruby .zh { font-size: 22px; }
.nameMsg { min-height: 26px; font-weight: 700; color: #B4471C; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.nameMsg .ruby .py { font-size: 11px; } .nameMsg .ruby .zh { font-size: 18px; }
.nameHint { font-size: 14px; color: var(--muted); font-weight: 700; }
.mrow .nameRow { max-width: 420px; } .mrow .nameRow .nameIn { font-size: 20px; padding: 3px 10px; } .mrow .nameRow .nameOk { flex-direction: row; gap: 6px; padding: 0 12px; box-shadow: 0 3px 0 #2F7A4D; font-size: 16px; }
.mrow .nameRow .nameOk .ruby .zh { font-size: 18px; } .mrow > div.nameMsg { grid-column: 2; }
.whoGrid button.nameOk { background: #8CC7A0; border: 3px solid #2F7A4D; border-radius: 14px; flex-direction: row; }
.mrow .nameMsg { min-height: 0; font-size: 14px; }
@media (max-width: 700px) { .homeCard { grid-template-columns: 1fr; } .stage svg { width: 110px; } }
@media (orientation: landscape) and (max-height: 720px) {
  .homeCard { padding: 12px 22px 16px; gap: 6px 24px; }
  .homeTitle .ruby .zh { font-size: 24px; } .homeTitle .ruby .py { font-size: 12px; } .homeTitle .en { font-size: 16px; }
  .stage { padding-top: 40px; } .stage svg { width: 160px; }
  .homeBtns { gap: 9px; } .hbtn { padding: 5px 16px 7px; } .hbtn.go { padding: 8px 16px 10px; }
  .hbtn .ruby .zh { font-size: 20px; } .hbtn.go .ruby .zh { font-size: 26px; }
}
/* 快闪活动的牌子：一闪一闪 */
.flashSpot { animation: flashPulse 1.6s ease-in-out infinite; }
@keyframes flashPulse { 50% { box-shadow: 0 0 0 6px rgba(245,197,49,.55), 0 4px 0 var(--ink); } }
@media (prefers-reduced-motion: reduce) { .flashSpot { animation: none; } }
/* 游戏选单：全对可以拿几颗金币 */
.gCoins { display: inline-flex; align-items: center; gap: 3px; font: 700 13px var(--f-latin); color: #8A5A2B; background: #FFF6D6; border: 1.5px solid #E9B949; border-radius: 999px; padding: 0 8px; margin-top: 3px; white-space: nowrap; }
.gCoins .coinIc { width: 14px; height: 14px; }
/* 史老师头上的名牌（跟学生角色的名牌一样）；说话的时候先收起来 */
.npc .nameTag { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -2px); font-size: clamp(9px, 1vw, 14px); padding: 0 7px; border-width: 2px; box-shadow: 0 2px 0 var(--ink); }
.npc:not(.quiet) .nameTag { visibility: hidden; }
/* 地图上：角色头上的名牌 */
.walker .nameTag { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -2px); font-size: clamp(9px, 1vw, 14px); padding: 0 7px; border-width: 2px; box-shadow: 0 2px 0 var(--ink); }
.walker.talking .nameTag { visibility: hidden; }
#whoBtn .nm { font: 700 18px var(--f-latin); font-family: var(--f-latin), var(--f-zh); max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 我的记录 */
.recPanel { width: min(900px, 100%); max-height: calc(100vh - 24px); overflow: auto; }
.recSum { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 12px; }
.recSum .chip { background: #FFF6D6; border: 2px solid #E9B949; border-radius: 14px; padding: 4px 14px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
.recSum .chip b { font-size: 26px; color: #8A5A2B; }
.recSum .ruby .py { font-size: 11px; } .recSum .ruby .zh { font-size: 17px; }
.recSum .coinIc { width: 22px; height: 22px; }
table.rec { width: 100%; border-collapse: collapse; font-size: 16px; }
table.rec th, table.rec td { text-align: left; }
table.rec th { padding: 4px 8px; border-bottom: 3px solid var(--ink); vertical-align: bottom; }
table.rec th .ruby .py { font-size: 10px; } table.rec th .ruby .zh { font-size: 16px; } table.rec th .en { display: block; font-size: 12px; color: var(--muted); }
table.rec td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.rec td.g { font-family: var(--f-zh); font-weight: 700; }
table.rec tr:nth-child(even) td { background: #F6FAFB; }
.recEmpty { text-align: center; padding: 24px; font-weight: 700; color: var(--muted); }
.recEmpty .ruby .py { font-size: 13px; } .recEmpty .ruby .zh { font-size: 24px; color: var(--ink); }
</style>
</head>

function rubyHTML(zh, py) {
  const syl = String(py || '').replace(/[.,?!;:，。？！、\/／]/g, ' ').trim().split(/\s+/).filter(Boolean);
  let k = 0;
  return Array.from(zh).map(c => {
    const p = /[\u3400-\u9fff]/.test(c) ? (syl[k++] || '') : '';
    return `<span><span class="py">${p || '&nbsp;'}</span><span class="zh">${c}</span></span>`;
  }).join('');
}

// ===================================================================
// 小人：在岛上沿着小路走到每个地点；去节日岛会坐船
// 路线图：nodes 是地图上的点（地图宽 1240、高 620），edges 是小路
// places：牌子的中文 → 小人要站的点
// ===================================================================
const WALK = {
  main: {
    nodes: {
      A: [300, 300], B: [440, 322], C: [560, 332], D: [690, 336], E: [820, 345], G: [955, 355], F: [290, 420],
      school: [216, 350], schoolDoor: [265, 258], library: [525, 268], restroom: [388, 556], fountain: [382, 458], P1: [670, 400], plaza: [700, 467], home: [735, 300],
      visitor: [227, 505], bank: [800, 418], dock: [1002, 372], playground: [540, 548]
    },
    edges: [['school', 'A'], ['A', 'schoolDoor'], ['A', 'B'], ['B', 'library'], ['fountain', 'restroom'],  ['B', 'C'], ['C', 'P1'], ['P1', 'plaza'], ['C', 'D'], ['D', 'home'],
            ['D', 'E'], ['E', 'bank'], ['E', 'G'], ['G', 'dock'], ['A', 'F'], ['F', 'visitor'], ['F', 'fountain'], ['fountain', 'playground']],
    places: { '家': 'home', '学校': 'school', '卫生间': 'restroom', '图书馆': 'library', '饮水机': 'fountain', '你好': 'visitor', '数字': 'bank', '游乐场': 'playground' },
    start: 'plaza', dock: 'dock',
    boatOut: [[1002, 372], [1040, 406], [1084, 402]], boatIn: [[1084, 402], [1040, 406], [1002, 372]]
  },
  holiday: {
    nodes: { dock: [410, 440], h1: [480, 398], haunted: [560, 352], h2: [720, 350], market: [880, 346], m1: [700, 430], moon: [690, 516], treat: [711, 298] },
    edges: [['dock', 'h1'], ['h1', 'haunted'], ['haunted', 'h2'], ['h2', 'market'], ['h2', 'm1'], ['m1', 'moon'], ['h2', 'treat']],
    places: { '鬼屋': 'haunted', '感恩节市场': 'market', '中秋节': 'moon' },
    start: 'dock', dock: 'dock',
    boatOut: [[410, 440], [330, 470], [246, 462]], boatIn: [[246, 462], [330, 470], [410, 440]]
  }
};
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = { get: (k, d) => { try { const v = localStorage.getItem('shih:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set: (k, v) => { try { localStorage.setItem('shih:' + k, JSON.stringify(v)); } catch (e) {} } };

// draw the little roads from the route map
Object.entries(WALK).forEach(([id, W]) => {
  const g = document.getElementById('roads-' + id);
  if (!g) return;
  const d = W.edges.map(([a, b]) => `M${W.nodes[a][0]} ${W.nodes[a][1]} L${W.nodes[b][0]} ${W.nodes[b][1]}`).join(' ');
  g.innerHTML = `<path d="${d}" fill="none" stroke="${id === 'main' ? '#E8D29A' : '#C9AE72'}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="${d}" fill="none" stroke="${id === 'main' ? '#F7ECCB' : '#E9D3A0'}" stroke-width="7" stroke-dasharray="1 14" stroke-linecap="round"/>`;
});

// 我的角色：学生自己做的人物（只在地图上走来走去），记在这台电脑上
const ME_DEFAULT = { boy: true, skin: 'light', long: false, hair: 'short', hairColor: 'brown', shirt: '#4A86D0', glasses: false, hat: 'straw' };
const who = () => { const m = Object.assign({}, ME_DEFAULT, store.get('me', {})); m.lashes = !m.boy; return m; };
const HATS = {
  straw: '<g stroke="#2B2B2B" stroke-width="2.5" stroke-linejoin="round"><ellipse cx="70" cy="40" rx="46" ry="10" fill="#F2D27A"/>' +
    '<path d="M44 40 Q46 12 70 12 Q94 12 96 40 Z" fill="#F2D27A"/><path d="M45 34 Q70 42 95 34 L96 40 Q70 46 44 40 Z" fill="#D9603B"/></g>',
  cap: '<g stroke="#2B2B2B" stroke-width="2.5" stroke-linejoin="round"><path d="M41 46 Q42 22 70 22 Q98 22 99 46 Z" fill="#5B9BD5"/>' +
    '<path d="M70 46 L24 46 Q22 54 36 55 L70 52 Z" fill="#3B78B5"/><circle cx="70" cy="22" r="3.5" fill="#3B78B5"/></g>'
};
function face(p, state) {
  if (!window.ART) return '';
  const inner = ART.kid(p, state).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
  return inner + (HATS[p.hat === true ? 'straw' : p.hat] || '');
}
function portrait(p) { return `<svg viewBox="0 0 140 140" aria-hidden="true">${face(p, 'good')}</svg>`; }
// a little chibi person: a big head (from the kid pictures), a small round body, tiny arms and stubby legs
function walkerSVG(p, state) {
  const skin = { light: '#FBDCC8', asian: '#F6D9B5', tan: '#C98E62', dark: '#8D5A3B' }[p.skin] || '#FBDCC8';
  const sw = 'stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round"';
  const arm = cls => `<g class="${cls}"><rect x="-6" y="0" width="12" height="20" rx="6" fill="${p.shirt}" ${sw}/><circle cx="0" cy="22" r="6.5" fill="${skin}" ${sw}/></g>`;
  const leg = (cls, x) => `<g class="${cls}"><rect x="${x}" y="122" width="14" height="22" rx="7" fill="#5B6E9A" ${sw}/><ellipse cx="${x + 7}" cy="146" rx="10" ry="6" fill="#2B2B2B"/></g>`;
  return `<svg viewBox="0 0 140 156" aria-hidden="true"><g class="bodyAll">` +
    `<defs><clipPath id="headClip"><rect x="0" y="0" width="140" height="99"/></clipPath></defs>` +
    `<g class="legs">${leg('legL', 54)}${leg('legR', 72)}</g>` +
    `<g transform="translate(51 100)">${arm('armL')}</g>` +
    `<rect x="50" y="92" width="40" height="36" rx="14" fill="${p.shirt}" ${sw}/>` +
    `<g clip-path="url(#headClip)"><svg x="0" y="0" width="140" height="140" viewBox="0 0 140 140" overflow="visible">${face(p, 'good')}</svg></g>` +
    `<g transform="translate(89 100)">${arm('armR' + (state === 'wave' ? ' up' : ''))}</g>` +
    `<g class="boat" stroke="#2B2B2B" stroke-width="3.5" stroke-linejoin="round"><path d="M8 118 L132 118 L116 152 L24 152 Z" fill="#FFFFFF"/><path d="M18 130 L122 130" stroke="#7FC4D8" stroke-width="4"/></g>` +
    `</g></svg>`;
}

const walker = document.createElement('div');
walker.className = 'walker';
walker.innerHTML = '<div class="flip"></div>';
const flip = walker.firstChild;
const tag = document.createElement('span');
tag.className = 'nameTag';
walker.appendChild(tag);
const myName = () => store.get('name', '');
const escH = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function paintWalker(state) { flip.innerHTML = walkerSVG(who(), state || 'good'); tag.textContent = myName(); tag.hidden = !myName(); }
paintWalker();
let pos = store.get('walker', null);          // { island, node }
function put(island, xy) {
  const map = document.getElementById('map-' + island);
  if (walker.parentNode !== map) map.insertBefore(walker, map.querySelector('svg.island').nextSibling);
  walker.style.left = (xy[0] / 1240 * 100) + '%';
  walker.style.top = (xy[1] / 620 * 100) + '%';
}
function placeAt(island, node) {
  const W = WALK[island];
  if (!W.nodes[node]) node = W.start;
  pos = { island, node };
  store.set('walker', pos);
  put(island, W.nodes[node]);
}
// shortest way along the roads
function route(W, from, to) {
  const prev = { [from]: null }, q = [from];
  while (q.length) {
    const n = q.shift();
    if (n === to) break;
    W.edges.forEach(([a, b]) => {
      const m = a === n ? b : b === n ? a : null;
      if (m && !(m in prev)) { prev[m] = n; q.push(m); }
    });
  }
  if (!(to in prev)) return [W.nodes[to]];
  const out = [];
  for (let n = to; n !== null; n = prev[n]) out.unshift(W.nodes[n]);
  return out;
}
// move along a list of points; when it's done, call done()
let anim = null;
function move(island, pts, done, opts) {
  opts = opts || {};
  stop();
  if (REDUCE || pts.length < 2) { put(island, pts[pts.length - 1]); done && done(); return; }
  const segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(l); total += l; }
  const ms = Math.min(opts.max || 2600, Math.max(opts.min || 600, total / (opts.speed || 0.22)));
  // little quick steps: each step covers about 26 map units (faster walk = quicker steps)
  const v = total / ms * 1000;
  walker.style.setProperty('--step', Math.max(0.15, Math.min(0.26, 26 / v)).toFixed(3) + 's');
  // start gently and slow down at the end
  const ramp = Math.min(0.18, 160 / ms);
  const ease = t => t < ramp ? t * t / (2 * ramp * (1 - ramp)) : t > 1 - ramp ? 1 - (1 - t) * (1 - t) / (2 * ramp * (1 - ramp)) : (t - ramp / 2) / (1 - ramp);
  walker.classList.add(opts.boat ? 'inBoat' : 'walking');
  const t0 = performance.now();
  anim = { done, island, end: pts[pts.length - 1], raf: 0 };
  const step = now => {
    let d = ease(Math.min(1, (now - t0) / ms)) * total, i = 0;
    while (i < segs.length - 1 && d > segs[i]) { d -= segs[i]; i++; }
    const k = segs[i] ? Math.min(1, d / segs[i]) : 1, a = pts[i], b = pts[i + 1];
    walker.classList.toggle('left', b[0] < a[0] - 1 || (walker.classList.contains('left') && Math.abs(b[0] - a[0]) <= 1));
    put(island, [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]);
    if (now - t0 < ms) anim.raf = requestAnimationFrame(step);
    else { const cb = anim.done; anim = null; walker.classList.remove('walking'); if (!opts.keepBoat) walker.classList.remove('inBoat'); cb && cb(); }
  };
  anim.raf = requestAnimationFrame(step);
}
function stop() { if (anim) { cancelAnimationFrame(anim.raf); anim = null; } walker.classList.remove('walking', 'inBoat'); }
function wave() {
  if (REDUCE) return;
  paintWalker('wave');
  clearTimeout(wave.t); wave.t = setTimeout(() => paintWalker(), 900);
}
// tap a sign: walk there, then open the menu. Tap again while walking: jump there right away.
let trip = 0;
function goTo(island, P, btn) {
  const W = WALK[island], node = W.places[P.zh];
  const open = () => { if (btn) openTopic(P, btn); };
  if (!node) { open(); return; }
  const busy = !!anim;
  const my = ++trip;
  if (busy || !pos || pos.island !== island) { stop(); placeAt(island, node); open(); return; }
  if (pos.node === node) { wave(); open(); return; }
  move(island, route(W, pos.node, node), () => {
    if (my !== trip) return;
    placeAt(island, node);
    const M = MEET[island + ':' + node];
    if (M && M.onArrive) { meet(Object.assign({}, M, { thenOpen: true }), my, open); return; }
    const line = SAY_AT[island + ':' + node];
    if (line) { kidSays(line, my); }
    wave(); setTimeout(() => { if (my === trip) open(); }, REDUCE ? 0 : 350);
  });
}
// things the kid says when arriving somewhere (island:place → [Chinese, pinyin, English])
const SAY_AT = {
  'main:fountain': ['我很渴！', 'wǒ hěn kě!', "I'm thirsty!"]
};
function kidSays(line, my) {
  walker.querySelectorAll('.say').forEach(x => x.remove());
  const bub = document.createElement('span');
  bub.className = 'say';
  bub.innerHTML = `<span class="ruby">${rubyHTML(line[0], line[1])}</span><span class="en">${line[2]}</span>`;
  walker.appendChild(bub);
  walker.classList.add('talking');
  sayZh(line[0]);
  setTimeout(() => { bub.remove(); walker.classList.remove('talking'); }, 1500);
}
// the boat: walk to the dock, sail over, and step off on the other island
function sail(to) {
  const from = to === 'holiday' ? 'main' : 'holiday';
  const my = ++trip;
  const boats = { main: document.getElementById('boat-main'), holiday: document.getElementById('boat-holiday') };
  const arrive = () => { Object.values(boats).forEach(b => b && (b.style.visibility = '')); placeAt(to, WALK[to].dock); wave(); };
  if (anim || REDUCE || !pos || pos.island !== from) { stop(); showIsland(to, true); arrive(); return; }
  const W = WALK[from], T = WALK[to];
  move(from, route(W, pos.node, W.dock), () => {
    if (my !== trip) return;
    boats[from] && (boats[from].style.visibility = 'hidden');
    move(from, W.boatOut, () => {
      if (my !== trip) return;
      showIsland(to, true);
      boats[from] && (boats[from].style.visibility = '');
      boats[to] && (boats[to].style.visibility = 'hidden');
      walker.classList.add('inBoat');
      move(to, T.boatIn, () => { if (my !== trip) return; arrive(); }, { boat: true, min: 900 });
    }, { boat: true, min: 700, keepBoat: true });
  });
}

// 金币：在游戏里赚的，记在这台电脑上（老师：按住 3 秒归零）
(function () {
  const el = document.getElementById('coins'), num = document.getElementById('coinNum');
  const paint = () => { num.textContent = +store.get('coins', 0) || 0; };

  addEventListener('pageshow', paint);

})();

// read Chinese out loud (follows the same sound on/off setting as the games)
function sayZh(text, done) {
  let soundOn = true; try { soundOn = JSON.parse(localStorage.getItem('shih:sound') || 'true'); } catch (e) {}
  if (!soundOn || !('speechSynthesis' in window)) { setTimeout(() => done && done(), 600); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find(v => /zh[-_]CN/i.test(v.lang)); if (v) u.voice = v;
  let called = false; const fin = () => { if (!called) { called = true; done && done(); } };
  u.onend = fin; setTimeout(fin, 900);   // 不等太久：最多 0.9 秒就接下一句
  speechSynthesis.speak(u);
}

function makeNpc(island, xy, svg, line) {
  const map = document.getElementById('map-' + island);
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'npc';
  b.style.left = (xy[0] / 1240 * 100) + '%'; b.style.top = (xy[1] / 620 * 100) + '%';
  b.innerHTML = `<span class="say"><span class="ruby">${rubyHTML(line[0], line[1])}</span><span class="en">${line[2]}</span></span>` + svg;
  b.setAttribute('aria-label', line[2]);
  b.classList.add('quiet');
  const N = {
    el: b, island, xy,
    line,
    show() { b.classList.remove('quiet', 'talk'); void b.offsetWidth; b.classList.add('talk'); },
    say(done) { this.show(); sayZh(line[0], () => { done && done(); }); },
    quiet(on) { b.classList.toggle('quiet', on); }
  };
  map.insertBefore(b, map.querySelector('svg.island').nextSibling);
  return N;
}

// the kid says the first line, the grown-up answers, then the present flies over
// 对话一来一往：小朋友先说，0.6 秒后大人回答，同时送东西；不等语音念完（语音会排队接着念）
let meeting = false;
function meet(M, my, open) {
  const N = M.npc;
  if (!N) { open && open(); return; }
  meeting = true;
  walker.classList.toggle('left', N.xy[0] < WALK[N.island].nodes[M.node][0]);   // face the grown-up
  walker.querySelectorAll('.say').forEach(x => x.remove());
  const bub = document.createElement('span');
  bub.className = 'say';
  bub.innerHTML = `<span class="ruby">${rubyHTML(M.kid[0], M.kid[1])}</span><span class="en">${M.kid[2]}</span>`;
  paintWalker('wave'); walker.appendChild(bub); walker.classList.add('talking');
  say(M.kid[0], true);
  const at = WALK[N.island].nodes[M.node];
  setTimeout(() => {
    bub.remove(); walker.classList.remove('talking'); paintWalker();
    if (my !== trip) { meeting = false; return; }
    N.show(); say(N.line[0], false);
    const done = () => {
      wave(); meeting = false;
      if (my === trip && M.thenOpen && open) setTimeout(open, 250);
      setTimeout(() => N.quiet(true), 1200);
    };
    if (M.gift) giftFly(N.island, [N.xy[0], N.xy[1] - 40], [at[0], at[1] - 40], M.gift, done); else done();
  }, 650);
}
// 念出来：第一句先停掉其他声音，第二句排在后面接着念
function say(text, first) {
  let soundOn = true; try { soundOn = JSON.parse(localStorage.getItem('shih:sound') || 'true'); } catch (e) {}
  if (!soundOn || !('speechSynthesis' in window)) return;
  if (first) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = 0.9;
  const v = speechSynthesis.getVoices().find(v => /zh[-_]CN/i.test(v.lang)); if (v) u.voice = v;
  speechSynthesis.speak(u);
}

// walk to a grown-up who has no sign (e.g. the neighbor), then say hello there
function walkToMeet(island, node) {
  if (meeting) return;   // 正在说话的时候，再点也不会重来
  const W = WALK[island], my = ++trip;
  if (anim || !pos || pos.island !== island) { stop(); placeAt(island, node); meet(MEET[island + ':' + node], my); return; }
  if (pos.node === node) { meet(MEET[island + ':' + node], my); return; }
  move(island, route(W, pos.node, node), () => { if (my !== trip) return; placeAt(island, node); meet(MEET[island + ':' + node], my); });
}

// #holiday opens the holiday island; #<place id> (e.g. #haunted-house) opens that place's game menu
(function () {
  const h = decodeURIComponent((location.hash || '').slice(1));
  let start = h === 'holiday' ? 'holiday' : 'main', place = null;
  Object.entries(ISLANDS).forEach(([k, I]) => I.places.forEach(P => { if (P.id && P.id === h) { start = k; place = P; } }));
  showIsland(start, false);
  let entered = false; try { entered = sessionStorage.getItem('shih:inIsland') === '1'; } catch (e) {}
  if ((!h && !entered) || !myName()) showHome();
  // where the walker starts: the place in the link, or where it stopped last time, or the plaza / the dock
  if (place && WALK[start].places[place.zh]) placeAt(start, WALK[start].places[place.zh]);
  else if (pos && pos.island === start) placeAt(start, pos.node);
  else placeAt(start, WALK[start].start);
  // 只有一个游戏的地方（图书馆、游乐场）：回来时小人站在门口就好，不再打开选单
  if (place && place.games && place.games.length > 1) {
    const btn = [...document.querySelectorAll('#scene-' + start + ' .spot')].find(b => (b.getAttribute('aria-label') || '').startsWith(place.zh + ' '));
    openTopic(place, btn || null);
  }
})();
</script>
